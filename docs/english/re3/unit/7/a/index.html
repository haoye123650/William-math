t\":\"reading\"},{\"id\":\"photo-p4-2\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-07/a/photo-p4-116.jpg\",\"alt\":\"Wind turbines on Pillar Mountain, Kodiak, Alaska\",\"caption\":\"Wind turbines on Pillar Mountain, Kodiak, Alaska\",\"bookPage\":\"\",\"placement\":\"reading\"},{\"id\":\"photo-p6\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-07/a/photo-p6-146.jpg\",\"alt\":\"CRITICAL THINKING Evaluating Pros and Cons Discuss the following questions with a partner.\",\"caption\":\"CRITICAL THINKING Evaluating Pros and Cons Discuss the following questions with a partner.\",\"bookPage\":\"\",\"placement\":\"skill\"},{\"id\":\"photo-p7\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-07/a/photo-p7-177.jpg\",\"alt\":\"A. Complete the information using the words from\",\"caption\":\"A. Complete the information using the words from\",\"bookPage\":\"111\",\"placement\":\"exercise\"}],\"blocks\":[{\"id\":\"warmup\",\"kind\":\"warmup\",\"title\":\"Warm Up\",\"assetIds\":[\"photo-p1\"],\"items\":[{\"prompt\":\"What are some\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w1\"},{\"prompt\":\"What sources of\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w2\"}]},{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2\"],\"items\":[{\"prompt\":\"What are some advantages and disadvantages of solar power?\",\"group\":\"A\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"Look at the photo and caption, and answer the questions.\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a1\"},{\"prompt\":\"Aside from solar power, what are some alternative ways of producing energy?\",\"group\":\"A\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"Look at the photo and caption, and answer the questions.\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a2\"},{\"interaction\":\"short-text\",\"prompt\":\"Scan the reading passage. Which countries mentioned in the passage use the alternative energy sources below?\",\"group\":\"B\",\"groupLabel\":\"SCANNING\",\"groupPrompt\":\"Scan the reading passage. Which countries mentioned in the passage use the alternative energy sources below?\",\"skill\":\"SCANNING\",\"paragraphIds\":[],\"id\":\"before-b\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"Powering the Planet\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"Despite modern society’s heavy dependence on fossil fuels for energy, most people are aware that the supply of these fuels is finite. As oil and other fossil fuels become more costly and difficult to find, researchers are looking at alternative energy sources, including solar, wind, and even nuclear power. But which \u003cstrong\u003esubstitute\u003c/strong\u003e—if any—is the right one?\",\"relatedItemIds\":[]},{\"id\":\"B\",\"html\":\"Solar panels catch energy directly from the sun and convert it into electricity. One of the world’s largest solar power stations is in the Indian state of Tamil Nadu, where more than 2.5 million solar panels have the \u003cstrong\u003ecapacity\u003c/strong\u003e to generate enough power for 750,000 people. But unlike the burning of fossil fuels, the process used to create all that solar energy produces no emissions.\",\"relatedItemIds\":[],\"heading\":\"Solar\"},{\"id\":\"C\",\"html\":\"Today, however, solar power provides less than 2 percent of the world’s energy, primarily because the cost of the panels is still very high. But price is only one issue. Clouds and darkness also cause solar panels to produce less energy. This requires that additional power sources (such as batteries) be available.\",\"relatedItemIds\":[]},{\"id\":\"D\",\"html\":\"Some scientists think the solution to this problem can be found in space, which is the ideal place to gather energy from the sun. With no clouds and no nighttime, a space-based solar power station could operate constantly. These stations would send the power back to Earth, which could then be turned into electricity for consumption. Advocates of solar space stations say this technology would initially require a lot of money, but eventually it could provide continuous, clean energy that would be cheaper than other fuels. Also, unlike other energy sources, solar power from space would last as long as the sun shines, and would \u003cstrong\u003eguarantee\u003c/strong\u003e everyone on Earth all the energy they need.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"Wind—the fastest-growing alternative energy source—is another way of collecting energy from the sun. Wind is caused by the sun’s heat rather than its light. Therefore, unlike solar power, wind power works well even on cloudy days.\",\"relatedItemIds\":[],\"heading\":\"Wind\"},{\"id\":\"F\",\"html\":\"All over the world, incentives designed to decrease the dependence on oil and coal have led to a \u003cstrong\u003esteep\u003c/strong\u003e increase in wind-powered energy. Today, Asia leads the world in wind power, producing around 230,000 megawatts,\u003csup\u003e1\u003c/sup\u003e the \u003cstrong\u003eequivalent\u003c/strong\u003e of 230 large coal-powered plants. Europe produces nearly 180,000 megawatts. North America remains a distant third, at 105,000.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"Despite its successes, some people are \u003cstrong\u003eprotesting\u003c/strong\u003e wind-power development, saying the turbines\u003csup\u003e2\u003c/sup\u003e are both noisy and ugly. Just outside England’s Lake District—a protected national park—a dozen existing wind towers are due to be removed. “This is a high-quality landscape,” says one local homeowner. “They shouldn’t be putting those things in here.”\",\"relatedItemIds\":[]},{\"id\":\"H\",\"html\":\"There are other challenges, too. If the wind doesn’t blow, the turbines are not able to produce adequate energy. As a result, other power sources are needed. In contrast, a strong wind can create too much power. In cases like this, the energy company must sell the extra power at a much-reduced rate, which is not good for business.\",\"relatedItemIds\":[]},{\"id\":\"I\",\"html\":\"What’s needed for both wind and solar is a way to store a large energy surplus.\u003csup\u003e3\u003c/sup\u003e However, most systems are still decades away from making this a reality. On the plus side, both wind and solar power enable people to generate their own energy where they live: People can have their own windmills or solar panels, with batteries for calm days.\",\"relatedItemIds\":[]},{\"id\":\"J\",\"html\":\"In the 1970s, nuclear power was seen as the main energy alternative. Nuclear power produces vast amounts of electricity more cheaply than gas or coal, with no carbon emissions. For a number of years in the 1980s and ’90s, however, use of nuclear power \u003cstrong\u003edeclined\u003c/strong\u003e due to accidents, concerns about nuclear waste storage and \u003cstrong\u003edisposal\u003c/strong\u003e, and high construction costs.\",\"relatedItemIds\":[],\"heading\":\"Nuclear\"},{\"id\":\"K\",\"html\":\"Today, times are changing. Worldwide, about 450 plants generate 11 percent of the planet’s electric power, and some countries have invested heavily in nuclear energy. France, for instance, gets three-quarters of its electricity from nuclear power, the highest percentage of any country. China has started to build one or two new plants a year, and India has also begun to \u003cstrong\u003eutilize\u003c/strong\u003e nuclear energy on a large scale.\",\"relatedItemIds\":[]},{\"id\":\"L\",\"html\":\"However, there are still concerns about the safety of nuclear power, as seen, for example, at the Fukushima nuclear power plant in Japan. The country had to close the nuclear reactors at Fukushima when the plant was hit by a tsunami and, as a consequence, began releasing substantial amounts of radioactive materials. Many still believe, however, that nuclear power is one of the future’s greenest energy alternatives.\",\"relatedItemIds\":[]},{\"id\":\"M\",\"html\":\"In the end, are any of these sources alone the answer to our current energy problems? The short answer is no, but used in some combination—along with other power sources— we may find ways to reduce and eventually \u003cstrong\u003eeliminate\u003c/strong\u003e our dependence on fossil fuels.\",\"relatedItemIds\":[\"comp-a5\"]}],\"glossary\":[{\"term\":\"megawatt\",\"def\":\"A megawatt is a unit of power.\",\"anchorParagraphId\":\"F\"},{\"term\":\"turbine\",\"def\":\"A turbine is a machine that uses water, steam, or wind to turn a wheel to produce electricity.\",\"anchorParagraphId\":\"G\"},{\"term\":\"surplus\",\"def\":\"If you have a surplus of something, you have more of it than you need.\",\"anchorParagraphId\":\"I\"}],\"figures\":[{\"assetId\":\"photo-p4\",\"position\":\"after-M\"},{\"assetId\":\"photo-p4-2\",\"position\":\"before-I\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What is this reading mainly about?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"possible replacements for fossil fuels\"},{\"id\":\"b\",\"text\":\"the various causes of the global energy crisis\"},{\"id\":\"c\",\"text\":\"the benefits of solar power over other alternate energy sources\"},{\"id\":\"d\",\"text\":\"problems caused by our overdependence on fossil fuels\"}],\"id\":\"comp-a1\"},{\"prompt\":\"Which of these statements about solar energy is stated in the text?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Solar is currently the biggest contributor to the world’s energy.\"},{\"id\":\"b\",\"text\":\"Solar energy is cheap to produce due to the low price of solar panels.\"},{\"id\":\"c\",\"text\":\"Solar space stations could be the solution to the energy crisis.\"},{\"id\":\"d\",\"text\":\"Solar energy can have a harmful effect on the environment.\"}],\"id\":\"comp-a2\"},{\"prompt\":\"What is NOT mentioned as a disadvantage of wind power?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Strong winds can produce too much power.\"},{\"id\":\"b\",\"text\":\"Strong winds can damage the turbines.\"},{\"id\":\"c\",\"text\":\"The turbines can create a lot of noise.\"},{\"id\":\"d\",\"text\":\"Some people consider the turbines to be ugly.\"}],\"id\":\"comp-a3\"},{\"prompt\":\"Which country gets most of its power from nuclear power?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"France\"},{\"id\":\"c\",\"text\":\"India\"},{\"id\":\"b\",\"text\":\"Japan\"},{\"id\":\"d\",\"text\":\"China\"}],\"id\":\"comp-a4\"},{\"prompt\":\"Which question is closest in meaning to In the end, are any of these sources alone the answer to our current energy problems? (paragraph M)\",\"group\":\"A\",\"groupLabel\":\"PARAPHRASE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"PARAPHRASE\",\"paragraphIds\":[\"M\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Is there an energy source that can solve all of our energy problems on its own?\"},{\"id\":\"b\",\"text\":\"Can our current energy problems be solved by making sure we stop burning fossil fuel?\"},{\"id\":\"c\",\"text\":\"Can we solve our energy problems by using all the alternative energy sources together?\"},{\"id\":\"d\",\"text\":\"Is finding an alternate to fossil fuels the only way to solve our energy problems?\"}],\"id\":\"comp-a5\"},{\"interaction\":\"matching\",\"prompt\":\"Match each energy source with the correct statements(s) (a–f) according to the reading passage. One statement is extra.\",\"group\":\"B\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"Match each energy source with the correct statements(s) (a–f) according to the reading passage. One statement is extra.\",\"skill\":\"MATCHING\",\"choices\":[{\"id\":\"a\",\"text\":\"Its use declined, but is now gaining popularity.\"},{\"id\":\"c\",\"text\":\"It has the potential to produce energy from space.\"},{\"id\":\"e\",\"text\":\"There have been recent concerns about its safety.\"}],\"pairs\":[{\"id\":\"1\",\"text\":\"Solar\"},{\"id\":\"2\",\"text\":\"Wind\"},{\"id\":\"3\",\"text\":\"Nuclear\"}],\"paragraphIds\":[],\"id\":\"comp-b\"}]},{\"id\":\"reading-skill\",\"kind\":\"skill\",\"title\":\"Identifying Pros and Cons (2)\",\"html\":\"A writer sometimes presents the pros and cons of three or more related ideas. Using a chart to compare the advantages (or disadvantages) of each idea can show you which of them may be the\",\"assetIds\":[\"photo-p6\"],\"items\":[{\"prompt\":\"Has constant power supply\",\"group\":\"A\",\"groupLabel\":\"PROS\",\"groupPrompt\":\"Look back at the reading passage. Check (✓) the energy sources used today that have these advantages (1–3). Advantages\",\"skill\":\"PROS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"skill-a1\"},{\"prompt\":\"Produces no carbon emissions\",\"group\":\"A\",\"groupLabel\":\"IDENTIFYING\",\"groupPrompt\":\"Look back at the reading passage. Check (✓) the energy sources used today that have these advantages (1–3). Advantages\",\"skill\":\"IDENTIFYING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"skill-a2\"},{\"prom

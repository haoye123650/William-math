 of these volcanoes as particularly worthy of investigation based on their potential for destruction. The project aims to increase study of these particular volcanoes—their historical timeline for activity, how we can better predict future activity, and, most importantly, what people can do to prepare for an eruption. Mt. Etna reached the city It may seem strange to think of “defending” a town of Catania (foreground). against a volcanic eruption, but the project already boasts several successes. For example, during the 1992 eruption of Mount Etna in Sicily, a lava flow was threatening the town of Zafferana. Local authorities blocked the flow in a tube that was feeding lava from higher up the slope. They dropped large blocks of concrete from helicopters into the tube, successfully plugging and diverting the lava. \b \b \b \b4:[\"$\",\"$Le\",null,{\"lesson\":{\"courseId\":\"re3\",\"unit\":4,\"lessonId\":\"a\",\"type\":\"reading\",\"title\":\"Sacred Summits\",\"theme\":\"Violent Earth\",\"themeZh\":\"剧烈大地\",\"readingSkill\":\"Summarizing a Text\",\"bookPages\":\"57–63\",\"sourcePdf\":\"REX 3_unit 4A.pdf\",\"assets\":[{\"id\":\"photo-p1\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-04/a/photo-p1-10.jpg\",\"alt\":\"Lava flows down the slopes of Mount Mayon, the most active volcano in the Philippines.\",\"caption\":\"Lava flows down the slopes of Mount Mayon, the most active volcano in the Philippines.\",\"bookPage\":\"57\",\"placement\":\"warmup\"},{\"id\":\"photo-p2\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-04/a/photo-p2-57.jpg\",\"alt\":\"Mount Fuji, an active volcano in Japan, last erupted in 1707, sending large clouds of ash into the air. Japan’s native religion, Shintoism, considers\",\"caption\":\"Mount Fuji, an active volcano in Japan, last erupted in 1707, sending large clouds of ash into the air. Japan’s native religion, Shintoism, considers\",\"bookPage\":\"\",\"placement\":\"before-you-read\"},{\"id\":\"photo-p3\",\"kind\":\"photo\",\"src\":\"/englis ,{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2\"],\"items\":[{\"prompt\":\"(for a volcano) threw out melted rock and smoke\",\"group\":\"A\",\"groupLabel\":\"DEFINITIONS\",\"groupPrompt\":\"Read the caption on this page, and match the words in bold with their definitions.\",\"skill\":\"DEFINITIONS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a1\"},{\"prompt\":\"used to describe a volcano that could erupt at any time\",\"group\":\"A\",\"groupLabel\":\"DEFINITIONS\",\"groupPrompt\":\"Read the caption on this page, and match the words in bold with their definitions.\",\"skill\":\"DEFINITIONS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a2\"},{\"prompt\":\"believed to be related to a god or gods, and given respect\",\"group\":\"A\",\"groupLabel\":\"DEFINITIONS\",\"groupPrompt\":\"Read the caption on this page, and match the words in bold with their definitions.\",\"skill\":\"DEFINITIONS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a3\"},{\"prompt\":\"the powder that is left after something burns\",\"group\":\"A\",\"groupLabel\":\"DEFINITIONS\",\"groupPrompt\":\"Read the caption on this page, and match the words in bold with their definitions.\",\"skill\":\"DEFINITIONS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a4\"},{\"interaction\":\"short-text\",\"prompt\":\"You are going to read about two volcanoes. Look quickly at the title, headings, and captions on pages 58–60. Check (✓) the topics you think you’ll read about. religious beliefs Mount Fuji, an active volcano in Japan, last erupted in 1707, sending large clouds of ash into the air. Japan’s native religion, Shintoism, considers Fuji to be a sacred place.\",\"group\":\"B\",\"groupLabel\":\"PREDICTING\",\"groupPrompt\":\"You are going to read about two volcanoes. Look quickly at the title, headings, and captions on pages 58–60. Check (✓) the topics you think you’ll read about. religious beliefs Mount Fuji, an active volcano in Japan, last erupted in 1707, sending large clouds of ash into the air. Japan’s native religion, Shintoism, considers Fuji to be a sacred place.\",\"skill\":\"PREDICTING\",\"paragraphIds\":[],\"id\":\"before-b\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"Sacred Summits\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"Volcanoes are creators and destroyers. They can shape lands and cultures, but can also cause great \u003cstrong\u003edestruction\u003c/strong\u003e and loss of life. Two of the bestknown examples are found at opposite ends of the world, on the Pacific Ring of Fire.\",\"relatedItemIds\":[]},{\"id\":\"B\",\"html\":\"It’s almost sunrise near the \u003cstrong\u003esummit\u003c/strong\u003e of Japan’s Mount Fuji. Exhausted climbers, many of whom have hiked the 3,776 meters through the night to reach this point, stop to watch as the sun begins spreading its golden rays across the mountain. For the climbers, this is an important moment. They have \u003cstrong\u003ewitnessed\u003c/strong\u003e the \u003cstrong\u003edawn\u003c/strong\u003e on Mount Fuji—the highest point in Japan.\",\"relatedItemIds\":[],\"heading\":\"Symbol of Japan\"},{\"id\":\"C\",\"html\":\"Mount Fuji is a sacred site. Japan’s native religion, Shintoism, considers Fuji a holy place. Other people believe the mountain and its waters have the power to make a sick person well. For many, climbing Fuji is also a rite of passage. Some do it as part of a religious journey; for others, it is a test of strength. Whatever their reason, reaching the top in order to stand on Fuji’s summit at sunrise is a must for many Japanese. Every July and August, hundreds of thousands attempt to do so.\",\"relatedItemIds\":[\"comp-a1\"]},{\"id\":\"D\",\"html\":\"Fuji is more than a sacred site and tourist destination, however. It is also an active volcano around which four million people have settled, and it sits just 112 kilometers from the crowded streets of Tokyo. The last time Fuji erupted, in 1707, it sent out a cloud of ash that covered the capital city and darkened the skies for weeks.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"Today, new information has some volcanologists concerned that Fuji may soon erupt again. According to Motoo Ukawa and his associates at the National Research Institute for Earth Science and \u003cstrong\u003eDisaster\u003c/strong\u003e Prevention, there has been an increase in activity under Fuji recently. This activity may be caused by low-frequency earthquakes. Understanding what causes these quakes may help scientists predict when Fuji will come back to life. In the meantime, locals living near Fuji hold special festivals each year to offer gifts to the goddess of the volcano—as they have for generations—so that she will not erupt and destroy the land and its people below.\",\"relatedItemIds\":[]},{\"id\":\"F\",\"html\":\"Halfway across the globe from Fuji, Popocatépetl—one of the world’s tallest and most dangerous active volcanoes—stands just 70 kilometers southeast of Mexico City. Although the volcano (whose name means “smoking mountain”) has erupted many times over the centuries, scientists believe its last great eruption occurred around AD 820. In recent years, Popocatépetl is once again threatening the lives of the people near the mountain; in December 2000, almost 26,000 people were evacuated when El Popo—as Mexicans call the mountain—started to send out ash and smoke. As with all active volcanoes, the question is not \u003cem\u003eif\u003c/em\u003e it will erupt again (an eruption is \u003cstrong\u003einevitable\u003c/strong\u003e); the question is \u003cem\u003ewhen\u003c/em\u003e it will happen.\",\"relatedItemIds\":[],\"heading\":\"Mexico’s Threatening Mountain\"},{\"id\":\"G\",\"html\":\"“Every volcano works in a different way,” explains Carlos Valdés González, a scientist who \u003cstrong\u003emonitors\u003c/strong\u003e El Popo. “What we’re trying to learn here are the symptoms signaling that El Popo will erupt.” These include earthquakes, or any sign that the mountain’s surface is changing or \u003cstrong\u003eexpanding\u003c/strong\u003e. The hope is that scientists will be able to warn people in the surrounding areas so “\\u0007What we’re trying to learn are the symptoms signaling that El Popo will erupt.” they have enough time to evacuate.\u003csup\u003e1\u003c/sup\u003e A powerful eruption could \u003cstrong\u003edisplace\u003c/strong\u003e over 20 million people—people whose lives can be saved if the warning is delivered early enough.\",\"relatedItemIds\":[\"comp-a3\"]},{\"id\":\"H\",\"html\":\"For many people living near El Popo—especially farmers—abandoning their land is unthinkable. As anyone who farms near a volcano knows, the world’s richest soils are volcanic. They produce bananas and coffee in Central America, fine wines in California, and enormous amounts of rice in Indonesia.\",\"relatedItemIds\":[]},{\"id\":\"I\",\"html\":\"Today, many people continue to see El Popo as their \u003cstrong\u003eancestors\u003c/strong\u003e did. According to ancient beliefs, a volcano can be a god, a mountain, and a human all at the same time. To appease\u003csup\u003e2\u003c/sup\u003e El Popo and to ensure rain and a good harvest, locals begin a cycle of ceremonies that starts in March and ends in August. Carrying food and gifts for the volcano, they hike up the mountain. Near the summit, they present their offerings, asking the volcano to protect and provide for one more season. —Carlos Valdés González\",\"relatedItemIds\":[]}],\"glossary\":[{\"term\":\"evacuate\",\"def\":\"If you evacuate from a place, you leave as quickly as possible because of danger.\",\"anchorParagraphId\":\"G\"},{\"term\":\"appease\",\"def\":\"If you appease people, you try to stop them from being angry by giving them something they want.\",\"anchorParagraphId\":\"I\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p4\",\"position\":\"before-F\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What is paragraph C mainly about?\",\"group\":\"A\",\"groupLabel\":\"MAIN IDEA\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"MAIN IDEA\",\"paragraphIds\":[\"C\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"how Mount Fuji became an important religious site\"},{\"id\":\"b\",\"text\":\"the healing properties of Mount Fuji\"},{\"id\":\"c\",\"text\":\"reasons people climb Mount Fuji\"},{\"id\":\"d\",\"text\":\"the visitors to Mount Fuji\"}],\"id\":\"comp-a1\",\"assetIds\":[\"photo-p5\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"Which of these statements about Mount Fuji is NOT true?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"It is in Japan.\"},{\"id\":\"b\",\"text\":\"Scientists believe it may erupt soon.\"},{\"id\":\"c\",\"text\":\"It has erupted recently.\"},{\"id\":\"d\",\"text\":\"Locals have traditions concerning the mountain.\"}],\"id\":\"comp-a2\"},{\"prompt\":\"In paragraph G, line 4, the word symptoms could be replaced with ____ .\",\"group\":\"A\",\"groupLabel\":\"VOCABULARY\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"VOCABULARY\",\"paragraphIds\":[\"G\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"earthquakes\"},{\"id\":\"c\",\"text\":\"sounds\"},{\"id\":\"b\",\"text\":\"signs\"},{\"id\":\"d\",\"text\":\"lessons\"}],\"id\":\"comp-a3\"},{\"prompt\":\"What was the reason for the evacuation from El Popo in 2000?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",

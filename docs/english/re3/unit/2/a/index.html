,\"src\":\"/english/re3/unit-02/a/photo-p4-140.jpg\",\"alt\":\"Textbook photograph\",\"caption\":\"\",\"bookPage\":\"\",\"placement\":\"reading\"},{\"id\":\"photo-p5\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-02/a/photo-p5-143.jpg\",\"alt\":\"Actors in historical costumes prepare to perform a comedy by French playwright Molière.\",\"caption\":\"Actors in historical costumes prepare to perform a comedy by French playwright Molière.\",\"bookPage\":\"27\",\"placement\":\"reading\"},{\"id\":\"photo-p6\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-02/a/photo-p6-153.jpg\",\"alt\":\"A beauty treatment using snails is demonstrated at a salon in Tokyo.\",\"caption\":\"A beauty treatment using snails is demonstrated at a salon in Tokyo.\",\"bookPage\":\"\",\"placement\":\"exercise\"},{\"id\":\"photo-p8\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-02/a/photo-p8-290.jpg\",\"alt\":\"Anita Roddick (1942–2007)\",\"caption\":\"Anita Roddick (1942–2007)\",\"bookPage\":\"\",\"placement\":\"exercise\"}],\"blocks\":[{\"id\":\"warmup\",\"kind\":\"warmup\",\"title\":\"Warm Up\",\"assetIds\":[\"photo-p1\"],\"items\":[{\"prompt\":\"What kinds of things or people would you describe as beautiful?\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions with a partner.\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w1\"},{\"prompt\":\"What do you think the expression “Beauty is only skin deep” means? Do you think it’s true? A Huli Wigman paints his face for a ceremony in Papua New Guinea.\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions with a partner.\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w2\"}]},{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2\"],\"items\":[{\"interaction\":\"short-text\",\"prompt\":\"Read the statements about beauty. Check (✓) the ones you agree with. Then discuss your answers with a partner. I spend a lot of time thinking about my appearance. I think good-looking people have easier lives than other people. I think it’s fine for men to wear makeup. Women are judged on their looks more than men are.\",\"group\":\"A\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"Read the statements about beauty. Check (✓) the ones you agree with. Then discuss your answers with a partner. I spend a lot of time thinking about my appearance. I think good-looking people have easier lives than other people. I think it’s fine for men to wear makeup. Women are judged on their looks more than men are.\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"id\":\"before-a\"},{\"prompt\":\"Do you think people around the world probably have similar ideas about beauty and appearance? Why or why not?\",\"group\":\"B\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"Work with a partner and note answers to these questions. Then read the passage and check your ideas.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-b1\"},{\"prompt\":\"In what ways do you think society and culture influence how we perceive, or regard, beauty?\",\"group\":\"B\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"Work with a partner and note answers to these questions. Then read the passage and check your ideas.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-b2\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"What Is Beauty?\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"The search for beauty spans centuries and continents. Paintings of Egyptians dating back over 4,000 years show both men and women painting their nails and wearing makeup. On the other side of the globe, the ancient Maya of Central America considered crossed eyes\u003csup\u003e1\u003c/sup\u003e beautiful, and hung little balls between children’s eyes to develop this look. In 18th-century France, wealthy noblemen\u003csup\u003e2\u003c/sup\u003e wore large wigs of long white hair to make themselves attractive. In cultures throughout the world, people have gone to extreme lengths to achieve beauty.\",\"relatedItemIds\":[\"skill-a5\"]},{\"id\":\"B\",\"html\":\"Today, people continue to \u003cstrong\u003edevote\u003c/strong\u003e a lot of time and money to their appearance. According to a recent report, one out of three \u003cstrong\u003econsumers\u003c/strong\u003e globally say they are spending more money on beauty and health-care products than ever before. Worldwide, sales of makeup, dieting, hair- and skin-care products—as well as gym memberships and cosmetic surgery\u003csup\u003e3\u003c/sup\u003e—generate billions of dollars every year. And there is at least one good reason for the \u003cstrong\u003edesire\u003c/strong\u003e to be attractive: Beauty is power. Studies suggest that good-looking people make more money, get called on more often in class, and are perceived as friendlier.\",\"relatedItemIds\":[\"skill-a5\"]},{\"id\":\"C\",\"html\":\"But what exactly \u003cem\u003eis\u003c/em\u003e beauty? Trying to define it is difficult, and yet we know it when we see it—or so we think. “Beauty is health,” says one psychologist. “It’s a billboard saying, ‘I’m healthy. I can pass on your genes.’” And our awareness of it may start at a very early age. In one set of studies, six-month-old babies were shown a series of photographs. The faces in the pictures had been rated for attractiveness by a group of college students. In the studies, the babies spent more time looking at the attractive faces than the unattractive ones.\",\"relatedItemIds\":[\"comp-a3\",\"skill-a4\",\"skill-a5\"]},{\"id\":\"D\",\"html\":\"The idea that even babies judge appearance makes perfect sense to many researchers. In studies done by psychologists such as Victor Johnston at New Mexico State University and David Perrett at the University of St. Andrews in Scotland, men regularly showed a preference for women with certain \u003cstrong\u003efeatures\u003c/strong\u003e: larger eyes, clear skin, fuller lips, and a smaller nose and chin. Another study suggests that women prefer men with large shoulders and a narrow waist. According to scientists, the mind unconsciously tells men and women that these traits—the full lips, clear skin, strong shoulders—equal health and genetic well-being. In other words, it’s a fundamental part of human nature to look for these qualities in a mate.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"Not everyone agrees with this \u003cstrong\u003enotion\u003c/strong\u003e, however. “Our hardwiredness can be altered by all sorts of expectations— predominantly cultural,” says C. Loring Brace, an anthropologist at the University of Michigan. What is considered attractive in one culture might not be in another. Look in most Western fashion magazines, for example, and the women on the pages are thin. But is this the “perfect” body type for women worldwide? Douglas Yu, a biologist from Great Britain, and Glenn Shepard, an anthropologist at the University of California at Berkeley, say no. For them, what is considered beautiful is \u003cstrong\u003esubjective\u003c/strong\u003e and varies around the world. Yu and Shepard found in one study, for example, that native peoples in southeast Peru preferred shapes regarded as overweight in Western cultures.\",\"relatedItemIds\":[\"comp-a4\"]},{\"id\":\"F\",\"html\":\"Take another example: In every culture, one’s hairstyle sends a clear message. In the Huli culture of Papua New Guinea, men grow their hair long as a symbol of health and strength. Teenage boys in this culture learn from a young age to style and decorate their hair—a behavior more commonly \u003cstrong\u003eassociated with\u003c/strong\u003e the opposite \u003cstrong\u003egender\u003c/strong\u003e in many cultures. It is also the men in this culture who are the objects of beauty. For certain festivals and celebrations, men dress up and paint their faces. The more colorful a man is, the more masculine\u003csup\u003e4\u003c/sup\u003e—and attractive—he is considered.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"For better or worse, beauty plays a role in our lives. But it is extremely difficult to define exactly what makes one person attractive to another. Although there do seem to be certain physical traits that are considered universally appealing, it is also true that beauty does not always \u003cstrong\u003econform \u003c/strong\u003eto a single, \u003cstrong\u003euniform\u003c/strong\u003e standard. In the end, beauty really is, as the saying goes, in the eye of the beholder.\u003csup\u003e5\u003c/sup\u003e\",\"relatedItemIds\":[\"critical-1\"]}],\"glossary\":[{\"term\":\"Crossed eyes\",\"def\":\"Crossed eyes are eyes that seem to look toward each other.\",\"anchorParagraphId\":\"A\"},{\"term\":\"Noblemen\",\"def\":\"Noblemen are men who belong to a high rank, title, or status.\",\"anchorParagraphId\":\"A\"},{\"term\":\"Cosmetic surgery\",\"def\":\"Cosmetic surgery is surgery done to make someone look more attractive.\",\"anchorParagraphId\":\"B\"},{\"term\":\"Masculine\",\"def\":\"Masculine qualities and things are typical for men, as opposed to women.\",\"anchorParagraphId\":\"F\"},{\"term\":\"behold\",\"def\":\"If you behold something, you look at it.\",\"anchorParagraphId\":\"G\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"after-C\"},{\"assetId\":\"photo-p4\",\"position\":\"before-D\"},{\"assetId\":\"photo-p5\",\"position\":\"before-E\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What is this reading mainly about?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"different ideas about beauty\"},{\"id\":\"b\",\"text\":\"the history of beauty\"},{\"id\":\"c\",\"text\":\"the world’s most beautiful people\"},{\"id\":\"d\",\"text\":\"how beauty is power\"}],\"id\":\"comp-a1\"},{\"prompt\":\"The ancient Maya hung balls between children’s eyes\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"as a form of jewelry\"},{\"id\":\"b\",\"text\":\"to differentiate boys from girls\"},{\"id\":\"c\",\"text\":\"because they thought crossed eyes were beautiful\"},{\"id\":\"d\",\"text\":\"to add an attractive “third” eye A beauty treatment using snails is\"}],\"id\":\"comp-a2\",\"assetIds\":[\"photo-p6\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"In paragraph C, the babies in the study ____ . demonstrated at a salon in Tokyo.\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[\"C\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"were shown photos of attractive students\"},{\"id\":\"b\",\"text\":\"were entered into a beauty contest\"},{\"id\":\"c\",\"text\":\"were rated for their beauty\"},{\"id\":\"d\",\"text\":\"were able to tell attractive from unattractive faces\"}],\"id\":\"comp-a3\"},{\"prompt\":\"In the second sentence of paragraph E, predominantly can be replaced with\",\"group\":\"A\",\"groupLabel\":\"VOCABULARY\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"VOCABULARY\",\"paragraphIds\":[\"E\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"hardly\"},{\"id\":\"c\",\"text\":\"exactly\"},{\"id\":\"b\",\"text\":\"mainly\"},{\"id\":\"d\",\"text\":\"probably\"}],\"id\":\"comp-a4\"},{\"prompt\":\"What determines the beauty of a Huli man in Papua New Guinea?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"how young he is\"},{\"id\":\"c\",\"text\":\"his strength\"},{\"id\":\"b\",\"text\":\"his colorful makeup\"},{\"id\":\"d\",\"text\":\"the size of his mask\"}],\"id\":\"comp-a5\"},{\"prompt\":\"a definition of beauty\",\"group\":\"B\",\"groupLabel\":\"INFORMATION\",\"groupPrompt\":\"Which paragraphs of the reading passage (A–F) contain the following information? Review this reading skill in Unit 1B\",\"skill\":\"INFORMATION\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b3\"},{\"prompt\":\"a reference to the beauty-care industry\",\"group\":\"B\",\"groupLabel\":\"SCANNING FOR\",\"groupPrompt\":\"Which paragraphs of the reading passage (A–F) contain the following information? Review this reading skill in Unit 1B\",\"skill\":\"SCANNING FOR\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b4\"},{\"prompt\":\"an example of a culture where men wear makeup\",\"group\":\"B\",\"groupLabel\":\"SCANNING FOR\",\"groupPrompt\":\"Which paragraphs of the reading passage (A–F) contain the following information? Review this reading skill in Unit 1B\",\"skill\":\"SCANNING FOR\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b5\"},{\"prompt\":\"a time frame\",\"group\":\"B\",\"groupLabel\":\"SCANNING FOR\",\"groupPrompt\":\"Which paragraphs of the reading passage (A–F) contain the following information? Review this reading skill in Unit 1B\",\"skill\":\"SCANNING FOR\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b6\"}]},{\"id\":\"reading-skill\",\"kind\":\"skill\",\"title\":\"Analyzing a Writer’s Claims\",\"html\":\"A reading passage may contain one or more claims—statements that suggest something is true or real—made by the writer. As a reader, it’s important to evaluate these claims to see how well they are supported. There are several ways to support a claim. Claim: In the United States, cosmetic surgery is increasingly popular. • Reason: One reason for this is that certain cosmetic surgeries are becoming more affordable. • Example: Several popular reality-TV shows depict the positive side of the industry. • Statistics: According to the American Society of Plastic Surgeons, there were 17.5 million cosmetic procedures performed in 2017, a 2 percent increase from the year before. • Expert opinion: According to the head surgeon of one leading clinic, more people are now\",\"assetIds\":[],\"items\":[{\"prompt\":\"of $$$ in sales of beauty products + services worldwide • “[O]ur awareness of it may start at a very early age.” (paragraph C)\",\"group\":\"A\",\"groupLabel\":\"CLAIMS\",\"groupPrompt\":\"Look back at paragraphs A–C in the reading passage to complete these student notes. “The search for beauty spans centuries and continents.” (paragraph A) • Egyptian 4,000 y. o. paintings show ppl w/ painted 1 “Today, people continue to devote a lot of time and money to their appearance.” (paragraph B) • 1 out of 3\",\"skill\":\"CLAIMS\",\"paragraphIds\":[\"C\"],\"interaction\":\"short-text\",\"id\":\"skill-a4\"},{\"prompt\":\"-month-old babies spent more time looking at attractive faces than • unattractive ones\",\"group\":\"A\",\"groupLabel\":\"ANALYZING\",\"groupPrompt\":\"Look back at paragraphs A–C in the reading passage to complete these student notes. “The search for beauty spans centuries and continents.” (paragraph A) • Egyptian 4,000 y. o. paintings show ppl w/ painted 1 “Today, people continue to devote a lot of time and money to their appearance.” (paragraph B) • 1 out of 3\",\"skill\":\"ANALYZING\",\"paragraphIds\":[\"A\",\"B\",\"C\"],\"interaction\":\"short-text\",\"id\":\"skill-a5\"},{\"interaction\":\"short-text\",\"prompt\":\"The writer makes claims that perceptions of beauty may or may not be universal. Note down how the writer supports these claims. \\b\",\"group\":\"B\",\"groupLabel\":\"ANALYZING\",\"groupPrompt\":\"The writer makes claims that perceptions of beauty may or may not be universal. Note down how the writer supports these claims. \\b\",\"skill\":\"ANALYZING\",\"paragraphIds\":[],\"id\":\"skill-b\"}]},{\"id\":\"critical-thinking\",\"kind\":\"discuss\",\"title\":\"Critical Thinking\",\"items\":[{\"id\":\"critical-1\",\"interaction\":\"short-text\",\"prompt\":\"Evaluating Claims Discuss these questions with a partner. What do you think the expression “Beauty is in the eye of the beholder” (paragraph G) means? a. Beauty is perceived differently by different people. b. Without vision, we can’t perceive beauty c. Beauty is held in very high regard. Can you think of some examples to support this opinion?\",\"group\":\"CT\",\"groupLabel\":\"Critical Thinking\",\"groupPrompt\":\"Critical Thinking\",\"paragraphIds\":[\"G\"]}]},{\"id\":\"vocabulary\",\"kind\":\"exercise\",\"title\":\"Vocabulary Practice\",\"assetIds\":[],\"items\":[{\"interaction\":\"short-text\",\"prompt\":\"Complete the information using the correct form of the words or phrases in\",\"group\":\"A\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the information using the correct form of the words or phrases in\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"id\":\"vocab-a\",\"assetIds\":[\"photo-p8\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"People don’t have ____ ideas on what beauty is; opinions vary greatly.\",\"group\":\"B\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the sentences using the correct form of the words in the box. One word is extra. desire notion\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"}],\"id\":\"vocab-b1\"},{\"prompt\":\"Nowadays, many people of both ____ buy and use cosmetics.\",\"group\":\"B\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the sentences using the correct form of the words in the box. One word is extra. desire notion\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"interaction\":\"fill-blank\",\"id\":\"vocab-b2\"},{\"prompt\":\"People use makeup to enhance their blush to make their cheeks look pinker and healthier.\",\"group\":\"B\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the sentences using the correct form of the words in the box. One word is extra. desire notion\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"vocab-b3\"},{\"prompt\":\"Our ideas about beauty are highly ____ ; what one person finds attractive may be unattractive to another.\",\"group\":\"B\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the sentences using the correct form of the words in the box. One word is extra. desire notion\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"interaction\":\"fill-blank\",\"id\":\"vocab-b4\"},{\"prompt\":\"The ____ to look young has led to a boom in sales of anti-aging products.\",\"group\":\"B\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the sentences using the correct form of the words in the box. One word is extra. desire notion\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"interaction\":\"fill-blank\",\"id\":\"vocab-b5\"},{\"prompt\":\"There isn’t a ____ standard for indicating shoe size—a men’s size 10 in the U.K is a size 9 in Mexico and a size 273 in Korean.\",\"group\":\"C\",\"groupLabel\":\"WORD LINK\",\"groupPrompt\":\"The word root form, as in uniform, means “shape.” Complete the sentences with the correct form of the words in the box. One word is extra.\",\"skill\":\"WORD LINK\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"}],\"id\":\"vocab-c1\"},{\"prompt\":\"Students are expected to ____ to the rules and regulations written in the school handbook.\",\"group\":\"C\",\"groupLabel\":\"WORD LINK\",\"groupPrompt\":\"The word root form, as in uniform, means “shape.” Complete the sentences with the correct form of the words in the box. One word is extra.\",\"skill\":\"WORD LINK\",\"paragraphIds\":[],\"interaction\":\"fill-blank\",\"bank\":[\"deformed\",\"format\",\"conform\",\"transform\",\"unifo

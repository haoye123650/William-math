\",\"groupPrompt\":\"How much do you know about soccer? Read the sentences (1–4) and choose T (true) or F (false). Then check your ideas when you read the passage.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"},{\"id\":\"F\",\"text\":\"False\"}],\"id\":\"before-a1\",\"answer\":\"T\"},{\"prompt\":\"The modern sport of soccer started in Italy.\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about soccer? Read the sentences (1–4) and choose T (true) or F (false). Then check your ideas when you read the passage.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"},{\"id\":\"F\",\"text\":\"False\"}],\"id\":\"before-a2\",\"answer\":\"F\"},{\"prompt\":\"Globally, more than 200 million people play soccer.\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about soccer? Read the sentences (1–4) and choose T (true) or F (false). Then check your ideas when you read the passage.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"},{\"id\":\"F\",\"text\":\"False\"}],\"id\":\"before-a3\",\"answer\":\"T\"},{\"prompt\":\"Soccer is the most popular sport in Africa.\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about soccer? Read the sentences (1–4) and choose T (true) or F (false). Then check your ideas when you read the passage.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"T\",\"text\":\"True\"},{\"id\":\"F\",\"text\":\"False\"}],\"id\":\"before-a4\",\"answer\":\"T\"},{\"interaction\":\"short-text\",\"prompt\":\"Why is soccer such a popular sport? Note your ideas. Then read the passage and underline the reasons that are mentioned. A soccer game on Mboro Plage beach, Senegal\",\"group\":\"B\",\"groupLabel\":\"PREDICTING\",\"groupPrompt\":\"Why is soccer such a popular sport? Note your ideas. Then read the passage and underline the reasons that are mentioned. A soccer game on Mboro Plage beach, Senegal\",\"skill\":\"PREDICTING\",\"paragraphIds\":[],\"id\":\"before-b\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"The World’s Game\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"Throughout history, humans have played some kind of kicking game. What the world now calls football—or soccer in the United States—began as far back as 2500 b.c.e. with the Chinese game of \u003cem\u003ecuju\u003c/em\u003e. However, the sport we know today originated in Britain. In the 1840s, England’s Football Association \u003cstrong\u003eestablished\u003c/strong\u003e a set of rules, and the modern game was born. Today, more than 200 million players all over the globe participate in the game, truly making soccer the world’s sport.\",\"relatedItemIds\":[\"critical-1\"]},{\"id\":\"B\",\"html\":\"So, why is soccer so popular? Maybe it’s the game’s camaraderie:\u003csup\u003e1\u003c/sup\u003e the feeling that the team on the field is \u003cem\u003eyour\u003c/em\u003e team; their win is \u003cem\u003eyour\u003c/em\u003e \u003cstrong\u003evictory\u003c/strong\u003e, and their loss is \u003cem\u003eyour\u003c/em\u003e \u003cstrong\u003edefeat\u003c/strong\u003e. Or maybe it’s the game’s international quality. In countries like France, England, Spain, and Brazil, major teams have players from many different nations, and these clubs now have fans all over the world. Or perhaps it’s the promise of great wealth. A number of professional soccer players, including Brazil’s Neymar and Nigeria’s Victor Moses, come from poor families. Today, both of these players make millions of euros every year.\",\"relatedItemIds\":[\"comp-a2\"]},{\"id\":\"C\",\"html\":\"Soccer is popular for all of these reasons, but ultimately, the main reason for its \u003cstrong\u003euniversal\u003c/strong\u003e appeal may be this: It’s a simple game. It can be played anywhere with anything—a ball, a can, or even some bags tied together. And anyone can play it. “You don’t need to be rich . . . to play soccer,” says historian Peter Alegi. “You just need a flat space and a ball.”\",\"relatedItemIds\":[\"comp-a3\"]},{\"id\":\"D\",\"html\":\"It is this \u003cstrong\u003eunique\u003c/strong\u003e simplicity that makes soccer the most popular sport in Africa. Here, even in rural areas far from the bright lights and big stadiums, children and adults play the game, often with handmade balls.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"The story of soccer in Africa is a long one. In the 19th century, European colonists\u003csup\u003e2\u003c/sup\u003e brought the game to Africa. Early matches were first played in the South African cities of Cape Town and Port Elizabeth in 1862. In time, the sport spread across the continent. Today, several of the game’s best players come from African nations, including Senegal, Ivory Coast, Ghana, and Nigeria. All over the continent, thousands of soccer academies now \u003cstrong\u003erecruit\u003c/strong\u003e boys from poorer cities and towns to play the game. Many learn to play in their bare feet,\u003csup\u003e3\u003c/sup\u003e and they are tough, creative \u003cstrong\u003ecompetitors\u003c/strong\u003e. Their dream is to play for the national team or to join one of the big clubs in Europe someday. For some, the dream comes true.\",\"relatedItemIds\":[\"comp-a4\"],\"heading\":\"A Love for Soccer\"},{\"id\":\"F\",\"html\":\"But the chance to make money with a professional team is probably not the main reason for soccer’s popularity in Africa. “Soccer is the \u003cstrong\u003epassion\u003c/strong\u003e of everyone here,” says Abubakari Abdul-Ganiyu, a teacher who works with youth clubs in Tamale, Ghana. “It unifies us.” In fact, more than once, the game has helped to bring people together. In Ivory Coast, for example, immigrants\u003csup\u003e4\u003c/sup\u003e and Muslims faced discrimination\u003csup\u003e5\u003c/sup\u003e for years. Yet many of the country’s best soccer players are from Muslim and immigrant families. As a result, the national team has become a symbol of \u003cstrong\u003eunity\u003c/strong\u003e and has helped to promote peace throughout the country.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"All over Africa, soccer is popular with parents and teachers for another reason: It keeps young people—especially boys—in school and out of trouble. “Most clubs in Tamale, Ghana, don’t allow boys to play if they don’t go to school,” explains Abubakari. “We’re trying our best to help young people and to make them \u003cstrong\u003eresponsible\u003c/strong\u003e in society. Soccer helps us do this. For us, soccer is also a tool for hope.”\",\"relatedItemIds\":[\"comp-a5\"]}],\"glossary\":[{\"term\":\"Camaraderie\",\"def\":\"Camaraderie is a feeling of friendship or team spirit among people who share an experience together.\",\"anchorParagraphId\":\"B\"},{\"term\":\"Colonists\",\"def\":\"Colonists are people who settle in a country which is ruled by another country.\",\"anchorParagraphId\":\"E\"},{\"term\":\"in your bare feet\",\"def\":\"If you do something in your bare feet, you do it without shoes.\",\"anchorParagraphId\":\"E\"},{\"term\":\"immigrant\",\"def\":\"An immigrant is a person who comes to live in a country from another country.\",\"anchorParagraphId\":\"F\"},{\"term\":\"face discrimination\",\"def\":\"If you face discrimination, you experience unfair treatment because of your age, gender, etc.\",\"anchorParagraphId\":\"F\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p4\",\"position\":\"after-G\"}]},{\"id\":\"infographic-5\",\"kind\":\"infographic\",\"title\":\"SOCCER WITHOUT BORDERS\",\"assetId\":\"figure-5\",\"html\":\"\"},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"

\",\"group\":\"A\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"Read the caption below. What could be some other uses of VR? Discuss with a partner.\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"id\":\"before-a\"},{\"interaction\":\"short-text\",\"prompt\":\"How might VR be used in the areas below? Note your ideas. Then read the passage to learn more. • Training athletes • Helping with business meetings • Raising environmental awareness A patient experiences a Virtual Reality (VR) therapy session in Marseille, France. VR is an interactive simulation of a realistic environment and visuals.\",\"group\":\"B\",\"groupLabel\":\"PREDICTING\",\"groupPrompt\":\"How might VR be used in the areas below? Note your ideas. Then read the passage to learn more. • Training athletes • Helping with business meetings • Raising environmental awareness A patient experiences a Virtual Reality (VR) therapy session in Marseille, France. VR is an interactive simulation of a realistic environment and visuals.\",\"skill\":\"PREDICTING\",\"paragraphIds\":[],\"id\":\"before-b\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"The Power of Virtual Reality\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"People have talked about the possibilities of virtual reality since the mid-1990s. In this interview, Jeremy Bailenson—director of the Virtual Human Interactive Lab at Stanford University—explains how these possibilities are now becoming real. \u003cstrong\u003eInterviewer:\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003eWhat’s the difference between watching a video and wearing a VR headset?\",\"relatedItemIds\":[]},{\"id\":\"B\",\"html\":\"\u003cstrong\u003eJB:\u003c/strong\u003e The difference is what psychologists call “embodied cognition.” That is, we learn by doing. For a lot of the most important learning events in your life, you actually did something—you walked somewhere or felt something. Similarly, Virtual Reality is active, not \u003cstrong\u003epassive\u003c/strong\u003e. You learn in ways that people have been learning for hundreds of thousands of years: by having an experience.\",\"relatedItemIds\":[]},{\"id\":\"C\",\"html\":\"Our lab studies have shown that, in general, the brain tends to \u003cstrong\u003etreat\u003c/strong\u003e a VR event in a similar way to an \u003cstrong\u003eactual\u003c/strong\u003e event. So there’s a difference between performing an event in a traditional video game and doing it inside VR. \u003cstrong\u003eInterviewer:\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003eYou’ve said that VR can help athletes. What’s an example of that?\",\"relatedItemIds\":[]},{\"id\":\"D\",\"html\":\"\u003cstrong\u003eJB\u003c/strong\u003e\u003cstrong\u003e: \u003c/strong\u003eWe \u003cstrong\u003edemonstrated\u003c/strong\u003e in the 2014 NFL\u003csup\u003e1\u003c/sup\u003e season that VR could help quarterbacks\u003csup\u003e2\u003c/sup\u003e by improving their decision-making accuracy and reducing their reaction times. Carson Palmer is one of the earliest adopters. VR gave him a tool he could use to learn the plays\u003csup\u003e3\u003c/sup\u003e better. Carson had a system in his home. For just a couple minutes a day, after he’d wake up, he’d \u003cstrong\u003ego over\u003c/strong\u003e his plays and mentally practice what he was going to do. It was as though he were actually on the field. But he was in his living room, getting extra practice.\",\"relatedItemIds\":[\"comp-a4\"]},{\"id\":\"E\",\"html\":\"Since then, VR has been used by teams across many sports. The German national soccer team, among others, uses it in their practice quite often. \u003cstrong\u003eInterviewer\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e Explain how VR avatars\u003csup\u003e4\u003c/sup\u003e can improve video conferencing.\",\"relatedItemIds\":[]},{\"id\":\"F\",\"html\":\"\u003cstrong\u003eJB\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e Video conferencing is good for some activities. But it’s not good for an important meeting where intense decisions have to be made. One reason is the eye contact problem. If you look at the camera on the top of your laptop, you don’t see the other person. \u003cstrong\u003eConversely\u003c/strong\u003e, if you look at the other person’s image on your screen, you’re not looking at the camera.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"Psychologists have shown that \u003cem\u003every\u003c/em\u003e\u003cstrong\u003e \u003c/strong\u003esmall changes in things like eye contact, body space, or posture\u003cstrong\u003e \u003c/strong\u003e\u003cstrong\u003ealter\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003ethe way conversations flow. With VR avatars, you can control things like body position and eye contact in a way you can’t do with video \u003cstrong\u003econferences\u003c/strong\u003e. \u003cstrong\u003eInterviewer:\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003eYou have said that VR can help save the planet. How can VR raise awareness of environmental issues?\",\"relatedItemIds\":[]},{\"id\":\"H\",\"html\":\"\u003cstrong\u003eJB\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e One example is an experiment on the island of Ischia, in Italy. Ischia is a marine site that scientists have been studying for decades. Carbon dioxide is destroying its coral and degrading\u003csup\u003e5\u003c/sup\u003e the food web.\u003csup\u003e6\u003c/sup\u003e I can’t bring the entire world to Ischia to show how CO\u003csup\u003e2\u003c/sup\u003e degrades ecosystems. But with VR, I can bring Ischia to \u003cem\u003epeople\u003c/em\u003e.\",\"relatedItemIds\":[]},{\"id\":\"I\",\"html\":\"So, we produced a seven-minute journey that shows how all the oceans will look in about 50 years, based on this one site in Ischia. Using this VR model, people \u003cstrong\u003eget to\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003e be scientists. They explore the effects of CO\u003csup\u003e2\u003c/sup\u003e on various species in the ecosystem, and learn by \u003cem\u003edoing\u003c/em\u003e. \u003cstrong\u003eInterviewer\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e What about the \u003cstrong\u003edownsides\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003eof VR—for example, using it to create violent video games?\",\"relatedItemIds\":[]},{\"id\":\"J\",\"html\":\"\u003cstrong\u003eJB\u003c/strong\u003e\u003cstrong\u003e: \u003c/strong\u003eThe way I think of VR is that we should use it for things that we can’t do in the real world. You should use VR to go to the moon or try becoming someone else. But you \u003cem\u003eshouldn’t\u003c/em\u003e do things that you \u003cem\u003ewouldn’t\u003c/em\u003e do in the real world. \u003cstrong\u003eInterviewer\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e In your opinion, will VR change how we interact with other people in the real world?\",\"relatedItemIds\":[]},{\"id\":\"K\",\"html\":\"\u003cstrong\u003eJB\u003c/strong\u003e\u003cstrong\u003e:\u003c/strong\u003e VR is a tool, just like any other media. But it has a different impact on how we perceive information. That’s because you’re using your body and it’s completely immersive. It’s a big jump in the history of media. But I don’t think it’s going to change who people are. I think we will continue to be the same humans that we have been on the planet for quite some time. And I, for one, am glad of that. \u003cem\u003eThe interview was edited for length and clarity.\u003c/em\u003e\",\"relatedItemIds\":[]}],\"glossary\":[{\"term\":\"NFL\",\"def\":\"The NFL (National Football League) is a professional American football league.\",\"anchorParagraphId\":\"D\"},{\"term\":\"quarterback\",\"def\":\"In American football, the quarterback is a player who directs a team’s attack.\",\"anchorParagraphId\":\"D\"},{\"term\":\"play\",\"def\":\"In sports, a play is a planned action that happens in a game.\",\"anchorParagraphId\":\"D\"},{\"term\":\"avatar\",\"def\":\"An avatar is a 3-D image of a person. In a VR conference, each participant’s avatar appears on screen in the same room.\",\"anchorParagraphId\":\"E\"},{\"term\":\"degrades\",\"def\":\"If a chemical degrades something, it causes it to break down and deteriorate.\",\"anchorParagraphId\":\"H\"},{\"term\":\"food web\",\"def\":\"A food web is a combination of the individual food chains in a community.\",\"anchorParagraphId\":\"H\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p4\",\"position\":\"before-E\"},{\"assetId\":\"photo-p5\",\"position\":\"before-I\"},{\"assetId\":\"photo-p5-2\",\"position\":\"before-I\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What would be the best alternative title for this passage?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"How VR Brings Us All Together\"},{\"id\":\"b\",\"text\":\"The Future of VR Gaming\"},{\"id\":\"c\",\"text\":\"VR: A Useful Tool for the 21st Century\"},{\"id\":\"d\",\"text\":\"Saving the Planet with VR\"}],\"id\":\"comp-a1\"},{\"prompt\":\"Which of these is NOT an example of embodied cognition?\",\"group\":\"A\",\"groupLabel\":\"INFERENCE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"INFERENCE\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"watching a soccer game on TV\"},{\"id\":\"b\",\"text\":\"cooking a meal using a recipe Sales of VR headsets\"},{\"id\":\"c\",\"text\":\"completing a crossword puzzle\"},{\"id\":\"d\",\"text\":\"playing a musical instrument\"}],\"id\":\"comp-a2\",\"assetIds\":[\"photo-p6\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"What is the purpose of the Ischia VR model?\",\"group\":\"A\",\"groupLabel\":\"MAIN IDEA\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"MAIN IDEA\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"to propose a new way of saving sea life near Ischia\"},{\"id\":\"b\",\"text\":\"to recreate what the climate in Italy was like in the past\"},{\"id\":\"c\",\"text\":\"to show how oceans are being damaged by climate change\"},{\"id\":\"d\",\"text\":\"to explain how pollution from Ischia is affecting other areas\"}],\"id\":\"comp-a3\"},{\"prompt\":\"Which of the following is closest in meaning to adopters in paragraph D?\",\"group\":\"A\",\"groupLabel\":\"VOCABULARY\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"VOCABULARY\",\"paragraphIds\":[\"D\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"users\"},{\"id\":\"c\",\"text\":\"athletes\"},{\"id\":\"b\",\"text\":\"inventors\"},{\"id\":\"d\",\"text\":\"quarterbacks\"}],\"id\":\"comp-a4\"},{\"prompt\":\"What is Bailenson’s main point in the final paragraph (K)?\",\"group\":\"A\",\"groupLabel\":\"PARAPHRASE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"PARAPHRASE\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Although VR technology is improving, other media will still be important.\"},{\"id\":\"b\",\"text\":\"VR is a major change, but it will not fundamentally change who we are.\"},{\"id\":\"c\",\"text\":\"It will take several years before people’s lives are really affected by VR.\"},{\"id\":\"d\",\"text\":\"VR’s impact is significant, but many people in the world will not notice it.\"}],\"id\":\"comp-a5\"},{\"prompt\":\"According to Bailenson, how do people learn best?\",\"group\":\"B\",\"groupLabel\":\"ANSWER\",\"groupPrompt\":\"Write short answers. Use no more than three words from the reading passage for each answer.\",\"skill\":\"ANSWER\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b1\"},{\"prompt\":

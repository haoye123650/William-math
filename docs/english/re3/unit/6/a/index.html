\":\"Steamed milk decorates an espresso in what coffee fans call “latte art.”\",\"bookPage\":\"\",\"placement\":\"reading\"},{\"id\":\"photo-p5\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-06/a/photo-p5-272.jpg\",\"alt\":\"Coffee trees produce red or purple fruits, sometimes known as “cherries.”\",\"caption\":\"Coffee trees produce red or purple fruits, sometimes known as “cherries.”\",\"bookPage\":\"93\",\"placement\":\"exercise\"}],\"blocks\":[{\"id\":\"warmup\",\"kind\":\"warmup\",\"title\":\"Warm Up\",\"assetIds\":[\"photo-p1\"],\"items\":[{\"prompt\":\"What things can people\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w1\"},{\"prompt\":\"Is it okay to be addicted\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w2\"}]},{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2\",\"photo-p2-4\",\"photo-p2-5\",\"photo-p2-7\",\"photo-p2-8\",\"photo-p2-9\"],\"items\":[{\"prompt\":\"Espresso coffee, 30 ml ____ b 4\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"fill-blank\",\"id\":\"before-a1\",\"assetIds\":[\"photo-p2-3\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"Milk chocolate bar, 170 g\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a2\"},{\"prompt\":\"Brewed tea, 240 ml cup\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a3\"},{\"prompt\":\"Can of energy drink, 240 ml\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a4\"},{\"prompt\":\"Brewed coffee, 360 ml cup\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a5\"},{\"prompt\":\"Bottle of cola, 600 ml\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a6\"},{\"prompt\":\"Large soda, 1.9 l\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a7\"},{\"prompt\":\"Pain relief medicine (2 tablets)\",\"group\":\"A\",\"groupLabel\":\"MATCHING\",\"groupPrompt\":\"How much caffeine do you think is in each item on this page? Match a letter from the chart (a–h) to each item. Then check your answers on page 104. 6\",\"skill\":\"MATCHING\",\"paragraphIds\":[],\"interaction\":\"true-false\",\"choices\":[{\"id\":\"F\",\"text\":\"False\"}],\"id\":\"before-a8\",\"assetIds\":[\"photo-p2-2\"],\"imagePlacement\":\"beside\"},{\"interaction\":\"short-text\",\"prompt\":\"Do you think caffeine is good or bad for you? 5 Read the passage to check your ideas. 3 2 1\",\"group\":\"B\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"Do you think caffeine is good or bad for you? 5 Read the passage to check your ideas. 3 2 1\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"id\":\"before-b\",\"assetIds\":[\"photo-p2-6\"],\"imagePlacement\":\"beside\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"The World’s Favorite Drug\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"It’s 1:45 a.m., and 21-year-old Thomas Murphy is burning the midnight oil,\u003csup\u003e1\u003c/sup\u003e studying for an important engineering exam he has at 2:00 in the afternoon later today. To stay awake and alert, he’s had two cups of coffee in the last three hours and is now downing a popular energy drink—one that has two to three times the amount of caffeine as a similar sized can of soda. Many students like Murphy, as well as marathon runners, airline pilots, and long-distance travelers, owe their energy to one of humankind’s oldest stimulants:\u003csup\u003e2\u003c/sup\u003e caffeine.\",\"relatedItemIds\":[\"comp-a2\"]},{\"id\":\"B\",\"html\":\"The power to counter\u003csup\u003e3\u003c/sup\u003e physical fatigue\u003csup\u003e4\u003c/sup\u003e and increase alertness is part of the reason caffeine ranks as the world’s most popular mood-altering\u003csup\u003e5\u003c/sup\u003e drug. It is found not only in sodas, energy drinks, coffee, and tea, but in diet pills, pain relievers (like aspirin), and chocolate bars. Many societies around the world have also created entire rituals around the use of caffeine. For example, there’s the café culture of France, the tea ceremony in Japan, and the morning cup of coffee or tea that marks the start of the day in many cultures.\",\"relatedItemIds\":[]},{\"id\":\"C\",\"html\":\"Caffeine is present in many of the foods and drinks we consume, but is it good for us? Charles Czeisler, a scientist and sleep expert at Harvard Medical School, believes that caffeine causes us to lose sleep, which he says is unhealthy. “Without adequate sleep—the typical eight hours—the human body will not function at its best, physically, \u003cstrong\u003ementally\u003c/strong\u003e, or emotionally.” Too often, Czeisler says, we consume caffeine to stay awake, which later makes it impossible for us to get the rest we need.\",\"relatedItemIds\":[]},{\"id\":\"D\",\"html\":\"Health risks have also been tied to caffeine consumption. Over the years, studies have attributed higher rates of certain types of cancer and bone disease to caffeine consumption. To date, however, there is no \u003cstrong\u003eproof\u003c/strong\u003e that caffeine actually causes these diseases.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"A number of scientists, including Roland Griffiths—a professor at the Johns Hopkins School of Medicine in the United States—believe that regular caffeine use causes physical dependence. Heavy caffeine users, Griffiths says, \u003cstrong\u003eexhibit\u003c/strong\u003e similar behaviors. For example, their moods fluctuate from high to low, they get mild to severe headaches, or they feel tired or sad when they can’t have a caffeinated drink. To minimize or stop these feelings, users must consume caffeine—a behavior Griffiths says is characteristic of drug addiction.\",\"relatedItemIds\":[]},{\"id\":\"F\",\"html\":\"Despite these concerns, the general opinion in the scientific community is that caffeine is not dangerous when consumed in moderation.\u003csup\u003e6\u003c/sup\u003e This means having one or two small cups of coffee (about 300 milligrams of caffeine) per day, for example. \u003cstrong\u003eFurthermore\u003c/strong\u003e, a lot of current research \u003cstrong\u003econtradicts\u003c/strong\u003e long-held negative beliefs about caffeine, and suggests that it may, in fact, have health benefits. For instance, studies have shown that caffeine can help ease muscle pain. Because it is a stimulant, caffeine can also help improve one’s mood. Research has also shown that some caffeinated drinks—specifically certain teas—have disease-fighting chemicals that can help the body fight a number of illnesses, including certain types of cancer.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"In addition, as a type of mental stimulant, caffeine increases alertness, memory, and \u003cstrong\u003ereaction\u003c/strong\u003e speed. Because it fights fatigue, it \u003cstrong\u003efacilitates\u003c/strong\u003e performance on tasks like driving, flying, and solving simple math problems. And while it is true that caffeine can increase blood pressure, the effect is usually \u003cstrong\u003etemporary\u003c/strong\u003e and therefore not likely to cause heart trouble. This is especially true if caffeine is consumed in moderation. Moreover, despite its nearly universal use, caffeine has rarely been \u003cstrong\u003eabused\u003c/strong\u003e. “With caffeine, overuse tends to stop itself,” says Jack Bergman, a \u003cstrong\u003especialist\u003c/strong\u003e at Harvard Medical School. If you consume too much, “you get . . . uncomfortable, and you don’t want to continue.”\",\"relatedItemIds\":[\"comp-a4\"]},{\"id\":\"H\",\"html\":\"Caffeine’s behavioral effects are real, but most often mild. Getting that burst of energy, of course, is why many of the world’s most popular drinks contain caffeine. Whether it’s a student drinking coffee before class or a businessperson enjoying tea with lunch, humankind’s favorite stimulant is at work every day, all over the world.\",\"relatedItemIds\":[]}],\"glossary\":[{\"term\":\"burning the midnight oil\",\"def\":\"If someone is burning the midnight oil, they are staying up very late to study or do other work.\",\"anchorParagraphId\":\"A\"},{\"term\":\"stimulant\",\"def\":\"A stimulant is a substance that can temporarily increase the activity of body processes.\",\"anchorParagraphId\":\"A\"},{\"term\":\"counter\",\"def\":\"To counter something is to oppose it.\",\"anchorParagraphId\":\"B\"},{\"term\":\"Fatigue\",\"def\":\"Fatigue is the feeling of extreme tiredness.\",\"anchorParagraphId\":\"B\"},{\"term\":\"mood-altering\",\"def\":\"A mood-altering substance is capable of causing changes in your mood.\",\"anchorParagraphId\":\"B\"},{\"term\":\"in moderation\",\"def\":\"If you do something in moderation (e.g., smoke or drink), you don’t do more than is reasonable.\",\"anchorParagraphId\":\"F\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"after-D\"},{\"assetId\":\"photo-p3-2\",\"position\":\"before-A\"},{\"assetId\":\"photo-p3-3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p3-4\",\"position\":\"after-D\"},{\"assetId\":\"photo-p4\",\"position\":\"after-H\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What is this reading mainly about?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"recent changes in caffeine consumption\"},{\"id\":\"b\",\"text\":\"the dangers of caffeine intake\"},{\"id\":\"c\",\"text\":\"the effects of consuming caffeine\"},{\"id\":\"d\",\"text\":\"healthy and unhealthy caffeine products\"}],\"id\":\"comp-a1\",\"assetIds\":[\"photo-p5\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"In paragraph A, line 7, the word downing could be replaced with\",\"group\":\"A\",\"groupLabel\":\"VOCABULARY\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"VOCABULARY\",\"paragraphIds\":[\"A\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"holding\"},{\"id\":\"c\",\"text\":\"waking\"},{\"id\":\"b\",\"text\":\"decreasing\"},{\"id\":\"d\",\"text\":\"drinking Coffee trees produce red or purple\"}],\"id\":\"comp-a2\"},{\"prompt\":\"Which statement would sleep expert fruits, sometimes known as Charles Czeisler probably agree with? “cherries.”\",\"group\":\"A\",\"groupLabel\":\"INFERENCE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"INFERENCE\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"It’s a good idea to consume caffeine if you want to maintain your energy.\"},{\"id\":\"b\",\"text\":\"Regular consumption of caffeine will make it difficult for you to get enough rest.\"},{\"id\":\"c\",\"text\":\"How caffeine affects your sleep depends on the type of caffeine you consume.\"},{\"id\":\"d\",\"text\":\"Caffeine can help you get an adequate amount of sleep if consumed in moderation.\"}],\"id\":\"comp-a3\"},{\"prompt\":\"Which of the following is closest in meaning to this sentence from paragraph G? Moreover, despite its nearly universal use, caffeine has rarely been abused.\",\"group\":\"A\",\"groupLabel\":\"PARAPHRASE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"PARAPHRASE\",\"paragraphIds\":[\"G\"],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Even though caffeine is widely consumed, there aren’t many instances of misuse.\"},{\"id\":\"b\",\"text\":\"Even though caffeine is often misused, it is consumed all over the world.\"},{\"id\":\"c\",\"text\":\"Because of caffeine’s popularity, addiction is a problem.\"},{\"id\":\"d\",\"text\":\"Caffeine is used all over the world, so it is commonly misused.\"}],\"id\":\"comp-a4\"},{\"prompt\":\"The following sentence would best be placed at the end of which paragraph? Many say they couldn’t live without it.\",\"group\":\"A\",\"groupLabel\":\"COHESION\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"COHESION\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Paragraph A\"},{\"id\":\"c\",\"te  good idea? Why or why not?\",\"group\":\"B\",\"groupLabel\":\"PROS AND\",\"groupPrompt\":\"Answer the questions below with a partner.\",\"skill\":\"PROS AND\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"skill-b1\"},{\"prompt\":\"Look at the chart in activity A. Do you think the reasons for consuming caffeine outweigh the reasons against consuming it? Do you agree with the writer of the reading passage? Explain your answer.\",\"group\":\"B\",\"groupLabel\":\"CONS\",\"groupPrompt\":\"Answer the questions below with a partner.\",\"skill\":\"CONS\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"skill-b2\"}]},{\"id\":\"critical-thinking\",\"kind\":\"discuss\",\"title\":\"Critical Thinking\",\"items\":[{\"id\":\"critical-1\",\"interaction\":\"short-text\",\"prompt\":\"Evaluating Pros and Cons Read the statements about eating chocolate candy. Discuss with a partner and note P (for pro) or C (for con) for each one, or P/C if it can be both. a. b. c. d. e. f. Based on these claims, do you think chocolate is generally positive or negative? What other information or evidence would you want to find out to decide?\",\"group\":\"CT\",\"groupLabel\":\"Critical Thinking\",\"groupPrompt\":\"Critical Thinking\",\"paragraphIds\":[]}]},{\"id\":\"vocabulary\",\"kind\":\"exercise\",\"title\":\"Vocabulary Practice\",\"assetIds\":[],\"items\":[{\"interaction\":\"short-text\",\"prompt\":\"Complete the information below with the correct form of words from the box.\",\"group\":\"A\",\"groupLabel\":\"COMPLETION\",\"groupPrompt\":\"Complete the information below with the correct form of words from the box.\",\"skill\":\"COMPLETION\",\"paragraphIds\":[],\"id\":\"vocab-a\"},{\"prompt\":\"If you facilitate something, you make it ____ .\",\"group\":\"B\",\"groupLabel\":\"DEFINITIONS\",\"groupPrompt\":\"Complete each sentence with the correct answer.\",\"skill\":\"DEFINITIONS\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\

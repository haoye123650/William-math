he brain’s electrical activity as a participant performs\",\"caption\":\"A hearing specialist studies the brain’s electrical activity as a participant performs\",\"bookPage\":\"155\",\"placement\":\"reading\"},{\"id\":\"photo-p4\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-10/a/photo-p4-151.jpg\",\"alt\":\"In this illustration of nerve cells, neurons light up inside the human brain.\",\"caption\":\"In this illustration of nerve cells, neurons light up inside the human brain.\",\"bookPage\":\"\",\"placement\":\"reading\"},{\"id\":\"photo-p5\",\"kind\":\"photo\",\"src\":\"/english/re3/unit-10/a/photo-p5-170.jpg\",\"alt\":\"Textbook photograph\",\"caption\":\"\",\"bookPage\":\"157\",\"placement\":\"exercise\"},{\"id\":\"figure-6\",\"kind\":\"infographic\",\"src\":\"/english/re3/unit-10/a/figure-6.jpg\",\"alt\":\"Book figure\",\"caption\":\"\",\"bookPage\":\"\",\"placement\":\"infographic\"}],\"blocks\":[{\"id\":\"warmup\",\"kind\":\"warmup\",\"title\":\"Warm Up\",\"assetIds\":[\"photo-p1\"],\"items\":[{\"prompt\":\"Do you think you have a In an experiment to test intelligence, a bottlenose\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w1\"},{\"prompt\":\"Which animals do you think are ____ dolphin guides a ball through a maze of pipes.\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w2\"}]},{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2\"],\"items\":[{\"interaction\":\"short-text\",\"prompt\":\"What are some amazing things that the human brain can do? Make a list with a partner. \\b \\b \\b\",\"group\":\"A\",\"groupLabel\":\"DISCUSSION\",\"groupPrompt\":\"What are some amazing things that the human brain can do? Make a list with a partner. \\b \\b \\b\",\"skill\":\"DISCUSSION\",\"paragraphIds\":[],\"id\":\"before-a\"},{\"interaction\":\"short-text\",\"prompt\":\"Which of these brain functions do you think most shape our identity? Discuss with a partner. Then read to check your ideas. ability to store memories ability to express emotions being aware of your own feelings\",\"group\":\"B\",\"groupLabel\":\"PREDICTING\",\"groupPrompt\":\"Which of these brain functions do you think most shape our identity? Discuss with a partner. Then read to check your ideas. ability to store memories ability to express emotions being aware of your own feelings\",\"skill\":\"PREDICTING\",\"paragraphIds\":[],\"id\":\"before-b\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"What’s on Your Mind?\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"The ancient Egyptians thought so little of the brain that when a king died, they removed the brain from his body and threw it away. The Egyptians presumed, like many people before and after them, that consciousness—your mind and your thoughts— existed in the heart.\",\"relatedItemIds\":[]},{\"id\":\"B\",\"html\":\"Now we know that the mind is a product of the brain, but how exactly does this 1.5-kilo piece of matter create a mind that allows you to think about yourself, experience happiness and anger, or remember events that happened 20 minutes or 20 years ago? This isn’t a new question. Today, however, powerful new techniques for visualizing the sources of thought, \u003cstrong\u003eemotion\u003c/strong\u003e, behavior, and memory are \u003cstrong\u003etransforming\u003c/strong\u003e the way we understand the brain and the mind it creates.\",\"relatedItemIds\":[]},{\"id\":\"C\",\"html\":\"Have you ever stopped and thought, “What’s wrong with me today? I just don’t feel like myself”? Perhaps you were more tired or worried than usual—but somehow, you knew that something was different about you. This self-awareness—the ability to think about yourself and how you’re feeling—is an important part of being human.\",\"relatedItemIds\":[]},{\"id\":\"D\",\"html\":\"This part of your mind has its origins in the prefrontal cortex—a region of your brain just behind your forehead that extends to about your ears. Before this area began to \u003cstrong\u003efunction\u003c/strong\u003e (around age two), you didn’t understand that you were a separate individual with your own identity. As this part of your brain developed, you became more aware of yourself and your thoughts and feelings. The temporal lobe—a part of the brain associated with perception and speech—helped you understand and put into words these thoughts and feelings.\",\"relatedItemIds\":[]},{\"id\":\"E\",\"html\":\"Perhaps one of the most important factors involved in shaping our identity is memory. What exactly is a memory? Most scientists define it as a stored pattern of connections between neurons\u003csup\u003e1\u003c/sup\u003e in the brain. Every feeling you remember and every thought you think alters the connections within the \u003cstrong\u003evast\u003c/strong\u003e network of brain cells, and memories are \u003cstrong\u003ereinforced\u003c/strong\u003e, weakened, or newly formed.\",\"relatedItemIds\":[]},{\"id\":\"F\",\"html\":\"Most people’s earliest memories reach back to about age three or so. Very few people remember anything before this time because the part of the brain that helps form long-term memories (the hippocampus) was not yet fully developed. This doesn’t mean earlier memories don’t exist in your mind, though. Some scientists believe highly emotional memories, especially those associated with intense fear, might be stored in another \u003cstrong\u003estructure\u003c/strong\u003e in the brain (the amygdala) that may be functional at birth. Although these memories are not accessible to the \u003cstrong\u003econscious\u003c/strong\u003e mind, they might still shape the way we feel and behave, even into adulthood.\",\"relatedItemIds\":[]},{\"id\":\"G\",\"html\":\"But where do our emotions come from, and how do they shape the people we are and the way we perceive the world? Forty years ago, psychologist Paul Ekman demonstrated that facial expressions used to exhibit certain emotions are recognized by people everywhere. Ekman suggested that these emotions and their corresponding facial expressions evolved to help us deal quickly with situations that can affect our \u003cstrong\u003ewelfare\u003c/strong\u003e.\",\"relatedItemIds\":[]},{\"id\":\"H\",\"html\":\"Though humans may share certain emotions and recognize them in others, we don’t all have the same emotional response to every situation. In fact, most emotional responses are learned and stored in our memories. The smell of freshly cut grass, for example, will generate happy feelings in someone who spent enjoyable childhood summers in the countryside, but not in someone who was forced to work long hours on a farm. Once an emotional association like this is made, it is very difficult to reverse it. “Emotion is the least \u003cstrong\u003eflexible\u003c/strong\u003e part of the brain,” says Ekman. But we can learn to control our emotions by becoming consciously aware of their underlying causes and by not reacting automatically to things in our environment.\",\"relatedItemIds\":[]},{\"id\":\"I\",\"html\":\"But is it really possible to control our emotions? Researcher Richard Davidson has demonstrated that people who experience negative emotions display activity in their right prefrontal cortex. In those with a more positive \u003cstrong\u003eperspective\u003c/strong\u003e, the activity occurs in the left prefrontal cortex. Could we, Davidson wondered, control this activity and shift our mental state away from negative feelings toward a calmer state of mind?\",\"relatedItemIds\":[]},{\"id\":\"J\",\"html\":\"To answer this question, Davidson worked with a group of volunteers in the United States. One group received eight weeks of training using different meditation\u003csup\u003e2\u003c/sup\u003e and relaxation techniques, while another group did not. By the end of the study, those who had meditated had accomplished their goal: They showed a clear shift in brain activity toward the left, “happier” frontal cortex.\",\"relatedItemIds\":[]},{\"id\":\"K\",\"html\":\"For centuries, people have studied the brain, but it is only in recent years that we have really started to learn how it works. Nevertheless, there is still a long way to go before we understand our mind’s many complexities.\",\"relatedItemIds\":[]}],\"glossary\":[],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p4\",\"position\":\"after-K\"}]},{\"id\":\"infographic-6\",\"kind\":\"infographic\",\"title\":\"Infographic\",\"assetId\":\"figure-6\",\"html\":\"Longer reading passages are often organized into sections, each focusing on one main idea; these sections may each consist of one paragraph or more. Some texts label sections with headings; others do not, so it is up to the reader to determine the sections and ideas. One way to quickly identify\"},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[\"photo-p5\"],\"items\":[{\"prompt\":\"What is this reading mainly about?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"how we create memories c. how the mind works\"},{\"id\":\"b\",\"text\":\"mind reading\"},{\"id\":\"d\",\"text\":\"how emotions are processed\"}],\"id\":\"comp-a1\"},{\"prompt\":\"Which of these statements is NOT true?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"Self-awareness develops before the age of two.\"},{\"id\":\"b\",\"text\":\"The prefrontal cortex affects a person’s emotions.\"},{\"id\":\"c\",\"text\":\"The prefrontal cortex is located at the front of the brain.\"},{\"id\":\"d\",\"text\":\"New experiences change the connections between our brain cells.\"}],\"id\":\"comp-a2\"},{\"prompt\":\"Why don’t most people have memories of what happened before they were three years old?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"The prefrontal cortex is not functioning well at this stage.\"},{\"id\":\"b\",\"text\":\"Early memories disappear soon after they are formed.\"},{\"id\":\"c\",\"text\":\"The part of the brain that forms long-term memories is not fully developed.\"},{\"id\":\"d\",\"text\":\"Children tend to forget emotional memories.\"}],\"id\":\"comp-a3\"},{\"prompt\":\"Where is the activity center for negative emotions?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"in the temporal lobe\"},{\"id\":\"c\",\"text\":\"in the left prefrontal cortex\"},{\"id\":\"b\",\"text\":\"in the hippocampus\"},{\"id\":\"d\",\"text\":\"in the right prefrontal cortex\"}],\"id\":\"comp-a4\"},{\"prompt\":\"According to researcher Richard Davidson, what helps people shift away from a negative state of mind?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"meditation and relaxation\"},{\"id\":\"b\",\"text\":\"memory-retention techniques\"},{\"id\":\"c\",\"text\":\"changing facial expressions\"},{\"id\":\"d\",\"text\":\"being conscious of underlying emotions\"}],\"id\":\"comp-a5\"},{\"prompt\":\"helps people form long-term temporal lobe memories prefrontal cortex\",\"group\":\"B\",\"groupLabel\":\"LABELING\",\"groupPrompt\":\"Use information from the reading passage to match the parts of the brain with their function (1–4).\",\"skill\":\"LABELING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b1\"},{\"prompt\":\"stores emotional memories, such as fear\",\"group\":\"B\",\"groupLabel\":\"LABELING\",\"groupPrompt\":\"Use information from the reading passage to match the parts of the brain with their function (1–4).\",\"skill\":\"LABELING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b2\"},{\"prompt\":\"is associated with speech amygdala and perception\",\"group\":\"B\",\"groupLabel\":\"LABELING\",\"groupPrompt\":\"Use information from the reading passage to match the parts of the brain with their function (1–4).\",\"skill\":\"LABELING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b3\"},{\"prompt\":\"is key to an individual’s self-awareness\",\"group\":\"B\",\"groupLabel\":\"LABELING\",\"groupPrompt\":\"Use information from the reading passage to match the parts of the brain with their function (1–4).\",\"skill\":\"LABELING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"comp-b4\"}]},{\"id\":\"reading-skill\",\"kind\":\"skill\",\"title\":\"Identifying Text Organization\",\"html\":\"Longer reading passages are often organized into sections, each focusing on one main idea; these sections may each consist of one paragraph or more. Some texts label sections with headings; others do not, so it is up to the reader to determine the sections and ideas. One way to quickly identify sections and main ideas is to read the first line of each paragraph and skim the rest. Understanding each section’s main idea can be useful for creating a word web to summarize the reading.\",\"assetIds\":[\"figure-6\"],\"items\":[{\"interaction\":\"multiple-choice\",\"prompt\":\"Look back at the reading “What’s On Your Mind?” Match the best heading (a–e) to each section. There is one extra heading.\",\"group\":\"A\",\"groupLabel\":\"IDENTIFYING\

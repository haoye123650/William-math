ise\"}],\"blocks\":[{\"id\":\"warmup\",\"kind\":\"warmup\",\"title\":\"Warm Up\",\"assetIds\":[\"photo-p1\"],\"items\":[{\"prompt\":\"What animals can you think of that A 24-day-old Bengal slow loris at the Endangered Primate\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions with a partner.\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w1\"},{\"prompt\":\"What are some reasons that animals\",\"group\":\"W\",\"groupPrompt\":\"Discuss these questions with a partner.\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"warm-w2\"}]},{\"id\":\"before-you-read\",\"kind\":\"exercise\",\"title\":\"Before You Read\",\"assetIds\":[\"photo-p2-2\"],\"items\":[{\"prompt\":\"A koala’s diet consists mainly of tree nuts / tree leaves.\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about koalas? Read each sentence (1–3) and circle the answer.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a1\"},{\"prompt\":\"Baby koalas live for several months with their father / in their mother’s pouch.1\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about koalas? Read each sentence (1–3) and circle the answer.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a2\"},{\"prompt\":\"There used to be 10 million koalas in the wild. Today, there are about 80,000 / 800,000 koalas left in the wild.\",\"group\":\"A\",\"groupLabel\":\"PREVIEWING\",\"groupPrompt\":\"How much do you know about koalas? Read each sentence (1–3) and circle the answer.\",\"skill\":\"PREVIEWING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-a3\"},{\"prompt\":\"A pouch is a pocket-like place Caregiver Anika Lehmann looks after a koala named Talisa before releasing her back into the wild.\",\"group\":\"B\",\"groupLabel\":\"PREDICTING\",\"groupPrompt\":\"Read the title and headings in the passage. Why do you think koalas are at risk? List some possible reasons. Check your ideas as you read the passage. \\b \\b\",\"skill\":\"PREDICTING\",\"paragraphIds\":[],\"interaction\":\"short-text\",\"id\":\"before-b1\",\"assetIds\":[\"photo-p2\"],\"imagePlacement\":\"beside\"}]},{\"id\":\"reading\",\"kind\":\"passage\",\"title\":\"Racing to Rescue Koalas\",\"paragraphs\":[{\"id\":\"A\",\"html\":\"It’s two in the morning, and a koala is caught on a fence, like a prisoner trying to escape. A phone rings in the home of Megan Aitken in a \u003cstrong\u003esuburb\u003c/strong\u003e of Brisbane, on the east coast of Australia. Aitken runs a volunteer organization devoted to rescuing wild koalas. Before she is told the location, she has already thrown her clothes over her pajamas, ready to head out.\",\"relatedItemIds\":[]},{\"id\":\"B\",\"html\":\"When Aitken arrives on the scene, two other volunteers—Jane Davies and Sandra Peachey—are already there. They discover that the koala’s fur is caught in the barbed wire.\u003csup\u003e1\u003c/sup\u003e Nearby, they notice tall eucalyptus trees. “He was obviously trying to get to the trees on the other side,” Aitken says.\",\"relatedItemIds\":[\"skill-a1\"]},{\"id\":\"C\",\"html\":\"Aitken puts on heavy gloves. Despite their cute appearance, koalas can be ferocious when resisting \u003cstrong\u003ecapture\u003c/strong\u003e. If they feel \u003cstrong\u003ethreatened\u003c/strong\u003e, they bite, and Aitken has the scars to prove it. The volunteers get to work. Davies throws a blanket over the animal, while Peachey opens the lid of a cage. Aitken firmly \u003cstrong\u003egrasps\u003c/strong\u003e the koala through the blanket, frees it from the fence, and drops it in the cage.\",\"relatedItemIds\":[\"skill-a2\"]},{\"id\":\"D\",\"html\":\"Next, they check the animal’s \u003cstrong\u003ephysical\u003c/strong\u003e condition. If the koala is sick or injured, it may need to be taken to an animal hospital. If the koala is healthy—like this one—it is normally released where it is found. Koalas \u003cstrong\u003etend to\u003c/strong\u003e live in a small area, and often eat from the same trees over and over.\",\"relatedItemIds\":[\"skill-a3\"]},{\"id\":\"E\",\"html\":\"Right now, however, Aitken and the rescued koala are in a suburb with almost no trees. “This is the whole problem,” Aitken says. “There are so few places left for the koala.” In the end, Aitken takes the animal to a small park nearby and releases him. “Good luck, little one,” she says.\",\"relatedItemIds\":[]},{\"id\":\"F\",\"html\":\"“Koalas are getting caught in fences and dying,” explains Deidré de Villiers, a koala researcher in Queensland, Australia. Others are being killed by dogs or struck by vehicles, she says. Some even die “simply because a homeowner cut down several eucalyptus trees in his backyard.”\",\"relatedItemIds\":[],\"heading\":\"Koalas at Risk\"},{\"id\":\"G\",\"html\":\"For 15 years, de Villiers has been studying koalas and the reasons for their disappearance. She is also working on ways to make suburban areas more koala-friendly. De Villiers believes that koalas and humans can live together, if certain changes are made. She recommends reducing speed limits on streets and creating more green areas for koalas to live in. Even more important is the need to preserve eucalyptus trees.\",\"relatedItemIds\":[]},{\"id\":\"H\",\"html\":\"Even if these changes are made, koalas still have another problem. “Disease is a huge issue,” explains veterinarian\u003csup\u003e2\u003c/sup\u003e Jon Hanger. Hanger says that almost half of Queensland’s female koalas are affected by a disease called \u003cem\u003echlamydiosis\u003c/em\u003e. Without treatment, the koalas are unable to \u003cstrong\u003ereproduce\u003c/strong\u003e. “Koala populations that used to be vibrant are becoming \u003cstrong\u003eextinct\u003c/strong\u003e,” says Hanger. Once, there were millions of koalas in Australia; now, there are believed to be fewer than 80,000.\",\"relatedItemIds\":[\"skill-a4\",\"skill-a5\"]},{\"id\":\"I\",\"html\":\"At her home near Brisbane, Deidré de Villiers is taking care of a female koala named Ruby. “Ruby still sleeps in the basket hugging her teddy bear,” she says. “She was rescued from the jaws of a dog.” Every two days, de Villiers collects eucalyptus leaves, the koala’s\u003cstrong\u003e primary\u003c/strong\u003e\u003cstrong\u003e \u003c/strong\u003efood, from a nearby farm to feed Ruby.\u003cstrong\u003e \u003c/strong\u003eFor 12 years, she has cared for more than 60 koalas. Over two centuries ago, about ten million koalas lived in forests on the east coast of Australia. Eucalyptus leaves—their primary food source— were plentiful. By the start of this century, nearly two-thirds of the forests had been cleared, leaving fewer than 80,000 koalas left in the wild.\",\"relatedItemIds\":[],\"heading\":\"A Friend to Koalas\"},{\"id\":\"J\",\"html\":\"Later, de Villiers visits a forest near Brisbane to catch Tee Vee, a wild female koala. De Villiers has been following Tee Vee for over a year. Using special audio equipment, de Villiers walks and listens for a \u003cstrong\u003esignal\u003c/strong\u003e from the koala’s radio collar.\u003csup\u003e3\u003c/sup\u003e She eventually finds Tee Vee sitting on a tree branch 15 meters high. As de Villiers climbs up a ladder, Tee Vee starts moving down the tree. Then, suddenly, the koala jumps into the air and lands on the ground. She is quickly captured by de Villiers’s team.\",\"relatedItemIds\":[]},{\"id\":\"K\",\"html\":\"Tee Vee is given medicine to relax her. Next, de Villiers measures the length of the koala’s body and head. She also checks Tee Vee’s teeth and the condition of her fur. “I think she has a baby,” de Villiers says. She carefully opens the koala’s pouch and takes out a 10-centimeter-long baby koala. De Villiers examines the baby for any problems. Then she puts it back in the mother’s pouch. “As long as there are healthy babies,” she says, “there’s still hope.”\",\"relatedItemIds\":[]}],\"glossary\":[{\"term\":\"collar\",\"def\":\"A collar is something an animal wears around its neck.\",\"anchorParagraphId\":\"J\"}],\"figures\":[{\"assetId\":\"photo-p3\",\"position\":\"before-A\"},{\"assetId\":\"photo-p4\",\"position\":\"before-H\"},{\"assetId\":\"photo-p4-2\",\"position\":\"before-H\"},{\"assetId\":\"photo-p5\",\"position\":\"before-J\"},{\"assetId\":\"photo-p5-2\",\"position\":\"before-J\"}]},{\"id\":\"reading-comprehension\",\"kind\":\"exercise\",\"title\":\"Reading Comprehension\",\"assetIds\":[],\"items\":[{\"prompt\":\"What is this reading mainly about?\",\"group\":\"A\",\"groupLabel\":\"GIST\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"GIST\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"how one woman is saving koalas from extinction\"},{\"id\":\"b\",\"text\":\"ways that humans and koalas can learn to live together\"},{\"id\":\"c\",\"text\":\"new methods for studying koalas in the wild\"},{\"id\":\"d\",\"text\":\"threats to koalas and efforts to protect them\"}],\"id\":\"comp-a1\"},{\"prompt\":\"What does Megan Aitken use the blanket for?\",\"group\":\"A\",\"groupLabel\":\"DETAIL\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"DETAIL\",\"paragraphIds\":[],\"interaction\":\"multiple-choice\",\"choices\":[{\"id\":\"a\",\"text\":\"to catch the koala after it falls from a tree\"},{\"id\":\"b\",\"text\":\"to cover the koala so it doesn’t harm her\"},{\"id\":\"c\",\"text\":\"to keep the koala warm after it’s placed in the cage\"},{\"id\":\"d\",\"text\":\"to place over the cage so the koala inside stays calm\"}],\"id\":\"comp-a2\",\"assetIds\":[\"photo-p6\"],\"imagePlacement\":\"beside\"},{\"prompt\":\"Why is the koala that Aitken caught released in a nearby park?\",\"group\":\"A\",\"groupLabel\":\"INFERENCE\",\"groupPrompt\":\"Choose the best answer for each question.\",\"skill\":\"INFERENCE\",\"para

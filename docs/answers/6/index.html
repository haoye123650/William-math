wad464sys.js\"],\"AnswersView\"]\n8:C\n4:[\"$\",\"$Le\",null,{\"paper\":{\"id\":\"6\",\"title\":\"Test 6 · DSE Paper 1 style\",\"stars\":5,\"level\":\"S.5 / DSE\",\"blurb\":\"HKDSE Paper 1 style: completing the square, circle equations, geometric series, 3-D Pythagoras and quadratic inequalities.\",\"durationMin\":100,\"totalMarks\":100,\"extraMarks\":10,\"materials\":\"Pen, ruler and rough paper. Calculators are not allowed.\",\"notes\":[\"This paper is modelled on HKDSE Mathematics Compulsory Part Paper 1: algebra, coordinate geometry of the circle, sequences, 3-D Pythagoras and inequalities. Numbers are chosen so that no calculator is needed.\",\"Questions are original and follow the HKEAA Compulsory Part syllabus. They are not copied from any year’s paper.\",\"For Sections A and B, write answers only. For Sections C and D, show working.\",\"Section E is an extension and is not included in the 100 marks.\"],\"scoreBands\":[{\"range\":\"90–100\",\"note\":\"Paper 1 Section A is in reach. Next: linear programming, more about trigonometry, and past Paper 1 Section A2.\"},{\"range\":\"75–89\",\"note\":\"Keep the algebra. Completing the square and rewriting circle equations need speed.\"},{\"range\":\"60–74\",\"note\":\"S.4 quadratics are not automatic. Revisit the formula and remainder theorem, then retry circles.\"},{\"range\":\"below 60\",\"note\":\"Do Tests 4 and 5 first. DSE Paper 1 will pile up if factorization and indices are still slow.\"}],\"tutorTips\":[\"Q3 and Q22: complete the square on x² + y² + Dx + Ey + F = 0. Radius squared is (D/2)² + (E/2)² − F.\",\"Q2: infinite GP, |r| \u0026lt; 1, S = a/(1 − r).\",\"Q21: Δ first. If they skip the formula and only factor, still award method if the roots are correct.\",\"Q26 is line + circle. Substitute y from the line into the circle, then factor the quadratic.\",\"Q28 is a 3-4-12 cuboid. Face 3-4-5, space diagonal 13. Same trick as 5-12-13.\"],\"sections\":[{\"id\":\"mc\",\"title\":\"Section A  Multiple Choice\",\"instruction\":\"2 marks each. Total 20 marks. Choose the best answer.\",\"marks\":20,\"questions\":[{\"id\":\"q1\",\"no\":\"1\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Quadratic equations\",\"stem\":\"The equation 2x\u003csup\u003e2\u003c/sup\u003e − 4x + 5 = 0 has\",\"options\":[{\"key\":\"A\",\"text\":\"two distinct real roots\"},{\"key\":\"B\",\"text\":\"one real root\"},{\"key\":\"C\",\"text\":\"no real roots\"},{\"key\":\"D\",\"text\":\"infinitely many roots\"}],\"answer\":\"C\",\"explanation\":\"Δ = 16 − 40 = −24 \u0026lt; 0.\"},{\"id\":\"q2\",\"no\":\"2\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Sequences\",\"stem\":\"The sum to infinity of 1 + 1/2 + 1/4 + 1/8 + … is\",\"options\":[{\"key\":\"A\",\"text\":\"1\"},{\"key\":\"B\",\"text\":\"2\"},{\"key\":\"C\",\"text\":\"4\"},{\"key\":\"D\",\"text\":\"the series diverges\"}],\"answer\":\"B\",\"explanation\":\"a = 1, r = 1/2, S\u003csub\u003e∞\u003c/sub\u003e = 1/(1 − 1/2) = 2.\"},{\"id\":\"q3\",\"no\":\"3\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The centre of the circle x\u003csup\u003e2\u003c/sup\u003e + y\u003csup\u003e2\u003c/sup\u003e − 4x + 6y − 3 = 0 is\",\"options\":[{\"key\":\"A\",\"text\":\"(2, −3)\"},{\"key\":\"B\",\"text\":\"(−2, 3)\"},{\"key\":\"C\",\"text\":\"(4, −6)\"},{\"key\":\"D\",\"text\":\"(2, 3)\"}],\"answer\":\"A\",\"explanation\":\"(x − 2)² + (y + 3)² = 16. Centre (2, −3), radius 4.\"},{\"id\":\"q4\",\"no\":\"4\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Functions\",\"stem\":\"If f(x) = x\u003csup\u003e2\u003c/sup\u003e − 4x, then f(x + 1) =\",\"options\":[{\"key\":\"A\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e − 2x − 3\"},{\"key\":\"B\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e − 4x + 1\"},{\"key\":\"C\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e + 2x − 3\"},{\"key\":\"D\",\"text\":\"(x + 1)\u003csup\u003e2\u003c/sup\u003e − 4x\"}],\"answer\":\"A\",\"explanation\":\"(x + 1)² − 4(x + 1) = x² + 2x + 1 − 4x − 4 = x² − 2x − 3.\"},{\"id\":\"q5\",\"no\":\"5\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Counting\",\"stem\":\"The number of ways to arrange 4 distinct books in a row is\",\"options\":[{\"key\":\"A\",\"text\":\"4\"},{\"key\":\"B\",\"text\":\"12\"},{\"key\":\"C\",\"text\":\"16\"},{\"key\":\"D\",\"text\":\"24\"}],\"answer\":\"D\",\"explanation\":\"4! = 24.\"},{\"id\":\"q6\",\"no\":\"6\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Trigonometry\",\"stem\":\"tan 45° + tan 135° =\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"1\"},{\"key\":\"C\",\"text\":\"2\"},{\"key\":\"D\",\"text\":\"undefined\"}],\"answer\":\"A\",\"explanation\":\"tan 45° = 1, tan 135° = −1.\"},{\"id\":\"q7\",\"no\":\"7\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Variations\",\"stem\":\"y varies directly as x. When x = 2, y = 6. When x = 5, y =\",\"options\":[{\"key\":\"A\",\"text\":\"9\"},{\"key\":\"B\",\"text\":\"12\"},{\"key\":\"C\",\"text\":\"15\"},{\"key\":\"D\",\"text\":\"30\"}],\"answer\":\"C\",\"explanation\":\"y = 3x, so y = 15.\"},{\"id\":\"q8\",\"no\":\"8\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Quadratic equations\",\"stem\":\"The product of the roots of x\u003csup\u003e2\u003c/sup\u003e − 2x − 1 = 0 is\",\"options\":[{\"key\":\"A\",\"text\":\"−1\"},{\"key\":\"B\",\"text\":\"1\"},{\"key\":\"C\",\"text\":\"2\"},{\"key\":\"D\",\"text\":\"−2\"}],\"answer\":\"A\",\"explanation\":\"αβ = c/a = −1.\"},{\"id\":\"q9\",\"no\":\"9\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"The standard deviation of 1, 1, 1, 1 is\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"1\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"4\"}],\"answer\":\"A\",\"explanation\":\"Every value equals the mean, so the spread is 0.\"},{\"id\":\"q10\",\"no\":\"10\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The line y = 2x + 1 and the circle x\u003csup\u003e2\u003c/sup\u003e + y\u003csup\u003e2\u003c/sup\u003e = 1 intersect at\",\"options\":[{\"key\":\"A\",\"text\":\"0 points\"},{\"key\":\"B\",\"text\":\"1 point\"},{\"key\":\"C\",\"text\":\"2 points\"},{\"key\":\"D\",\"text\":\"4 points\"}],\"answer\":\"C\",\"explanation\":\"x² + (2x + 1)² = 1 → 5x² + 4x = 0 → x(5x + 4) = 0. Two solutions.\"}]},{\"id\":\"fill\",\"title\":\"Section B  Short Questions\",\"instruction\":\"2 marks each. Total 20 marks. Working is not required. For two blanks, 1 mark each.\",\"marks\":20,\"questions\":[{\"id\":\"q11\",\"no\":\"11\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"Complete the square: x\u003csup\u003e2\u003c/sup\u003e − 8x + 7 = (x − 4)\u003csup\u003e2\u003c/sup\u003e + ________\",\"blanks\":[{\"id\":\"q11a\",\"answer\":\"-9\",\"accepted\":[\"-9\",\"−9\"]}],\"answer\":\"−9\",\"explanation\":\"(x − 4)² − 16 + 7 = (x − 4)² − 9.\"},{\"id\":\"q12\",\"no\":\"12\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Sequences\",\"stem\":\"The nth term of 4, 7, 10, 13, … is T\u003csub\u003en\u003c/sub\u003e =\",\"blanks\":[{\"id\":\"q12a\",\"answer\":\"3n+1\",\"accepted\":[\"3n+1\",\"3n + 1\"]}],\"answer\":\"3n + 1\",\"explanation\":\"First term 4, common difference 3. T\u003csub\u003en\u003c/sub\u003e = 4 + (n − 1)×3 = 3n + 1.\"},{\"id\":\"q13\",\"no\":\"13\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Logarithms\",\"stem\":\"log 8 / log 2 =\",\"blanks\":[{\"id\":\"q13a\",\"answer\":\"3\",\"accepted\":[\"3\"]}],\"answer\":\"3\",\"explanation\":\"Change of base: log\u003csub\u003e2\u003c/sub\u003e 8 = 3.\"},{\"id\":\"q14\",\"no\":\"14\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Variations\",\"stem\":\"x varies inversely as y. When x = 4, y = 3. When y = 2, x =\",\"blanks\":[{\"id\":\"q14a\",\"answer\":\"6\",\"accepted\":[\"6\"]}],\"answer\":\"6\",\"explanation\":\"xy = 12, so x = 12/2 = 6.\"},{\"id\":\"q15\",\"no\":\"15\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Counting\",\"stem\":\"C(5, 2) =\",\"blanks\":[{\"id\":\"q15a\",\"answer\":\"10\",\"accepted\":[\"10\"]}],\"answer\":\"10\",\"explanation\":\"5×4 / 2 = 10.\"},{\"id\":\"q16\",\"no\":\"16\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Functions\",\"stem\":\"The vertex of y = x\u003csup\u003e2\u003c/sup\u003e − 4x + 1 is\",\"blanks\":[{\"id\":\"q16a\",\"answer\":\"(2,-3)\",\"accepted\":[\"(2,-3)\",\"(2, −3)\",\"(2,-3)\"]}],\"answer\":\"(2, −3)\",\"explanation\":\"(x − 2)² − 4 + 1 = (x − 2)² − 3.\"},{\"id\":\"q17\",\"no\":\"17\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The angle in a semicircle is ________ °.\",\"blanks\":[{\"id\":\"q17a\",\"answer\":\"90\",\"accepted\":[\"90\"]}],\"answer\":\"90\",\"explanation\":\"Theorem: the angle in a semicircle is a right angle.\"},{\"id\":\"q18\",\"no\":\"18\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Indices\",\"stem\":\"8\u003csup\u003e2/3\u003c/sup\u003e =\",\"blanks\":[{\"id\":\"q18a\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"4\",\"explanation\":\"(8\u003csup\u003e1/3\u003c/sup\u003e)² = 2² = 4.\"},{\"id\":\"q19\",\"no\":\"19\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Functions\",\"stem\":\"The range of y = 2\u003csup\u003ex\u003c/sup\u003e is y ________\",\"blanks\":[{\"id\":\"q19a\",\"answer\":\"\u003e0\",\"accepted\":[\"\u003e0\",\"\u003e 0\",\"y\u003e0\",\"y \u003e 0\"]}],\"answer\":\"y \u0026gt; 0\",\"explanation\":\"An exponential with base \u0026gt; 1 is always positive.\"},{\"id\":\"q20\",\"no\":\"20\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Equations\",\"stem\":\"If |x − 3| = 5, then x =\",\"blanks\":[{\"id\":\"q20a\",\"answer\":\"8 or -2\",\"accepted\":[\"8 or -2\",\"8 or −2\",\"-2 or 8\",\"−2 or 8\",\"8,-2\",\"-2,8\"]}],\"answer\":\"x = 8 or x = −2\",\"explanation\":\"x − 3 = 5 or x − 3 = −5.\"}]},{\"id\":\"calc\",\"title\":\"Section C  Conventional Questions\",\"instruction\":\"6 marks each. Total 30 marks. Show your working.\",\"marks\":30,\"questions\":[{\"id\":\"q21\",\"no\":\"21\",\"type\":\"work\",\"marks\":6,\"skill\":\"Quadratic equations\",\"lines\":7,\"stem\":\"Solve 2x\u003csup\u003e2\u003c/sup\u003e − 5x − 3 = 0 by the quadratic formula.\",\"answer\":\"x = 3 or x = −1/2\",\"explanation\":\"Δ = 25 + 24 = 49. x = (5 ± 7)/4 = 3 or −1/2.\",\"marking\":\"Discriminant 2 marks; both roots 4 marks.\"},{\"id\":\"q22\",\"no\":\"22\",\"type\":\"work\",\"marks\":6,\"skill\":\"Coordinate geometry\",\"lines\":7,\"stem\":\"Rewrite x\u003csup\u003e2\u003c/sup\u003e + y\u003csup\u003e2\u003c/sup\u003e − 6x − 8y = 0 in the form (x − h)\u003csup\u003e2\u003c/sup\u003e + (y − k)\u003csup\u003e2\u003c/sup\u003e = r\u003csup\u003e2\u003c/sup\u003e. Hence state the centre and the radius.\",\"answer\":\"(x − 3)² + (y − 4)² = 25; centre (3, 4), radius 5\",\"explanation\":\"(x − 3)² − 9 + (y − 4)² − 16 = 0.\",\"marking\":\"Completing the square 4 marks; centre and radius 2 marks.\"},{\"id\":\"q23\",\"no\":\"23\",\"type\":\"work\",\"marks\":6,\"skill\":\"Sequences\",\"lines\":6,\"stem\":\"A geometric sequence has first term 5 and common ratio 1/2. Find n such that T\u003csub\u003en\u003c/sub\u003e = 5/16.\",\"answer\":\"n = 5\",\"explanation\":\"5 × (1/2)\u003csup\u003en−1\u003c/sup\u003e = 5/16, (1/2)\u003csup\u003en−1\u003c/sup\u003e = 1/16, n − 1 = 4, n = 5.\",\"marking\":\"Set up 3 marks; n = 5, 3 marks.\"},{\"id\":\"q24\",\"no\":\"24\",\"type\":\"work\",\"marks\":6,\"skill\":\"Trigonometry\",\"lines\":6,\"stem\":\"A triangle has sides 5 cm, 5 cm and 6 cm. Find its area.\",\"answer\":\"12 cm²\",\"explanation\":\"Heron: s = 8, √(8×3×3×2) = √144 = 12. Or height to base 6: 4² + 3² = 5², area = (1/2)×6×4 = 12.\",\"marking\":\"Method 3 marks; 12 cm² 3 marks.\"},{\"id\":\"q25\",\"no\":\"25\",\"type\":\"work\",\"marks\":6,\"skill\":\"Inequalities\",\"lines\":6,\"stem\":\"Solve 2x\u003csup\u003e2\u003c/sup\u003e + x − 6 ≥ 0.\",\"answer\":\"x ≤ −2 or x ≥ 3/2\",\"explanation\":\"(2x − 3)(x + 2) ≥ 0. Critical values −2 and 3/2. Outside the roots because the parabola opens up.\",\"marking\":\"Factors 3 marks; union of rays 3 marks.\"}]},{\"id\":\"solve\",\"title\":\"Section D  Structured Questions\",\"instruction\":\"10 marks each. Total 30 marks. Set up equations. Include units.\",\"marks\":30,\"questions\":[{\"id\":\"q26\",\"no\":\"26\",\"type\":\"work\",\"marks\":10,\"skill\":\"Equations\",\"lines\":8,\"stem\":\"The line y = x + 1 intersects the circle x\u003csup\u003e2\u003c/sup\u003e + y\u003csup\u003e2\u003c/sup\u003e = 13 at two points.\u003cbr/\u003e(a) Find the coordinates of the two points.\u003cbr/\u003e(b) Find the distance between them.\",\"answer\":\"(a) (2, 3) and (−3, −2); (b) 5√2\",\"explanation\":\"x² + (x + 1)² = 13 → x² + x − 6 = 0 → (x − 2)(x + 3) = 0. Distance √(5² + 5²) = 5√2.\",\"marking\":\"(a) 6 marks; (b) 4 marks.\"},{\"id\":\"q27\",\"no\":\"27\",\"type\":\"work\",\"marks\":10,\"skill\":\"Sequences\",\"lines\":8,\"stem\":\"A theatre has 10 rows. The first row has 20 seats. Each row after that has 4 more seats than the row in front.\u003cbr/\u003e(a) How many seats are in the 10th row?\u003cbr/\u003e(b) How many seats are there in total?\",\"answer\":\"(a) 56; (b) 380\",\"explanation\":\"T\u003csub\u003e10\u003c/sub\u003e = 20 + 9×4 = 56. S\u003csub\u003e10\u003c/sub\u003e = 10/2 × (20 + 56) = 380.\",\"marking\":\"(a) 4 marks; (b) 6 marks.\"},{\"id\":\"q28\",\"no\":\"28\",\"type\":\"work\",\"marks\":10,\"skill\":\"Geometry\",\"lines\":8,\"stem\":\"A cuboid measures 3 cm by 4 cm by 12 cm.\u003cbr/\u003e(a) Find the length of a face diagonal of the 3 cm by 4 cm face.\u003cbr/\u003e(b) Find the length of a space diagonal of the cuboid.\",\"answer\":\"(a) 5 cm; (b) 13 cm\",\"explanation\":\"Face: √(9+16)=5. Space: √(9+16+144)=√169=13.\",\"marking\":\"(a) 4 marks; (b) 6 marks.\"}]},{\"id\":\"extra\",\"title\":\"Section E  Extension\",\"instruction\":\"10 marks in total. Not included in the 100 marks.\",\"marks\":10,\"extra\":true,\"questions\":[{\"id\":\"q29\",\"no\":\"29\",\"type\":\"work\",\"marks\":5,\"skill\":\"Functions\",\"lines\":6,\"stem\":\"Let f(x) = 2x − 3 and g(x) = x\u003csup\u003e2\u003c/sup\u003e. Solve (g ∘ f)(x) = 25.\",\"answer\":\"x = 4 or x = −1\",\"explanation\":\"(2x − 3)² = 25, 2x − 3 = ±5, x = 4 or x = −1.\",\"marking\":\"Composition 2 marks; both solutions 3 marks.\"},{\"id\":\"q30\",\"no\":\"30\",\"type\":\"work\",\"marks\":5,\"skill\":\"Polynomials\",\"lines\":6,\"stem\":\"When x\u003csup\u003e3\u003c/sup\u003e + ax\u003csup\u003e2\u003c/sup\u003e − x + 2 is divided by x − 1, the remainder is 6. Find a.\",\"answer\":\"a = 4\",\"explanation\":\"f(1) = 1 + a − 1 + 2 = 6, a + 2 = 6, a = 4.\",\"marking\":\"Remainder theorem 3 marks; a = 4, 2 marks.\"}]}]}}]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nf:I[27201,[\"/William-math/_next/static/chunks/3fntmmi971322.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"尹健熙 · Classroom\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"尹健熙 classroom: DSE mathematics papers, and Reading Explorer 3 as an on-site reading book.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/William-math/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Lf\",\"3\",{}]]\n"])</script></body></html>

d464sys.js\"],\"AnswersView\"]\n8:C\n4:[\"$\",\"$Le\",null,{\"paper\":{\"id\":\"3\",\"title\":\"Test 3 · S.2 Mathematics\",\"stars\":3,\"level\":\"S.2\",\"blurb\":\"DSE S.2: factorization, indices, simultaneous equations, inequalities and Pythagoras.\",\"durationMin\":80,\"totalMarks\":100,\"extraMarks\":10,\"materials\":\"Pen, ruler and rough paper. Calculators are not allowed.\",\"notes\":[\"This paper follows the Hong Kong DSE S.2 Mathematics syllabus: factorization, algebraic fractions, indices, formulae, linear inequalities, simultaneous equations and Pythagoras’ theorem.\",\"For Sections A and B, write answers only. For Sections C and D, show working.\",\"Section E is an extension and is not included in the 100 marks.\"],\"scoreBands\":[{\"range\":\"90–100\",\"note\":\"Ready for S.2 EMI pace. Next: more algebraic fractions and similar triangles.\"},{\"range\":\"75–89\",\"note\":\"Keep the methods, but factorization and indices need drilling.\"},{\"range\":\"60–74\",\"note\":\"S.1 is not fully secure. Revisit linear equations and directed numbers, then retry factorization.\"},{\"range\":\"below 60\",\"note\":\"Do Tests 1 and 2 first. S.2 will pile up if expanding and transposing are still weak.\"}],\"tutorTips\":[\"Q1–Q2 and Q21–Q22 are the S.2 core: difference of squares, indices. If those fail, stay on factorization this week.\",\"Q4 and Q24: multiplying/dividing an inequality by a negative reverses the sign.\",\"Q26: two-unknown word problem. Watch which letter is pens and which is pencils.\",\"Q23: substitute from the simpler equation. Adding to eliminate is also fine.\",\"Q25 is a 5-12-13 triangle in disguise (5-12-13 scaled? 5 and 13 give 12).\"],\"sections\":[{\"id\":\"mc\",\"title\":\"Section A  Multiple Choice\",\"instruction\":\"2 marks each. Total 20 marks. Choose the best answer.\",\"marks\":20,\"questions\":[{\"id\":\"q1\",\"no\":\"1\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Factorization\",\"stem\":\"x\u003csup\u003e2\u003c/sup\u003e − 9 =\",\"options\":[{\"key\":\"A\",\"text\":\"(x − 3)(x + 3)\"},{\"key\":\"B\",\"text\":\"(x − 9)(x + 1)\"},{\"key\":\"C\",\"text\":\"(x − 3)\u003csup\u003e2\u003c/sup\u003e\"},{\"key\":\"D\",\"text\":\"x(x − 9)\"}],\"answer\":\"A\",\"explanation\":\"Difference of squares: a² − b² = (a − b)(a + b).\"},{\"id\":\"q2\",\"no\":\"2\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Indices\",\"stem\":\"8\u003csup\u003e0\u003c/sup\u003e × 2\u003csup\u003e−3\u003c/sup\u003e =\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e8\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"C\",\"text\":\"1\"},{\"key\":\"D\",\"text\":\"8\"}],\"answer\":\"B\",\"explanation\":\"Any non-zero number to the power 0 is 1. 2\u003csup\u003e−3\u003c/sup\u003e = 1/8.\"},{\"id\":\"q3\",\"no\":\"3\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Equations\",\"stem\":\"If x + 2y = 7 and 2x − y = 4, then (x, y) =\",\"options\":[{\"key\":\"A\",\"text\":\"(3, 2)\"},{\"key\":\"B\",\"text\":\"(1, 3)\"},{\"key\":\"C\",\"text\":\"(2, 3)\"},{\"key\":\"D\",\"text\":\"(4, 1.5)\"}],\"answer\":\"A\",\"explanation\":\"x = 7 − 2y into the second: 2(7 − 2y) − y = 4 → 14 − 5y = 4 → y = 2, x = 3.\"},{\"id\":\"q4\",\"no\":\"4\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Inequalities\",\"stem\":\"If −2x \u003e 6, then\",\"options\":[{\"key\":\"A\",\"text\":\"x \u0026gt; −3\"},{\"key\":\"B\",\"text\":\"x \u0026lt; −3\"},{\"key\":\"C\",\"text\":\"x \u0026gt; 3\"},{\"key\":\"D\",\"text\":\"x \u0026lt; 3\"}],\"answer\":\"B\",\"explanation\":\"Divide by −2 and reverse the inequality: x \u003c −3.\"},{\"id\":\"q5\",\"no\":\"5\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"A right-angled triangle has shorter sides 5 cm and 12 cm. The hypotenuse is\",\"options\":[{\"key\":\"A\",\"text\":\"13 cm\"},{\"key\":\"B\",\"text\":\"17 cm\"},{\"key\":\"C\",\"text\":\"60 cm\"},{\"key\":\"D\",\"text\":\"√17 cm\"}],\"answer\":\"A\",\"explanation\":\"√(25 + 144) = √169 = 13.\"},{\"id\":\"q6\",\"no\":\"6\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The slope of the line through (1, 2) and (4, 8) is\",\"options\":[{\"key\":\"A\",\"text\":\"2\"},{\"key\":\"B\",\"text\":\"3\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"6\"}],\"answer\":\"A\",\"explanation\":\"(8 − 2)/(4 − 1) = 6/3 = 2.\"},{\"id\":\"q7\",\"no\":\"7\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"(x + 3)(x − 3) =\",\"options\":[{\"key\":\"A\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e − 6x − 9\"},{\"key\":\"B\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e − 9\"},{\"key\":\"C\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e + 9\"},{\"key\":\"D\",\"text\":\"x\u003csup\u003e2\u003c/sup\u003e − 6x + 9\"}],\"answer\":\"B\",\"explanation\":\"Difference of squares.\"},{\"id\":\"q8\",\"no\":\"8\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Indices\",\"stem\":\"(2\u003csup\u003e3\u003c/sup\u003e × 2\u003csup\u003e5\u003c/sup\u003e) ÷ 2\u003csup\u003e4\u003c/sup\u003e =\",\"options\":[{\"key\":\"A\",\"text\":\"2\u003csup\u003e4\u003c/sup\u003e\"},{\"key\":\"B\",\"text\":\"2\u003csup\u003e8\u003c/sup\u003e\"},{\"key\":\"C\",\"text\":\"2\u003csup\u003e2\u003c/sup\u003e\"},{\"key\":\"D\",\"text\":\"2\u003csup\u003e12\u003c/sup\u003e\"}],\"answer\":\"A\",\"explanation\":\"2\u003csup\u003e3+5−4\u003c/sup\u003e = 2\u003csup\u003e4\u003c/sup\u003e = 16, which is option A.\"},{\"id\":\"q9\",\"no\":\"9\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"Each interior angle of a regular hexagon is\",\"options\":[{\"key\":\"A\",\"text\":\"108°\"},{\"key\":\"B\",\"text\":\"120°\"},{\"key\":\"C\",\"text\":\"135°\"},{\"key\":\"D\",\"text\":\"180°\"}],\"answer\":\"B\",\"explanation\":\"((6 − 2) × 180°) / 6 = 120°.\"},{\"id\":\"q10\",\"no\":\"10\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"Two similar triangles have corresponding sides in the ratio 1 : 2. The ratio of their areas is\",\"options\":[{\"key\":\"A\",\"text\":\"1 : 2\"},{\"key\":\"B\",\"text\":\"1 : 4\"},{\"key\":\"C\",\"text\":\"1 : 8\"},{\"key\":\"D\",\"text\":\"2 : 1\"}],\"answer\":\"B\",\"explanation\":\"Area scale factor is the square of the length scale factor.\"}]},{\"id\":\"fill\",\"title\":\"Section B  Short Questions\",\"instruction\":\"2 marks each. Total 20 marks. Working is not required. For two blanks, 1 mark each.\",\"marks\":20,\"questions\":[{\"id\":\"q11\",\"no\":\"11\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Factorization\",\"stem\":\"Factorize 6x\u003csup\u003e2\u003c/sup\u003e − 9x.\",\"blanks\":[{\"id\":\"q11a\",\"answer\":\"3x(2x-1)\",\"accepted\":[\"3x(2x-1)\",\"3x(2x−1)\",\"-3x(1-2x)\"]}],\"answer\":\"3x(2x − 1)\",\"explanation\":\"Common factor 3x.\"},{\"id\":\"q12\",\"no\":\"12\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"Simplify \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003ex^{2} − 4\u003c/span\u003e\u003cspan\u003ex − 2\u003c/span\u003e\u003c/span\u003e (x ≠ 2).\",\"blanks\":[{\"id\":\"q12a\",\"answer\":\"x+2\",\"accepted\":[\"x+2\",\"x + 2\"]}],\"answer\":\"x + 2\",\"explanation\":\"(x − 2)(x + 2)/(x − 2) = x + 2.\"},{\"id\":\"q13\",\"no\":\"13\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Indices\",\"stem\":\"3\u003csup\u003e−2\u003c/sup\u003e =\",\"blanks\":[{\"id\":\"q13a\",\"answer\":\"1/9\",\"accepted\":[\"1/9\",\"0.111...\",\"0.1 repeating\"]}],\"answer\":\"1/9\",\"explanation\":\"1/3² = 1/9.\"},{\"id\":\"q14\",\"no\":\"14\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"Make t the subject of v = u + at. t =\",\"blanks\":[{\"id\":\"q14a\",\"answer\":\"(v-u)/a\",\"accepted\":[\"(v-u)/a\",\"(v−u)/a\",\"(v-u)÷a\"]}],\"answer\":\"(v − u)/a\",\"explanation\":\"at = v − u, t = (v − u)/a.\"},{\"id\":\"q15\",\"no\":\"15\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Inequalities\",\"stem\":\"Solve 3x − 1 \u0026lt; 8. x ________\",\"blanks\":[{\"id\":\"q15a\",\"answer\":\"\u003c3\",\"accepted\":[\"\u003c3\",\"\u003c 3\",\"x\u003c3\",\"x \u003c 3\"]}],\"answer\":\"x \u003c 3\",\"explanation\":\"3x \u003c 9, x \u003c 3.\"},{\"id\":\"q16\",\"no\":\"16\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Equations\",\"stem\":\"x + y = 10 and x − y = 2. Then x = ________ , y = ________\",\"blanks\":[{\"id\":\"q16a\",\"label\":\"x\",\"answer\":\"6\",\"accepted\":[\"6\"]},{\"id\":\"q16b\",\"label\":\"y\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"x = 6, y = 4\",\"explanation\":\"Add: 2x = 12, x = 6, y = 4.\",\"marking\":\"1 mark each.\"},{\"id\":\"q17\",\"no\":\"17\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The distance from (0, 0) to (3, 4) is\",\"blanks\":[{\"id\":\"q17a\",\"answer\":\"5\",\"accepted\":[\"5\"]}],\"answer\":\"5\",\"explanation\":\"√(9 + 16) = 5.\"},{\"id\":\"q18\",\"no\":\"18\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The volume of a cube of side 5 cm is ________ cm\u003csup\u003e3\u003c/sup\u003e.\",\"blanks\":[{\"id\":\"q18a\",\"answer\":\"125\",\"accepted\":[\"125\"]}],\"answer\":\"125\",\"explanation\":\"5³ = 125.\"},{\"id\":\"q19\",\"no\":\"19\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"A fair die is thrown once. P(an even number) =\",\"blanks\":[{\"id\":\"q19a\",\"answer\":\"1/2\",\"accepted\":[\"1/2\",\"0.5\",\"3/6\"]}],\"answer\":\"1/2\",\"explanation\":\"2, 4, 6 out of 6 outcomes.\"},{\"id\":\"q20\",\"no\":\"20\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"Expand (2x − 1)(x + 4).\",\"blanks\":[{\"id\":\"q20a\",\"answer\":\"2x^2+7x-4\",\"accepted\":[\"2x^2+7x-4\",\"2x²+7x-4\",\"2x^2 + 7x - 4\"]}],\"answer\":\"2x² + 7x − 4\",\"explanation\":\"2x² + 8x − x − 4 = 2x² + 7x − 4.\"}]},{\"id\":\"calc\",\"title\":\"Section C  Conventional Questions\",\"instruction\":\"6 marks each. Total 30 marks. Show your working.\",\"marks\":30,\"questions\":[{\"id\":\"q21\",\"no\":\"21\",\"type\":\"work\",\"marks\":6,\"skill\":\"Factorization\",\"lines\":6,\"stem\":\"Factorize x\u003csup\u003e2\u003c/sup\u003e + 5x + 6.\",\"answer\":\"(x + 2)(x + 3)\",\"explanation\":\"Two numbers that multiply to 6 and add to 5: 2 and 3.\",\"marking\":\"Correct pair 4 marks; written as a product 2 marks. Order of factors does not matter.\"},{\"id\":\"q22\",\"no\":\"22\",\"type\":\"work\",\"marks\":6,\"skill\":\"Indices\",\"lines\":6,\"stem\":\"Simplify (2a\u003csup\u003e2\u003c/sup\u003eb)\u003csup\u003e3\u003c/sup\u003e ÷ (4ab\u003csup\u003e2\u003c/sup\u003e).\",\"answer\":\"2a\u003csup\u003e5\u003c/sup\u003eb\",\"explanation\":\"(8a\u003csup\u003e6\u003c/sup\u003eb\u003csup\u003e3\u003c/sup\u003e) / (4ab\u003csup\u003e2\u003c/sup\u003e) = 2a\u003csup\u003e5\u003c/sup\u003eb.\",\"marking\":\"Expand the cube 3 marks; divide 3 marks.\"},{\"id\":\"q23\",\"no\":\"23\",\"type\":\"work\",\"marks\":6,\"skill\":\"Equations\",\"lines\":7,\"stem\":\"Solve the simultaneous equations\u003cbr/\u003e2x + y = 7\u003cbr/\u003ex − y = 2\",\"answer\":\"x = 3, y = 1\",\"explanation\":\"Add: 3x = 9, x = 3. Then 3 − y = 2, y = 1.\",\"marking\":\"One unknown 3 marks; the other 3 marks.\"},{\"id\":\"q24\",\"no\":\"24\",\"type\":\"work\",\"marks\":6,\"skill\":\"Inequalities\",\"lines\":6,\"stem\":\"Solve 5 − 2x ≥ 1.\",\"answer\":\"x ≤ 2\",\"explanation\":\"−2x ≥ −4. Divide by −2 and reverse: x ≤ 2.\",\"marking\":\"Isolate the x term 3 marks; reverse the inequality correctly 3 marks.\"},{\"id\":\"q25\",\"no\":\"25\",\"type\":\"work\",\"marks\":6,\"skill\":\"Geometry\",\"lines\":6,\"stem\":\"A ladder 13 m long leans against a vertical wall. The foot of the ladder is 5 m from the wall. How high up the wall does the ladder reach?\",\"answer\":\"12 m\",\"explanation\":\"h² + 5² = 13², h² = 169 − 25 = 144, h = 12.\",\"marking\":\"Pythagoras set-up 3 marks; 12 m 3 marks.\"}]},{\"id\":\"solve\",\"title\":\"Section D  Structured Questions\",\"instruction\":\"10 marks each. Total 30 marks. Set up equations. Include units.\",\"marks\":30,\"questions\":[{\"id\":\"q26\",\"no\":\"26\",\"type\":\"work\",\"marks\":10,\"skill\":\"Equations\",\"lines\":8,\"stem\":\"2 pens and 1 pencil cost $8. 1 pen and 2 pencils cost $7.\u003cbr/\u003e(a) Write two equations in a and b, where $a is the price of a pen and $b is the price of a pencil.\u003cbr/\u003e(b) Find a and b.\",\"answer\":\"(a) 2a + b = 8, a + 2b = 7; (b) a = 3, b = 2\",\"explanation\":\"2(2a + b) = 16 → 4a + 2b = 16. Subtract a + 2b = 7: 3a = 9, a = 3, b = 2.\",\"marking\":\"(a) 4 marks; (b) 6 marks.\"},{\"id\":\"q27\",\"no\":\"27\",\"type\":\"work\",\"marks\":10,\"skill\":\"Geometry\",\"lines\":8,\"stem\":\"A right-angled triangle has shorter sides 5 cm and 12 cm.\u003cbr/\u003e(a) Find the hypotenuse.\u003cbr/\u003e(b) A square is drawn on the hypotenuse. Find the area of the square.\",\"answer\":\"(a) 13 cm; (b) 169 cm²\",\"explanation\":\"(a) √(25+144)=13. (b) 13² = 169.\",\"marking\":\"(a) 4 marks; (b) 6 marks.\"},{\"id\":\"q28\",\"no\":\"28\",\"type\":\"work\",\"marks\":10,\"skill\":\"Algebra\",\"lines\":8,\"stem\":\"The formula v\u003csup\u003e2\u003c/sup\u003e = u\u003csup\u003e2\u003c/sup\u003e + 2as is given.\u003cbr/\u003e(a) Make s the subject.\u003cbr/\u003e(b) Find s when v = 10, u = 6 and a = 4.\",\"answer\":\"(a) s = (v² − u²)/(2a); (b) 8\",\"explanation\":\"2as = v² − u², s = (v² − u²)/(2a). (100 − 36)/8 = 64/8 = 8.\",\"marking\":\"(a) 6 marks; (b) 4 marks.\"}]},{\"id\":\"extra\",\"title\":\"Section E  Extension\",\"instruction\":\"10 marks in total. Not included in the 100 marks.\",\"marks\":10,\"extra\":true,\"questions\":[{\"id\":\"q29\",\"no\":\"29\",\"type\":\"work\",\"marks\":5,\"skill\":\"Factorization\",\"lines\":6,\"stem\":\"Solve x\u003csup\u003e2\u003c/sup\u003e − x − 12 = 0 by factorization.\",\"answer\":\"x = 4 or x = −3\",\"explanation\":\"(x − 4)(x + 3) = 0.\",\"marking\":\"Factorization 3 marks; both roots 2 marks.\"},{\"id\":\"q30\",\"no\":\"30\",\"type\":\"work\",\"marks\":5,\"skill\":\"Indices\",\"lines\":6,\"stem\":\"Express 1/27 as a power of 3.\",\"answer\":\"3\u003csup\u003e−3\u003c/sup\u003e\",\"explanation\":\"27 = 3³, so 1/27 = 3\u003csup\u003e−3\u003c/sup\u003e.\",\"marking\":\"Full marks for 3^{−3}.\"}]}]}}]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nf:I[27201,[\"/William-math/_next/static/chunks/3fntmmi971322.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"尹健熙 · Classroom\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"尹健熙 classroom: DSE mathematics papers, and Reading Explorer 3 as an on-site reading book.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/William-math/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Lf\",\"3\",{}]]\n"])</script></body></html>

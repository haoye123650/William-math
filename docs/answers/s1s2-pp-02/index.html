.js\",\"/William-math/_next/static/chunks/1ahwwad464sys.js\"],\"AnswersView\"]\n8:C\n4:[\"$\",\"$Le\",null,{\"paper\":{\"id\":\"s1s2-pp-02\",\"title\":\"Mathematics Practice Paper 2 (S1–S2 Combined)\",\"stars\":3,\"level\":\"S.1–S.2\",\"blurb\":\"Inequalities, angles, coordinates, mensuration, similarity and statistics. 120 marks.\",\"durationMin\":75,\"totalMarks\":120,\"extraMarks\":0,\"materials\":\"Pen and rough paper.\",\"notes\":[\"S.1–S.2 combined. The level tag on each question is [S1] or [S2].\",\"Suggested time is 75 minutes. It is a guide only.\",\"Write the final answer in the form the question asks for. The answer in the box is what is marked.\",\"Spacing is ignored when an answer is marked. A different form is marked wrong unless the key lists it.\",\"Take π = 3.14 if a numerical answer is required.\"],\"sections\":[{\"id\":\"A\",\"title\":\"Section A  Short answers\",\"instruction\":\"Answer every question. Write the final answer in the box. That final answer is what is marked.\",\"marks\":40,\"questions\":[{\"id\":\"A1\",\"no\":\"A1\",\"type\":\"fill\",\"stem\":\"Evaluate (−2/3) ÷ (4/9) − (−1/2).\",\"marks\":4,\"skill\":\"Directed numbers\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"A1-a\",\"answer\":\"-1\",\"accepted\":[\"-1\",\"−1\",\"-1.0\"]}],\"answer\":\"-1\",\"explanation\":\"(−2/3) ÷ (4/9) = (−2/3) × (9/4) = −3/2.\u003cbr\u003e−3/2 − (−1/2) = −3/2 + 1/2 = −1.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A2a\",\"no\":\"A2a\",\"type\":\"fill\",\"stem\":\"Solve the inequality 3 − 2x ≥ 7.\",\"marks\":3,\"skill\":\"Inequalities\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A2a-a\",\"answer\":\"x\u003c=-2\",\"accepted\":[\"x\u003c=-2\",\"x ≤ -2\",\"x ≤ −2\",\"x\u003c=−2\",\"x =\u003c -2\",\"x≤-2\",\"x≤−2\"]}],\"answer\":\"x\u003c=-2\",\"explanation\":\"3 − 2x ≥ 7\u003cbr\u003e−2x ≥ 4\u003cbr\u003ex ≤ −2.\u003cbr\u003e(Remember to reverse the inequality when dividing by a negative number.)\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A2b\",\"no\":\"A2b\",\"type\":\"fill\",\"stem\":\"Solve the inequality 3 − 2x ≥ 7, and write down the largest integer value of x.\",\"marks\":1,\"skill\":\"Inequalities\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A2b-a\",\"answer\":\"-2\",\"accepted\":[\"-2\",\"−2\"]}],\"answer\":\"-2\",\"explanation\":\"The solution is x ≤ −2, so the largest integer value of x is −2.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A3\",\"no\":\"A3\",\"type\":\"fill\",\"stem\":\"Make h the subject of the formula S = 2πr(r + h).\",\"marks\":4,\"skill\":\"Change of subject\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A3-a\",\"answer\":\"h=S/(2πr)-r\",\"accepted\":[\"h=S/(2πr)-r\",\"h=S/(2πr)−r\",\"h = S/(2πr) - r\",\"h = S/(2πr) − r\",\"h=(S-2πr^2)/(2πr)\",\"h=(S−2πr²)/(2πr)\",\"h = (S - 2πr^2)/(2πr)\",\"h=S/(2pi r)-r\",\"h=(S-2pir^2)/(2pir)\",\"h=S/(2*pi*r)-r\"]}],\"answer\":\"h=S/(2πr)-r\",\"explanation\":\"S = 2πr(r + h) → S/(2πr) = r + h\u003cbr\u003eh = S/(2πr) − r\u003cbr\u003e[or equivalently h = (S − 2πr²)/(2πr)].\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A4\",\"no\":\"A4\",\"type\":\"fill\",\"stem\":\"The price of a watch is first increased by 20% and then decreased by 20%. Find the overall percentage change in the price.\",\"marks\":4,\"skill\":\"Percentages\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A4-a\",\"answer\":\"decrease of 4%\",\"accepted\":[\"decrease of 4%\",\"a decrease of 4%\",\"decrease 4%\",\"4% decrease\",\"-4%\",\"−4%\",\"decreased by 4%\",\"an overall decrease of 4%\"]}],\"answer\":\"decrease of 4%\",\"explanation\":\"Take the original price as $100 (or 1 unit).\u003cbr\u003eAfter +20%: 120; after −20%: 120 × 0.8 = 96.\u003cbr\u003eOverall: a decrease of 4%.\u003cbr\u003e(Successive percentage changes multiply: 1.2 × 0.8 = 0.96.)\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A5\",\"no\":\"A5\",\"type\":\"fill\",\"stem\":\"Simplify (x² − 9) ÷ (x² + x − 12).\",\"marks\":4,\"skill\":\"Algebraic fractions\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A5-a\",\"answer\":\"(x+3)/(x+4)\",\"accepted\":[\"(x+3)/(x+4)\",\"(x + 3)/(x + 4)\",\"(x+3)/(x+4), x≠3\",\"\\\\frac{x+3}{x+4}\"]}],\"answer\":\"(x+3)/(x+4)\",\"explanation\":\"x² − 9 = (x + 3)(x − 3); x² + x − 12 = (x + 4)(x − 3).\u003cbr\u003e(x + 3)(x − 3) / [(x + 4)(x − 3)] = (x + 3)/(x + 4)\u003cbr\u003e(for x ≠ 3; omitting the condition is not penalised).\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A6a\",\"no\":\"A6a\",\"type\":\"fill\",\"stem\":\"The straight lines AB and CD are parallel. A transversal cuts them so that a pair of alternate angles are (4x − 15)° and (2x + 35)°.\u003cbr\u003eFind x.\",\"marks\":3,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A6a-a\",\"answer\":\"25\",\"accepted\":[\"25\",\"x=25\",\"x = 25\"]}],\"answer\":\"25\",\"explanation\":\"Alternate angles between parallel lines are equal: 4x − 15 = 2x + 35.\u003cbr\u003e2x = 50 → x = 25.\",\"assetIds\":[\"a6-parallel-lines\"],\"imagePlacement\":\"above\"},{\"id\":\"A6b\",\"no\":\"A6b\",\"type\":\"fill\",\"stem\":\"The straight lines AB and CD are parallel. A transversal cuts them so that a pair of alternate angles are (4x − 15)° and (2x + 35)°. (It has been found that x = 25.)\u003cbr\u003eFind the size of each of these angles, in degrees.\",\"marks\":1,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A6b-a\",\"answer\":\"85\",\"accepted\":[\"85\",\"85°\",\"85 degrees\"]}],\"answer\":\"85\",\"explanation\":\"Each angle = 4(25) − 15 = 85°.\",\"assetIds\":[\"a6-parallel-lines\"],\"imagePlacement\":\"above\"},{\"id\":\"A7a\",\"no\":\"A7a\",\"type\":\"fill\",\"stem\":\"In △ABC, ∠A = 2x, ∠B = 3x and the exterior angle at C is 110°.\u003cbr\u003eFind x.\",\"marks\":3,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A7a-a\",\"answer\":\"22\",\"accepted\":[\"22\",\"x=22\",\"x = 22\"]}],\"answer\":\"22\",\"explanation\":\"The exterior angle of a triangle equals the sum of the two interior opposite angles: 2x + 3x = 110.\u003cbr\u003ex = 22.\",\"assetIds\":[\"a7-exterior-angle\"],\"imagePlacement\":\"above\"},{\"id\":\"A7b\",\"no\":\"A7b\",\"type\":\"fill\",\"stem\":\"In △ABC, ∠A = 2x, ∠B = 3x and the exterior angle at C is 110°. (It has been found that x = 22.)\u003cbr\u003eFind the three interior angles of the triangle, in degrees. Give ∠A, ∠B and ∠C in that order (e.g. 44, 66, 70).\",\"marks\":1,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A7b-a\",\"answer\":\"44, 66, 70\",\"accepted\":[\"44, 66, 70\",\"44,66,70\",\"44°, 66°, 70°\",\"44,66,70 degrees\"]}],\"answer\":\"44, 66, 70\",\"explanation\":\"∠A = 44°, ∠B = 66°, ∠C = 180° − 110° = 70°.\u003cbr\u003eCheck: 44 + 66 + 70 = 180.\",\"assetIds\":[\"a7-exterior-angle\"],\"imagePlacement\":\"above\"},{\"id\":\"A8a\",\"no\":\"A8a\",\"type\":\"fill\",\"stem\":\"A bag contains 5 red, 3 blue and 2 green balls. A ball is drawn at random.\u003cbr\u003e(a) Find the probability that it is red.\",\"marks\":2,\"skill\":\"Probability\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A8a-a\",\"answer\":\"1/2\",\"accepted\":[\"1/2\",\"0.5\",\"5/10\",\"0.50\"]}],\"answer\":\"1/2\",\"explanation\":\"Total number of balls = 10. P(red) = 5/10 = 1/2.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A8b\",\"no\":\"A8b\",\"type\":\"fill\",\"stem\":\"A bag contains 5 red, 3 blue and 2 green balls. A ball is drawn at random.\u003cbr\u003e(b) Find the probability that it is not blue.\",\"marks\":2,\"skill\":\"Probability\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A8b-a\",\"answer\":\"7/10\",\"accepted\":[\"7/10\",\"0.7\",\"0.70\"]}],\"answer\":\"7/10\",\"explanation\":\"P(not blue) = (5 + 2)/10 = 7/10.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A9a\",\"no\":\"A9a\",\"type\":\"fill\",\"stem\":\"A(1, 2), B(7, 2) and C(7, 6) are three points.\u003cbr\u003e(a) Find the area of △ABC.\",\"marks\":3,\"skill\":\"Coordinates\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A9a-a\",\"answer\":\"12\",\"accepted\":[\"12\",\"12 square units\",\"12 sq units\"]}],\"answer\":\"12\",\"explanation\":\"AB = 6 units and BC = 4 units, with ∠ABC = 90°.\u003cbr\u003eArea = ½ × 6 × 4 = 12 square units.\",\"assetIds\":[\"a9-coordinates\"],\"imagePlacement\":\"above\"},{\"id\":\"A9b\",\"no\":\"A9b\",\"type\":\"fill\",\"stem\":\"A(1, 2), B(7, 2) and C(7, 6) are three points.\u003cbr\u003e(b) Find the slope of AC.\",\"marks\":1,\"skill\":\"Coordinates\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A9b-a\",\"answer\":\"2/3\",\"accepted\":[\"2/3\",\"4/6\",\"0.667\",\"0.66...\",\"0.6 recurring\"]}],\"answer\":\"2/3\",\"explanation\":\"Slope of AC = (6 − 2)/(7 − 1) = 4/6 = 2/3.\",\"assetIds\":[\"a9-coordinates\"],\"imagePlacement\":\"above\"},{\"id\":\"A10a\",\"no\":\"A10a\",\"type\":\"fill\",\"stem\":\"A prism has a uniform triangular cross-section of area 24 cm² and perimeter 20 cm. The length of the prism is 15 cm.\u003cbr\u003e(a) Find its volume, in cm³.\",\"marks\":2,\"skill\":\"Mensuration\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A10a-a\",\"answer\":\"360\",\"accepted\":[\"360\",\"360 cm^3\",\"360 cm³\",\"360cm3\"]}],\"answer\":\"360\",\"explanation\":\"V = area of cross-section × length = 24 × 15 = 360 cm³.\",\"assetIds\":[\"a10-prism\"],\"imagePlacement\":\"above\"},{\"id\":\"A10b\",\"no\":\"A10b\",\"type\":\"fill\",\"stem\":\"A prism has a uniform triangular cross-section of area 24 cm² and perimeter 20 cm. The length of the prism is 15 cm.\u003cbr\u003e(b) Find its total surface area, in cm².\",\"marks\":2,\"skill\":\"Mensuration\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A10b-a\",\"answer\":\"348\",\"accepted\":[\"348\",\"348 cm^2\",\"348 cm²\",\"348cm2\"]}],\"answer\":\"348\",\"explanation\":\"Total surface area = 2 × 24 + 20 × 15 = 48 + 300 = 348 cm².\u003cbr\u003e(The two triangular ends plus the three rectangular faces, whose total width is the perimeter of the cross-section.)\",\"assetIds\":[\"a10-prism\"],\"imagePlacement\":\"above\"}]},{\"id\":\"B\",\"title\":\"Section .5 litres per minute, in minutes.\",\"marks\":2,\"skill\":\"Mensuration\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"B12d-a\",\"answer\":\"8\",\"accepted\":[\"8\",\"8 minutes\",\"8 min\"]}],\"answer\":\"8\",\"explanation\":\"Time = 20 ÷ 2.5 = 8 minutes.\",\"assetIds\":[\"b12-tank\"],\"imagePlacement\":\"above\"},{\"id\":\"B13a\",\"no\":\"B13a\",\"type\":\"fill\",\"stem\":\"A map is drawn to a scale of 1 : 25 000.\u003cbr\u003e(a) Find the actual distance, in km, represented by 4 cm on the map.\",\"marks\":3,\"skill\":\"Ratio\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"B13a-a\",\"answer\":\"1\",\"accepted\":[\"1\",\"1 km\",\"1km\"]}],\"answer\":\"1\",\"explanation\":\"Actual length = 4 × 25 000 = 100 000 cm = 1 km.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"B13b\",\"no\":\"B13b\",\"type\":\"fill\",\"stem\":\"A map is drawn to a scale of 1 : 25 000.\u003cbr\u003e(b) A rectangular park measures 6 cm by 4 cm on the map. Find its actual area in km².\",\"marks\":3,\"skill\":\"Ratio\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"B13b-a\",\"answer\":\"1.5\",\"accepted\":[\"1.5\",\"1.5 km^2\",\"1.5 km²\",\"3/2\"]}],\"answer\":\"1.5\",\"explanation\":\"Actual sides = 1.5 km and 1 km.\u003cbr\u003eArea = 1.5 × 1 = 1.5 km².\u003cbr\u003e(Do not multiply the map area 24 cm² by 25 000 — areas scale as the square of the ratio.)\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"B13c\",\"no\":\"B13c\",\"type\":\"fill\",\"stem\":\"Two similar triangles have areas in the ratio 9 : 25. The perimeter of the smaller triangle is 24 cm. Find the perimeter of the larger triangle, in cm.\",\"marks\":4,\"skill\":\"Similar figures\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"B13c-a\",\"answer\":\"40\",\"accepted\":[\"40\",\"40 cm\",\"40cm\"]}],\"answer\":\"40\",\"explanation\":\"Area ratio 9 : 25 ⇒ side (length) ratio 3 : 5.\u003cbr\u003ePerimeter of larger = 24 × 5/3 = 40 cm.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"B14a\",\"no\":\"B14a\",\"type\":\"fill\",\"stem\":\"A survey of 240 students on their favourite sport gave the following numbers: Football 80, Basketball 60, Swimming 40, Others 60.\u003cbr\u003e(a) Show that the total number of students is 240.\",\"marks\":2,\"skill\":\"Statistics\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"B14a-a\",\"answer\":\"240\",\"accepted\":[\"240\",\"80+60+40+60=240\"]}],\"answer\":\"240\",\"explanation\":\"80 + 60 + 40 + 60 = 240.\",\"assetIds\":[\"b14-sports-bar\"],\"imagePlacement\":\"above\"},{\"id\":\"B14b\",\"no\":\"B14b\",\"type\":\"fill\",\"stem\":\"A survey of 240 students on their favourite sport gave the following numbers: Football 80, Basketball 60, Swimming 40, Others 60.\u003cbr\u003e(b) Find the angle of the sector representing football in a pie chart, in degrees.\",\"marks\":3,\"skill\":\"Statistics\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"B14b-a\",\"answer\":\"120\",\"accepted\":[\"120\",\"120°\",\"120 degrees\"]}],\"answer\":\"120\",\"explanation\":\"Angle = 80/240 × 360° = 120°.\",\"assetIds\":[\"b14-sports-bar\"],\"imagePlacement\":\"above\"},{\"id\":\"B14c\",\"no\":\"B14c\",\"type\":\"fill\",\"stem\":\"A survey of 240 students on their favourite sport gave the following numbers: Football 80, Basketball 60, Swimming 40, Others 60.\u003cbr\u003e(c) Express the number of students choosing “Others” as a percentage of the total.\",\"marks\":2,\"skill\":\"Percentages\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"B14c-a\",\"answer\":\"25%\",\"accepted\":[\"25%\",\"25\",\"25 percent\"]}],\"answer\":\"25%\",\"explanation\":\"60/240 × 100% = 25%.\",\"assetIds\":[\"b14-sports-bar\"],\"imagePlacement\":\"above\"},{\"id\":\"B14d\",\"no\":\"B14d\",\"type\":\"fill\",\"stem\":\"A survey of 240 students on their favourite sport gave the following numbers: Football 80, Basketball 60, Swimming 40, Others 60.\u003cbr\u003e(d) The number choosing basketball is what percentage of the number choosing football?\",\"marks\":3,\"skill\":\"Percentages\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"B14d-a Tag\":\"S2\",\"blanks\":[{\"id\":\"C15c-a\",\"answer\":\"119\",\"accepted\":[\"119\",\"119 cm^2\",\"119 cm²\"]}],\"answer\":\"119\",\"explanation\":\"Area = 17 × 7 = 119 cm².\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"C15d\",\"no\":\"C15d\",\"type\":\"fill\",\"stem\":\"A rectangle has breadth 7 cm and length 17 cm, so its area is 119 cm².\u003cbr\u003e(d) If both the length and the breadth are increased by 2 cm, find the percentage increase in the area, correct to 3 significant figures.\",\"marks\":3,\"skill\":\"Percentages\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C15d-a\",\"answer\":\"43.7%\",\"accepted\":[\"43.7%\",\"43.7\",\"43.70%\"]}],\"answer\":\"43.7%\",\"explanation\":\"New dimensions 19 cm × 9 cm, new area = 171 cm².\u003cbr\u003eIncrease = (171 − 119)/119 × 100% ≈ 43.697…% ≈ 43.7% (3 s.f.).\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"C16a\",\"no\":\"C16a\",\"type\":\"fill\",\"stem\":\"In △ABC, AB = AC and ∠BAC = 36°. The bisector of ∠ABC meets AC at D.\u003cbr\u003e(a) Find ∠ABC and ∠ACB, in degrees.\",\"marks\":3,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C16a-a\",\"answer\":\"72, 72\",\"accepted\":[\"72, 72\",\"72,72\",\"72°, 72°\",\"72 each\",\"72° each\"]}],\"answer\":\"72, 72\",\"explanation\":\"AB = AC ⇒ base angles equal: ∠ABC = ∠ACB = (180° − 36°)/2 = 72° each.\",\"assetIds\":[\"c16-triangle\"],\"imagePlacement\":\"above\"},{\"id\":\"C16b\",\"no\":\"C16b\",\"type\":\"fill\",\"stem\":\"In △ABC, AB = AC and ∠BAC = 36°. The bisector of ∠ABC meets AC at D. (It has been found that ∠ABC = 72°.)\u003cbr\u003e(b) Find ∠ABD and ∠DBC, in degrees.\",\"marks\":2,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C16b-a\",\"answer\":\"36, 36\",\"accepted\":[\"36, 36\",\"36,36\",\"36°, 36°\",\"36 each\",\"36° each\"]}],\"answer\":\"36, 36\",\"explanation\":\"BD bisects ∠ABC, so ∠ABD = ∠DBC = 72° ÷ 2 = 36° each.\",\"assetIds\":[\"c16-triangle\"],\"imagePlacement\":\"above\"},{\"id\":\"C16c\",\"no\":\"C16c\",\"type\":\"fill\",\"stem\":\"In △ABC, AB = AC and ∠BAC = 36°. The bisector of ∠ABC meets AC at D.\u003cbr\u003e(c) Find ∠ADB, in degrees.\",\"marks\":2,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C16c-a\",\"answer\":\"108\",\"accepted\":[\"108\",\"108°\",\"108 degrees\"]}],\"answer\":\"108\",\"explanation\":\"In △ABD: ∠ADB = 180° − 36° − 36° = 108°.\",\"assetIds\":[\"c16-triangle\"],\"imagePlacement\":\"above\"},{\"id\":\"C16d\",\"no\":\"C16d\",\"type\":\"fill\",\"stem\":\"In △ABC, AB = AC and ∠BAC = 36°. The bisector of ∠ABC meets AC at D. (It has been found that ∠ADB = 108°.)\u003cbr\u003e(d) Hence find ∠BDC, in degrees.\",\"marks\":2,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C16d-a\",\"answer\":\"72\",\"accepted\":[\"72\",\"72°\",\"72 degrees\"]}],\"answer\":\"72\",\"explanation\":\"A, D, C are collinear, so ∠BDC = 180° − 108° = 72°.\",\"assetIds\":[\"c16-triangle\"],\"imagePlacement\":\"above\"},{\"id\":\"C16e\",\"no\":\"C16e\",\"type\":\"fill\",\"stem\":\"In △ABC, AB = AC and ∠BAC = 36°. The bisector of ∠ABC meets AC at D.\u003cbr\u003e(e) Show that △BDC is an isosceles triangle.\",\"marks\":3,\"skill\":\"Angles and polygons\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C16e-a\",\"answer\":\"triangle BDC is isosceles (BC=BD)\",\"accepted\":[\"triangle BDC is isosceles (BC=BD)\",\"isosceles\",\"△BDC is isosceles\",\"BC=BD\",\"BC = BD\",\"isosceles (BC=BD)\"]}],\"answer\":\"triangle BDC is isosceles (BC=BD)\",\"explanation\":\"In △BDC: ∠DBC = 36°, ∠BCD = ∠BCA = 72°, ∠BDC = 72°.\u003cbr\u003eSince ∠BCD = ∠BDC, the sides opposite them are equal: BC = BD.\u003cbr\u003e∴ △BDC is isosceles.\u003cbr\u003e(This is the “golden triangle”. With ∠BAC = 36° and BC = BD = AD, point D divides AC in the golden ratio.)\",\"assetIds\":[\"c16-triangle\"],\"imagePlacement\":\"above\"},{\"id\":\"C17a\",\"no\":\"C17a\",\"type\":\"fill\",\"stem\":\"A mobile phone company offers two monthly plans. Plan A: fixed charge $120 plus $6 for each GB of data used. Plan B: fixed charge $200 plus $2 for each GB of data used.\u003cbr\u003e(a) Find the monthly cost of each plan when 10 GB of data is used, in dollars. Give Plan A then Plan B (e.g. 180, 220).\",\"marks\":4,\"skill\":\"Linear equations\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C17a-a\",\"answer\":\"180, 220\",\"accepted\":[\"180, 220\",\"180,220\",\"$$180, $220\"]}],\"answer\":\"180, 220\",\"explanation\":\"Plan A = 120 + 6 × 10 = $180; Plan B = 200 + 2 × 10 = $220.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"C17b\",\"no\":\"C17b\",\"type\":\"fill\",\"stem\":\"A mobile phone company offers two monthly plans. Plan A: fixed charge $120 plus $6 for each GB of data used. Plan B: fixed charge $200 plus $2 for each GB of data used.\u003cbr\u003e(b) Find the monthly cost of each plan when 30 GB of data is used, in dollars. Give Plan A then Plan B (e.g. 300, 260).\",\"marks\":3,\"skill\":\"Linear equations\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C17b-a\",\"answer\":\"300, 260\",\"accepted\":[\"300, 260\",\"300,260\",\"$$300, $260\"]}],\"answer\":\"300, 260\",\"explanation\":\"Plan A = 120 + 6 × 30 = $300; Plan B = 200 + 2 × 30 = $260.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"C17c\",\"no\":\"C17c\",\"type\":\"fill\",\"stem\":\"A mobile phone company offers two monthly plans. Plan A: fixed charge $120 plus $6 for each GB of data used. Plan B: fixed charge $200 plus $2 for each GB of data used.\u003cbr\u003e(c) Find the amount of data for which the two plans cost the same, and the common cost. Give the data in GB and the common cost in dollars (e.g. 20, 240).\",\"marks\":3,\"skill\":\"Linear equations\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C17c-a\",\"answer\":\"20, 240\",\"accepted\":[\"20, 240\",\"20,240\",\"20 GB, $240\",\"20GB, 240\"]}],\"answer\":\"20, 240\",\"explanation\":\"120 + 6g = 200 + 2g → 4g = 80, g = 20.\u003cbr\u003e20 GB, common cost $240.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"C17d\",\"no\":\"C17d\",\"type\":\"fill\",\"stem\":\"A mobile phone company offers two monthly plans. Plan A: fixed charge $120 plus $6 for each GB of data used. Plan B: fixed charge $200 plus $2 for each GB of data used.\u003cbr\u003e(d) A light user uses about 5 GB a month and a heavy user uses about 40 GB. Advise each of them on which plan to choose. Give the light user’s plan then the heavy user’s plan (e.g. A, B).\",\"marks\":2,\"skill\":\"Linear equations\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"C17d-a\",\"answer\":\"A, B\",\"accepted\":[\"A, B\",\"A,B\",\"Plan A, Plan B\",\"light A, heavy B\",\"choose Plan A; choose Plan B\"]}],\"answer\":\"A, B\",\"explanation\":\"At 5 GB: A = $150, B = $210 → choose Plan A.\u003cbr\u003eAt 40 GB: A = $360, B = $280 → choose Plan B.\u003cbr\u003e(The plan with the lower fixed charge wins for light users; the plan with the lower unit rate wins for heavy users.)\",\"assetIds\":[],\"imagePlacement\":null}]}],\"scoreBands\":[{\"range\":\"108–120\",\"note\":\"Secure across this combined paper. Next, try the questions again without the level tag as a hint.\"},{\"range\":\"90–107\",\"note\":\"Mostly secure. Redo the questions marked wrong, starting with [S2].\"},{\"range\":\"72–89\",\"note\":\"The mix has gaps. Use the level tag on each miss to choose what to reteach.\"},{\"range\":\"below 72\",\"note\":\"Rebuild the [S1] items first, then return to [S2].\"}],\"tutorTips\":[\"B12b asks whether the tank overflows. The box matches the keyed conclusion only, so read the method.\",\"B14a asks the student to show that the total is 240. The box matches the keyed total.\",\"C16e asks the student to show that triangle BDC is isosceles. The box matches the keyed phrase only.\",\"C17d asks for a plan suggestion written as A, B.\",\"A3, B11a and C15a ask for an expression or equation. Only the listed forms are accepted.\",\"B13 is a scale and perimeter calculation. It has no figure.\"],\"assets\":[{\"id\":\"a6-parallel-

.7.\"},{\"id\":\"q9\",\"no\":\"9\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Approximation\",\"stem\":\"0.003456 correct to 3 significant figures is\",\"options\":[{\"key\":\"A\",\"text\":\"0.003\"},{\"key\":\"B\",\"text\":\"0.00346\"},{\"key\":\"C\",\"text\":\"0.00345\"},{\"key\":\"D\",\"text\":\"0.346\"}],\"answer\":\"B\",\"explanation\":\"The first three significant figures are 345; the next digit 6 rounds up to 0.00346.\"},{\"id\":\"q10\",\"no\":\"10\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"The LCM of 12 and 18 is\",\"options\":[{\"key\":\"A\",\"text\":\"6\"},{\"key\":\"B\",\"text\":\"36\"},{\"key\":\"C\",\"text\":\"216\"},{\"key\":\"D\",\"text\":\"30\"}],\"answer\":\"B\",\"explanation\":\"12 = 2² × 3, 18 = 2 × 3², LCM = 2² × 3² = 36. 6 is the HCF.\"}]},{\"id\":\"fill\",\"title\":\"Section B  Short Questions\",\"instruction\":\"2 marks each. Total 20 marks. Working is not required. For two blanks, 1 mark each.\",\"marks\":20,\"questions\":[{\"id\":\"q11\",\"no\":\"11\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"|−8 − 4| − |3 − 11| =\",\"blanks\":[{\"id\":\"q11a\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"4\",\"explanation\":\"12 − 8 = 4.\"},{\"id\":\"q12\",\"no\":\"12\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Percentages\",\"stem\":\"0.375 = ________ % = ________ (in simplest form)\",\"blanks\":[{\"id\":\"q12a\",\"label\":\"percentage\",\"answer\":\"37.5\",\"accepted\":[\"37.5\"]},{\"id\":\"q12b\",\"label\":\"fraction\",\"answer\":\"3/8\",\"accepted\":[\"3/8\"]}],\"answer\":\"37.5%; 3/8\",\"explanation\":\"0.375 × 100 = 37.5; 0.375 = 3/8.\",\"marking\":\"1 mark each blank.\"},{\"id\":\"q13\",\"no\":\"13\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Percentages\",\"stem\":\"Three numbers are in the ratio 3 : 4 : 5. Their sum is 144. The middle number is\",\"blanks\":[{\"id\":\"q13a\",\"answer\":\"48\",\"accepted\":[\"48\"]}],\"answer\":\"48\",\"explanation\":\"3 + 4 + 5 = 12 parts. Each part is 12. Middle = 4 × 12 = 48.\"},{\"id\":\"q14\",\"no\":\"14\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"The degree of 5x\u003csup\u003e2\u003c/sup\u003ey\u003csup\u003e3\u003c/sup\u003e is ________ and its coefficient is ________.\",\"blanks\":[{\"id\":\"q14a\",\"label\":\"degree\",\"answer\":\"5\",\"accepted\":[\"5\"]},{\"id\":\"q14b\",\"label\":\"coefficient\",\"answer\":\"5\",\"accepted\":[\"5\"]}],\"answer\":\"degree 5; coefficient 5\",\"explanation\":\"Degree = 2 + 3 = 5.\",\"marking\":\"1 mark each blank.\"},{\"id\":\"q15\",\"no\":\"15\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"If a = −3 and b = −1, then a\u003csup\u003e2\u003c/sup\u003e − 2ab + b\u003csup\u003e2\u003c/sup\u003e =\",\"blanks\":[{\"id\":\"q15a\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"4\",\"explanation\":\"(a − b)² = (−3 − (−1))² = (−2)² = 4.\"},{\"id\":\"q16\",\"no\":\"16\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"AB // CD. A pair of co-interior angles: one of them is 110°. The other is ________ °.\",\"blanks\":[{\"id\":\"q16a\",\"answer\":\"70\",\"accepted\":[\"70\",\"70°\"]}],\"answer\":\"70\",\"explanation\":\"180 − 110 = 70.\"},{\"id\":\"q17\",\"no\":\"17\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Approximation\",\"stem\":\"Round 4.996 to 2 decimal places.\",\"blanks\":[{\"id\":\"q17a\",\"answer\":\"5.00\",\"accepted\":[\"5.00\",\"5\"]}],\"answer\":\"5.00\",\"explanation\":\"The hundredths digit 9 rounds up, so 4.996 → 5.00.\"},{\"id\":\"q18\",\"no\":\"18\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"The mean of 4, 6, x and 10 is 7. Then x =\",\"blanks\":[{\"id\":\"q18a\",\"answer\":\"8\",\"accepted\":[\"8\"]}],\"answer\":\"8\",\"explanation\":\"(20 + x)/4 = 7, so 20 + x = 28, x = 8.\"},{\"id\":\"q19\",\"no\":\"19\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The point (−3, 5) lies in quadrant ________.\",\"blanks\":[{\"id\":\"q19a\",\"answer\":\"II\",\"accepted\":[\"2\",\"ii\",\"II\",\"second\",\"2nd\"]}],\"answer\":\"II (2nd)\",\"explanation\":\"x \u003c 0, y \u003e 0.\"},{\"id\":\"q20\",\"no\":\"20\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"A triangle has base 10 cm and height 6 cm. Its area is ________ cm\u003csup\u003e2\u003c/sup\u003e.\",\"blanks\":[{\"id\":\"q20a\",\"answer\":\"30\",\"accepted\":[\"30\"]}],\"answer\":\"30\",\"explanation\":\"½ × 10 × 6 = 30.\"}]},{\"id\":\"calc\",\"title\":\"Section C  Conventional Questions\",\"instruction\":\"6 marks each. Total 30 marks. Show your working.\",\"marks\":30,\"questions\":[{\"id\":\"q21\",\"no\":\"21\",\"type\":\"work\",\"marks\":6,\"skill\":\"Directed numbers\",\"lines\":6,\"stem\":\"Find the value of (−1)\u003csup\u003e4\u003c/sup\u003e − (−1)\u003csup\u003e3\u003c/sup\u003e × (−2)\u003csup\u003e2\u003c/sup\u003e.\",\"answer\":\"5\",\"explanation\":\"1 − (−1) × 4 = 1 − (−4) = 5.\",\"marking\":\"Powers 2 marks; order of operations 2 marks; 5 a further 2 marks.\"},{\"id\":\"q22\",\"no\":\"22\",\"type\":\"work\",\"marks\":6,\"skill\":\"Directed numbers\",\"lines\":6,\"stem\":\"Find the value of (\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e3\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e) ÷ \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e12\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e.\",\"answer\":\"1/2\",\"explanation\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e3\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e12\u003c/span\u003e\u003c/span\u003e. Then 1 − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e.\",\"marking\":\"Bracket 2 marks; division 2 marks; final 2 marks. 0.5 accepted.\"},{\"id\":\"q23\",\"no\":\"23\",\"type\":\"work\",\"marks\":6,\"skill\":\"Equations\",\"lines\":7,\"stem\":\"Solve \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003ex + 1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2x − 1\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/span\u003e = 1.\",\"answer\":\"x = −7\",\"explanation\":\"×12: 3(x + 1) − 2(2x − 1) = 12\u003cbr/\u003e3x + 3 − 4x + 2 = 12\u003cbr/\u003e−x + 5 = 12\u003cbr/\u003ex = −7\",\"marking\":\"Clearing denominators 2 marks; expanding 2 marks; x = −7 a further 2 marks.\"},{\"id\":\"q24\",\"no\":\"24\",\"type\":\"work\",\"marks\":6,\"skill\":\"Equations\",\"lines\":6,\"stem\":\"Solve 3(2x − 5) + 4 = 5(x − 1).\",\"answer\":\"x = 6\",\"explanation\":\"6x − 15 + 4 = 5x − 5\u003cbr/\u003e6x − 11 = 5x − 5\u003cbr/\u003ex = 6\",\"marking\":\"Expand 2 marks; collect 2 marks; x = 6 a further 2 marks.\"},{\"id\":\"q25\",\"no\":\"25\",\"type\":\"work\",\"marks\":6,\"skill\":\"Algebra\",\"lines\":6,\"stem\":\"Simplify 2(3a − b) − 3(a − 2b) + a, then find its value when a = 2 and b = −1.\",\"answer\":\"4\",\"explanation\":\"6a − 2b − 3a + 6b + a = 4a + 4b\u003cbr/\u003e8 + (−4) = 4\",\"marking\":\"Expand 2 marks; 4a + 4b 2 marks; 4 a further 2 marks.\"}]},{\"id\":\"solve\",\"title\":\"Section D  Structured Questions\",\"instruction\":\"10 marks each. Total 30 marks. Set up equations or expressions. Include units.\",\"marks\":30,\"questions\":[{\"id\":\"q26\",\"no\":\"26\",\"type\":\"work\",\"marks\":10,\"skill\":\"Percentages\",\"lines\":8,\"stem\":\"A phone is priced at $4800. It is first sold at 15% off, then a further 8% off the discounted price.\u003cbr/\u003e(a) Find the final selling price.\u003cbr/\u003e(b) Find the overall percentage discount on the original price.\",\"answer\":\"(a) $3753.60; (b) 21.8%\",\"explanation\":\"(a) 4800 × 0.85 = 4080; 4080 × 0.92 = 3753.6.\u003cbr/\u003e(b) 1 − 3753.6/4800 = 0.218 = 21.8%.\",\"marking\":\"(a) 6 marks (allow 3753.6); (b) 4 marks.\"},{\"id\":\"q27\",\"no\":\"27\",\"type\":\"work\",\"marks\":10,\"skill\":\"Equations\",\"lines\":8,\"stem\":\"Towns A and B are 360 km apart. Car A travels at 80 km/h and car B at 40 km/h towards each other. Car B starts 1 hour later than car A.\u003cbr/\u003e(a) How long after car A sets off do they meet?\u003cbr/\u003e(b) How far has car A travelled when they meet?\",\"answer\":\"(a) 10/3 h (3 h 20 min); (b) 800/3 km (about 266.7 km)\",\"explanation\":\"After 1 h, car A has gone 80 km; 280 km remain. Time then = 280/120 = 7/3 h.\u003cbr/\u003eTotal time = 1 + 7/3 = 10/3 h. Distance = 80 × 10/3 = 800/3 km.\",\"marking\":\"(a) 6 marks; (b) 4 marks. Mixed numbers or decimals accepted if exact enough.\"},{\"id\":\"q28\",\"no\":\"28\",\"type\":\"work\",\"marks\":10,\"skill\":\"Geometry\",\"lines\":8,\"stem\":\"AB // CD. A transversal meets AB at E and CD at F. ∠AEF = 58°.\u003cbr/\u003e(a) Find the corresponding angle to ∠AEF.\u003cbr/\u003e(b) Find the alternate angle to ∠AEF.\u003cbr/\u003e(c) Find the co-interior angle to ∠AEF.\",\"answer\":\"(a) 58°; (b) 58°; (c) 122°\",\"explanation\":\"Corresponding and alternate angles are equal to 58°. Co-interior: 180° − 58° = 122°.\",\"marking\":\"3 marks, 3 marks, 4 marks.\"}]},{\"id\":\"extra\",\"title\":\"Section E  Extension\",\"instruction\":\"10 marks in total. Not included in the 100 marks.\",\"marks\":10,\"extra\":true,\"questions\":[{\"id\":\"q29\",\"no\":\"29\",\"type\":\"work\",\"marks\":5,\"skill\":\"Equations\",\"lines\":6,\"stem\":\"The sum of three consecutive integers is 96. Find the three integers.\",

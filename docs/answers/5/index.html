9rr2fiy.js\"],\"AnswersView\"]\n8:C\n4:[\"$\",\"$Le\",null,{\"paper\":{\"id\":\"5\",\"title\":\"Test 5 · S.4 Mathematics\",\"stars\":5,\"level\":\"S.4\",\"blurb\":\"DSE Compulsory Part (S.4): quadratic formula, remainder theorem, logarithms, straight lines and special-angle trigonometry.\",\"durationMin\":90,\"totalMarks\":100,\"extraMarks\":10,\"materials\":\"Pen, ruler and rough paper. Calculators are not allowed.\",\"notes\":[\"This paper is written in the style of HKDSE Mathematics Compulsory Part Paper 1, using S.4 topics that appear every year: quadratic equations, remainder theorem, indices and logarithms, the equation of a straight line, and 30°–60°–90° trigonometry.\",\"Questions are original. They follow the HKEAA syllabus, not a past paper wording.\",\"For Sections A and B, write answers only. For Sections C and D, show working.\",\"Leave answers in surds or π where needed. Section E is extra and is not in the 100 marks.\"],\"scoreBands\":[{\"range\":\"90–100\",\"note\":\"Ready for S.5 pace. Next: circle equations, geometric series and the cosine rule.\"},{\"range\":\"75–89\",\"note\":\"Methods are there. Discriminant, remainder theorem and log laws need drilling.\"},{\"range\":\"60–74\",\"note\":\"S.3 factorization is not fully secure. Revisit completing the square before the formula.\"},{\"range\":\"below 60\",\"note\":\"Do Test 4 first. S.4 will pile up if expanding and special angles are still weak.\"}],\"tutorTips\":[\"Q1 and Q21: discriminant first, then the formula. If Δ is a square, they should still show the formula once.\",\"Q3 and Q22: remainder theorem is f(a) when dividing by x − a. Dividing by x + 1 means f(−1).\",\"Q8: sum and product of roots. α + β = −b/a, αβ = c/a for ax² + bx + c = 0.\",\"Q24 is 30-60-90 in a right triangle. Do not reach for the sine rule.\",\"Q29: log A + log B = log(AB). Domain x \u0026gt; 2.\"],\"sections\":[{\"id\":\"mc\",\"title\":\"Section A  Multiple Choice\",\"instruction\":\"2 marks each. Total 20 marks. Choose the best answer.\",\"marks\":20,\"questions\":[{\"id\":\"q1\",\"no\":\"1\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Quadratic equations\",\"stem\":\"The discriminant of x\u003csup\u003e2\u003c/sup\u003e − 6x + 9 = 0 is\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"9\"},{\"key\":\"C\",\"text\":\"36\"},{\"key\":\"D\",\"text\":\"−9\"}],\"answer\":\"A\",\"explanation\":\"Δ = 36 − 36 = 0. One real repeated root.\"},{\"id\":\"q2\",\"no\":\"2\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Logarithms\",\"stem\":\"log\u003csub\u003e10\u003c/sub\u003e 1000 =\",\"options\":[{\"key\":\"A\",\"text\":\"2\"},{\"key\":\"B\",\"text\":\"3\"},{\"key\":\"C\",\"text\":\"4\"},{\"key\":\"D\",\"text\":\"100\"}],\"answer\":\"B\",\"explanation\":\"10³ = 1000.\"},{\"id\":\"q3\",\"no\":\"3\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Polynomials\",\"stem\":\"The remainder when x\u003csup\u003e3\u003c/sup\u003e − 2x + 1 is divided by x − 1 is\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"1\"},{\"key\":\"C\",\"text\":\"2\"},{\"key\":\"D\",\"text\":\"−1\"}],\"answer\":\"A\",\"explanation\":\"f(1) = 1 − 2 + 1 = 0.\"},{\"id\":\"q4\",\"no\":\"4\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The slope of the line 2x + 3y − 6 = 0 is\",\"options\":[{\"key\":\"A\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"B\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e−2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e3\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"2\"}],\"answer\":\"B\",\"explanation\":\"3y = −2x + 6, y = −(2/3)x + 2.\"},{\"id\":\"q5\",\"no\":\"5\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Sequences\",\"stem\":\"The common ratio of the geometric sequence 2, 6, 18, … is\",\"options\":[{\"key\":\"A\",\"text\":\"2\"},{\"key\":\"B\",\"text\":\"3\"},{\"key\":\"C\",\"text\":\"4\"},{\"key\":\"D\",\"text\":\"6\"}],\"answer\":\"B\",\"explanation\":\"6/2 = 18/6 = 3.\"},{\"id\":\"q6\",\"no\":\"6\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Trigonometry\",\"stem\":\"sin 60° =\",\"options\":[{\"key\":\"A\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"B\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e√2\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e√3\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"1\"}],\"answer\":\"C\",\"explanation\":\"sin 60° = √3/2.\"},{\"id\":\"q7\",\"no\":\"7\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Functions\",\"stem\":\"By completing the square, the minimum value of x\u003csup\u003e2\u003c/sup\u003e + 6x + 5 is\",\"options\":[{\"key\":\"A\",\"text\":\"−9\"},{\"key\":\"B\",\"text\":\"−4\"},{\"key\":\"C\",\"text\":\"5\"},{\"key\":\"D\",\"text\":\"14\"}],\"answer\":\"B\",\"explanation\":\"(x + 3)² − 9 + 5 = (x + 3)² − 4. Minimum −4.\"},{\"id\":\"q8\",\"no\":\"8\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Quadratic equations\",\"stem\":\"If α and β are the roots of x\u003csup\u003e2\u003c/sup\u003e − 5x + 6 = 0, then α + β =\",\"options\":[{\"key\":\"A\",\"text\":\"5\"},{\"key\":\"B\",\"text\":\"6\"},{\"key\":\"C\",\"text\":\"−5\"},{\"key\":\"D\",\"text\":\"1\"}],\"answer\":\"A\",\"explanation\":\"α + β = −b/a = 5. αβ = 6.\"},{\"id\":\"q9\",\"no\":\"9\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The distance from (0, 0) to the line 3x − 4y + 5 = 0 is\",\"options\":[{\"key\":\"A\",\"text\":\"1\"},{\"key\":\"B\",\"text\":\"5\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e5\u003c/span\u003e\u003cspan\u003e7\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"3\"}],\"answer\":\"A\",\"explanation\":\"|5| / √(9 + 16) = 5/5 = 1.\"},{\"id\":\"q10\",\"no\":\"10\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Probability\",\"stem\":\"P(A) = 0.3, P(B) = 0.4 and A, B are independent. P(A and B) =\",\"options\":[{\"key\":\"A\",\"text\":\"0.12\"},{\"key\":\"B\",\"text\":\"0.7\"},{\"key\":\"C\",\"text\":\"0.58\"},{\"key\":\"D\",\"text\":\"0.3\"}],\"answer\":\"A\",\"explanation\":\"Independent: P(A ∩ B) = P(A)P(B) = 0.12.\"}]},{\"id\":\"fill\",\"title\":\"Section B  Short Questions\",\"instruction\":\"2 marks each. Total 20 marks. Working is not required. For two blanks, 1 mark each.\",\"marks\":20,\"questions\":[{\"id\":\"q11\",\"no\":\"11\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Quadratic equations\",\"stem\":\"Solve x\u003csup\u003e2\u003c/sup\u003e + x − 6 = 0.\",\"blanks\":[{\"id\":\"q11a\",\"answer\":\"2 or -3\",\"accepted\":[\"2 or -3\",\"2 or −3\",\"-3 or 2\",\"−3 or 2\",\"2,-3\",\"-3,2\",\"x=2 or x=-3\",\"x=2 or x=−3\"]}],\"answer\":\"x = 2 or x = −3\",\"explanation\":\"(x + 3)(x − 2) = 0.\"},{\"id\":\"q12\",\"no\":\"12\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Polynomials\",\"stem\":\"The remainder when x\u003csup\u003e3\u003c/sup\u003e − 8 is divided by x − 2 is\",\"blanks\":[{\"id\":\"q12a\",\"answer\":\"0\",\"accepted\":[\"0\"]}],\"answer\":\"0\",\"explanation\":\"f(2) = 8 − 8 = 0. So x − 2 is a factor.\"},{\"id\":\"q13\",\"no\":\"13\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Indices\",\"stem\":\"If 2\u003csup\u003ex\u003c/sup\u003e = 16, then x =\",\"blanks\":[{\"id\":\"q13a\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"4\",\"explanation\":\"16 = 2\u003csup\u003e4\u003c/sup\u003e.\"},{\"id\":\"q14\",\"no\":\"14\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Sequences\",\"stem\":\"The sum of the first 10 terms of 5, 8, 11, … is\",\"blanks\":[{\"id\":\"q14a\",\"answer\":\"185\",\"accepted\":[\"185\"]}],\"answer\":\"185\",\"explanation\":\"S\u003csub\u003e10\u003c/sub\u003e = 10/2 × [2×5 + 9×3] = 5 × 37 = 185.\"},{\"id\":\"q15\",\"no\":\"15\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The midpoint of (2, 3) and (8, 7) is\",\"blanks\":[{\"id\":\"q15a\",\"answer\":\"(5,5)\",\"accepted\":[\"(5,5)\",\"(5, 5)\",\"5,5\"]}],\"answer\":\"(5, 5)\",\"explanation\":\"((2+8)/2, (3+7)/2) = (5, 5).\"},{\"id\":\"q16\",\"no\":\"16\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Logarithms\",\"stem\":\"log\u003csub\u003e2\u003c/sub\u003e 32 =\",\"blanks\":[{\"id\":\"q16a\",\"answer\":\"5\",\"accepted\":[\"5\"]}],\"answer\":\"5\",\"explanation\":\"2\u003csup\u003e5\u003c/sup\u003e = 32.\"},{\"id\":\"q17\",\"no\":\"17\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Coordinate geometry\",\"stem\":\"The equation of the line through (0, 2) with slope 3 is y =\",\"blanks\":[{\"id\":\"q17a\",\"answer\":\"3x+2\",\"accepted\":[\"3x+2\",\"3x + 2\"]}],\"answer\":\"3x + 2\",\"explanation\":\"y − 2 = 3(x − 0).\"},{\"id\":\"q18\",\"no\":\"18\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"The range of 3, 7, 7, 10, 13 is\",\"blanks\":[{\"id\":\"q18a\",\"answer\":\"10\",\"accepted\":[\"10\"]}],\"answer\":\"10\",\"explanation\":\"13 − 3 = 10.\"},{\"id\":\"q19\",\"no\":\"19\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Trigonometry\",\"stem\":\"cos 60° =\",\"blanks\":[{\"id\":\"q19a\",\"answer\":\"1/2\",\"accepted\":[\"1/2\",\"0.5\"]}],\"answer\":\"1/2\",\"explanation\":\"cos 60° = 1/2.\"},{\"id\":\"q20\",\"no\":\"20\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Functions\",\"stem\":\"The inverse of y = 2x − 1 is y =\",\"blanks\":[{\"id\":\"q20a\",\"answer\":\"(x+1)/2\",\"accepted\":[\"(x+1)/2\",\"(x + 1)/2\",\"x/2+1/2\"]}],\"answer\":\"(x + 1)/2\",\"explanation\":\"x = 2y − 1, y = (x + 1)/2.\"}]},{\"id\":\"calc\",\"title\":\"Section C  Conventional Questions\",\"instruction\":\"6 marks each. Total 30 marks. Show your working.\",\"marks\":30,\"questions\":[{\"id\":\"q21\",\"no\":\"21\",\"type\":\"work\",\"marks\":6,\"skill\":\"Quadratic equations\",\"lines\":7,\"stem\":\"Solve x\u003csup\u003e2\u003c/sup\u003e − 3x − 10 = 0 by the quadratic formula.\",\"answer\":\"x = 5 or x = −2\",\"explanation\":\"Δ = 9 + 40 = 49. x = (3 ± 7)/2 = 5 or −2.\",\"marking\":\"Discriminant 2 marks; both roots 4 marks.\"},{\"id\":\"q22\",\"no\":\"22\",\"type\":\"work\",\"marks\":6,\"skill\":\"Polynomials\",\"lines\":6,\"stem\":\"Find the remainder when 2x\u003csup\u003e3\u003c/sup\u003e − 3x + 5 is divided by x + 1.\",\"answer\":\"6\",\"explanation\":\"f(−1) = −2 + 3 + 5 = 6.\",\"marking\":\"Substitute x = −1, 3 marks; value 3 marks.\"},{\"id\":\"q23\",\"no\":\"23\",\"type\":\"work\",\"marks\":6,\"skill\":\"Coordinate geometry\",\"lines\":7,\"stem\":\"Find the equation of the straight line through A(1, 2) and B(5, 8).\",\"answer\":\"y − 2 = (3/2)(x − 1)  or  3x − 2y + 1 = 0\",\"explanation\":\"Slope = 6/4 = 3/2. y − 2 = (3/2)(x − 1).\",\"marking\":\"Slope 3 marks; equation 3 marks.\"},{\"id\":\"q24\",\"no\":\"24\",\"type\":\"work\",\"marks\":6,\"skill\":\"Trigonometry\",\"lines\":6,\"stem\":\"In △ABC, ∠C = 90° and ∠A = 30°. AB = 10 cm. Find BC.\",\"answer\":\"5 cm\",\"explanation\":\"AB is the hypotenuse. BC is opposite 30°, so BC = 5.\",\"marking\":\"Identify hypotenuse 2 marks; 5 cm 4 marks.\"},{\"id\":\"q25\",\"no\":\"25\",\"type\":\"work\",\"marks\":6,\"skill\":\"Sequences\",\"lines\":6,\"stem\":\"A geometric sequence has first term 3 and common ratio 2. Find S\u003csub\u003e6\u003c/sub\u003e.\",\"answer\":\"189\",\"explanation\":\"S\u003csub\u003e6\u003c/sub\u003e = 3(2\u003csup\u003e6\u003c/sup\u003e − 1)/(2 − 1) = 3 × 63 = 189.\",\"marking\":\"Formula 3 marks; 189 3 marks.\"}]},{\"id\":\"solve\",\"title\":\"Section D  Structured Questions\",\"instruction\":\"10 marks each. Total 30 marks. Set up equations. Include units.\",\"marks\":30,\"questions\":[{\"id\":\"q26\",\"no\":\"26\",\"type\":\"work\",\"marks\":10,\"skill\":\"Quadratic equations\",\"lines\":8,\"stem\":\"The length of a rectangle is 3 cm more than its width. The area is 40 cm\u003csup\u003e2\u003c/sup\u003e.\u003cbr/\u003e(a) Let the width be w cm. Write an equation in w.\u003cbr/\u003e(b) Find the width and the length.\",\"answer\":\"(a) w(w + 3) = 40; (b) width 5 cm, length 8 cm\",\"explanation\":\"w² + 3w − 40 = 0, (w + 8)(w − 5) = 0, w = 5 (positive).\",\"marking\":\"(a) 4 marks; (b) 6 marks.\"},{\"id\":\"q27\",\"no\":\"27\",\"type\":\"work\",\"marks\":10,\"skill\":\"Coordinate geometry\",\"lines\":8,\"stem\":\"A circle has centre (2, −1) and radius 5.\u003cbr/\u003e(a) Write the equation of the circle.\u003cbr/\u003e(b) Show that the point (5, 3) lies on the circle.\",\"answer\":\"(a) (x − 2)² + (y + 1)² = 25; (b) 3² + 4² = 25\",\"explanation\":\"(5 − 2)² + (3 + 1)² = 9 + 16 = 25.\",\"marking\":\"(a) 5 marks; (b) 5 marks.\"},{\"id\":\"q28\",\"no\":\"28\",\"type\":\"work\",\"marks\":10,\"skill\":\"Trigonometry\",\"lines\":8,\"stem\":\"The sides of a triangle are 5 cm, 5√3 cm and 10 cm.\u003cbr/\u003e(a) Show that the triangle is right-angled.\u003cbr/\u003e(b) Find the area of the triangle.\",\"answer\":\"(a) 5² + (5√3)² = 100 = 10²; (b) 12.5√3 cm²\",\"explanation\":\"30-60-90. Area = (1/2)×5×5√3 = 25√3/2.\",\"marking\":\"(a) 5 marks; (b) 5 marks.\"}]},{\"id\":\"extra\",\"title\":\"Section E  Extension\",\"instruction\":\"10 marks in total. Not included in the 100 marks.\",\"marks\":10,\"extra\":true,\"questions\":[{\"id\":\"q29\",\"no\":\"29\",\"type\":\"work\",\"marks\":5,\"skill\":\"Logarithms\",\"lines\":6,\"stem\":\"Solve log\u003csub\u003e2\u003c/sub\u003e x + log\u003csub\u003e2\u003c/sub\u003e (x − 2) = 3, where x \u0026gt; 2.\",\"answer\":\"x = 4\",\"explanation\":\"log\u003csub\u003e2\u003c/sub\u003e[x(x − 2)] = 3, x(x − 2) = 8, x² − 2x − 8 = 0, (x − 4)(x + 2) = 0. x = 4.\",\"marking\":\"Combine logs 2 marks; quadratic 2 marks; reject x = −2, 1 mark.\"},{\"id\":\"q30\",\"no\":\"30\",\"type\":\"work\",\"marks\":5,\"skill\":\"Inequalities\",\"lines\":6,\"stem\":\"Solve x\u003csup\u003e2\u003c/sup\u003e − 5x + 6 \u0026lt; 0.\",\"answer\":\"2 \u0026lt; x \u0026lt; 3\",\"explanation\":\"(x − 2)(x − 3) \u0026lt; 0, so 2 \u0026lt; x \u0026lt; 3.\",\"marking\":\"Factors 2 marks; interval 3 marks.\"}]}]}}]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nf:I[27201,[\"/William-math/_next/static/chunks/3fntmmi971322.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"尹健熙 · Classroom\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"尹健熙 classroom: DSE mathematics papers, and Reading Explorer 3 as an on-site reading book.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/William-math/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Lf\",\"3\",{}]]\n"])</script></body></html>

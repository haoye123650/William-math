_next/static/chunks/1ahwwad464sys.js\"],\"AnswersView\"]\n8:C\n4:[\"$\",\"$Le\",null,{\"paper\":{\"id\":\"junior-02\",\"title\":\"Junior Mixed Quiz Paper 02\",\"stars\":3,\"level\":\"S.1–S.3\",\"blurb\":\"Ratio, factorization, simultaneous equations, Pythagoras, indices, area and volume. About 30% S.1, 40% S.2 and 30% S.3.\",\"durationMin\":45,\"totalMarks\":20,\"extraMarks\":0,\"materials\":\"Pen and rough paper. Calculators are not allowed.\",\"notes\":[\"About 30% S.1, 40% S.2 and 30% S.3. The level tag on each question is [S1], [S2] or [S3].\",\"Each question is 1 mark. Write the final answer in the form the question asks for.\",\"Spacing is ignored when an answer is marked. A different algebraic form is marked wrong unless the key lists it.\"],\"sections\":[{\"id\":\"A\",\"title\":\"Section A  Short answers\",\"instruction\":\"Answer every question. For multiple choice, choose the best answer. For a blank, write the final answer only. True or false is a choice of True or False.\",\"marks\":13,\"questions\":[{\"id\":\"A1\",\"no\":\"A1\",\"type\":\"fill\",\"stem\":\"If 3 : 5 = 6 : x, then x = ____\",\"marks\":1,\"skill\":\"Rate and ratio\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"A1-a\",\"answer\":\"10\",\"accepted\":[\"10\"]}],\"answer\":\"10\",\"explanation\":\"3/5 = 6/x, so 3x = 30 and x = 10.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A2\",\"no\":\"A2\",\"type\":\"choice\",\"stem\":\"Factorize: 6x + 9\",\"marks\":1,\"skill\":\"Factorization\",\"levelTag\":\"S1\",\"options\":[{\"key\":\"A\",\"text\":\"3(2x+3)\"},{\"key\":\"B\",\"text\":\"6(x+9)\"},{\"key\":\"C\",\"text\":\"3(2x+9)\"},{\"key\":\"D\",\"text\":\"2(3x+9)\"}],\"answer\":\"A\",\"explanation\":\"The highest common factor is 3, so 6x + 9 = 3(2x + 3).\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A3\",\"no\":\"A3\",\"type\":\"fill\",\"stem\":\"A car travels 120 km in 2 hours. Its average speed is ____ km/h.\",\"marks\":1,\"skill\":\"Rate and ratio\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"A3-a\",\"answer\":\"60\",\"accepted\":[\"60\"]}],\"answer\":\"60\",\"explanation\":\"Average speed = 120 ÷ 2 = 60 km/h.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A4\",\"no\":\"A4\",\"type\":\"choice\",\"stem\":\"True or False: In a right-angled triangle with legs 3 and 4, the hypotenuse is 5.\",\"marks\":1,\"skill\":\"Pythagoras\",\"levelTag\":\"S1\",\"options\":[{\"key\":\"True\",\"text\":\"True\"},{\"key\":\"False\",\"text\":\"False\"}],\"answer\":\"True\",\"explanation\":\"3² + 4² = 25 = 5². The statement is true.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A5\",\"no\":\"A5\",\"type\":\"fill\",\"stem\":\"Evaluate: 2³ × 2² = ____ (write as a power of 2, e.g. 2^5)\",\"marks\":1,\"skill\":\"Indices\",\"levelTag\":\"S1\",\"blanks\":[{\"id\":\"A5-a\",\"answer\":\"2^5\",\"accepted\":[\"2^5\"]}],\"answer\":\"2^5\",\"explanation\":\"When multiplying powers with the same base, add the indices: 2^(3 + 2) = 2^5.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A6\",\"no\":\"A6\",\"type\":\"fill\",\"stem\":\"The area of a rectangle 8 cm by 5 cm is ____ cm².\",\"marks\":1,\"skill\":\"Area and volume\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A6-a\",\"answer\":\"40\",\"accepted\":[\"40\"]}],\"answer\":\"40\",\"explanation\":\"Area = 8 × 5 = 40.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A7\",\"no\":\"A7\",\"type\":\"fill\",\"stem\":\"Factorize: x² − 9\",\"marks\":1,\"skill\":\"Factorization\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A7-a\",\"answer\":\"(x-3)(x+3)\",\"accepted\":[\"(x-3)(x+3)\"]}],\"answer\":\"(x-3)(x+3)\",\"explanation\":\"Difference of squares: x² − 9 = (x − 3)(x + 3).\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A8\",\"no\":\"A8\",\"type\":\"fill\",\"stem\":\"Solve the system: x + y = 7, x − y = 1. Give x. x = ____\",\"marks\":1,\"skill\":\"Simultaneous equations\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A8-a\",\"answer\":\"4\",\"accepted\":[\"4\"]}],\"answer\":\"4\",\"explanation\":\"Adding the equations gives 2x = 8, so x = 4.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A9\",\"no\":\"A9\",\"type\":\"choice\",\"stem\":\"A ladder leans against a wall. Base is 5 m from wall, ladder length 13 m. Height up the wall is\",\"marks\":1,\"skill\":\"Pythagoras\",\"levelTag\":\"S2\",\"options\":[{\"key\":\"A\",\"text\":\"8 m\"},{\"key\":\"B\",\"text\":\"12 m\"},{\"key\":\"C\",\"text\":\"10 m\"},{\"key\":\"D\",\"text\":\"18 m\"}],\"answer\":\"B\",\"explanation\":\"h² + 5² = 13², so h² = 144 and h = 12.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A10\",\"no\":\"A10\",\"type\":\"fill\",\"stem\":\"Simplify: (3²)³ = ____ (as a single power of 3, e.g. 3^6)\",\"marks\":1,\"skill\":\"Indices\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A10-a\",\"answer\":\"3^6\",\"accepted\":[\"3^6\"]}],\"answer\":\"3^6\",\"explanation\":\"(a^m)^n = a^(mn), so (3²)³ = 3^6.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A11\",\"no\":\"A11\",\"type\":\"fill\",\"stem\":\"The volume of a cuboid 4×3×5 (cm) is ____ cm³.\",\"marks\":1,\"skill\":\"Area and volume\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A11-a\",\"answer\":\"60\",\"accepted\":[\"60\"]}],\"answer\":\"60\",\"explanation\":\"Volume = 4 × 3 × 5 = 60.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A12\",\"no\":\"A12\",\"type\":\"fill\",\"stem\":\"Divide $360 in the ratio 2 : 3. The larger share is $____.\",\"marks\":1,\"skill\":\"Rate and ratio\",\"levelTag\":\"S2\",\"blanks\":[{\"id\":\"A12-a\",\"answer\":\"216\",\"accepted\":[\"216\"]}],\"answer\":\"216\",\"explanation\":\"There are 5 parts. The larger share is (3/5) × 360 = 216.\",\"assetIds\":[],\"imagePlacement\":null},{\"id\":\"A13\",\"no\":\"A13\",\"type\":\"fill\",\"stem\":\"Solve: 2x + y = 11, 3x − 2y = 6. Give y. y = ____\",\"marks\":1,\"skill\":\"Simultaneous equations\",\"levelTag\":\"S3\",\"blanks\":[{\"id\":\"A13-a\",\"answer\":\"3\",\"accepted\":[\"3\"]}],\"answer\":\"3\",\"explanation\":\"From the first equation, y = 11 − 2x. Substitute: 3x − 2(11 − 2

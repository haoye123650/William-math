build accuracy with integers, fractions, percentages and simple word problems.\"}],\"tutorTips\":[\"Q1 and Q21 test (−a)² versus −a², and powers before multiplication. If both are wrong, spend a lesson on directed numbers.\",\"Q2 and Q22 test order of operations. If multiplication/division still fail, delay polynomials.\",\"Q23 and Q24 are equations. If the student cannot multiply through by the LCM, reteach ‘do the same to both sides’.\",\"Q26 is successive percentage change. A common error is to take the second discount from the original price.\",\"Q28 splits ‘formula’ from ‘reading a diagram’. Part (c) needs triangle ABD, not only ABC.\"],\"sections\":[{\"id\":\"mc\",\"title\":\"Section A  Multiple Choice\",\"instruction\":\"2 marks each. Total 20 marks. Choose the best answer.\",\"marks\":20,\"questions\":[{\"id\":\"q1\",\"no\":\"1\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"Find the value of (−3)\u003csup\u003e2\u003c/sup\u003e − 3\u003csup\u003e2\u003c/sup\u003e.\",\"options\":[{\"key\":\"A\",\"text\":\"0\"},{\"key\":\"B\",\"text\":\"18\"},{\"key\":\"C\",\"text\":\"−18\"},{\"key\":\"D\",\"text\":\"9\"}],\"answer\":\"A\",\"explanation\":\"(−3)² = 9 and 3² = 9, so 9 − 9 = 0. Treating it as −3² − 3² gives −18 (option C).\"},{\"id\":\"q2\",\"no\":\"2\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"Find the value of \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e × \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e3\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e.\",\"options\":[{\"key\":\"A\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"B\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e8\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e5\u003c/span\u003e\u003cspan\u003e12\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e12\u003c/span\u003e\u003c/span\u003e\"}],\"answer\":\"A\",\"explanation\":\"Multiply first: \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e × \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e3\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e. Then \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e. Subtracting first leads to C.\"},{\"id\":\"q3\",\"no\":\"3\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Equations\",\"stem\":\"If 3(x − 2) = 2x + 1, then x =\",\"options\":[{\"key\":\"A\",\"text\":\"3\"},{\"key\":\"B\",\"text\":\"5\"},{\"key\":\"C\",\"text\":\"7\"},{\"key\":\"D\",\"text\":\"−5\"}],\"answer\":\"C\",\"explanation\":\"3x − 6 = 2x + 1, so x = 7.\"},{\"id\":\"q4\",\"no\":\"4\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"Which of the following is correct?\",\"options\":[{\"key\":\"A\",\"text\":\"|−5| − |3| = −8\"},{\"key\":\"B\",\"text\":\"(−2) × (−3) × (−1) = −6\"},{\"key\":\"C\",\"text\":\"(−8) ÷ (−2) ÷ (−2) = 2\"},{\"key\":\"D\",\"text\":\"−|−4| = 4\"}],\"answer\":\"B\",\"explanation\":\"A should be 2. C is 4 ÷ (−2) = −2. D is −4. The product of three negative numbers is negative, so B is correct.\"},{\"id\":\"q5\",\"no\":\"5\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The difference between the supplement and the complement of a 40° angle is\",\"options\":[{\"key\":\"A\",\"text\":\"40°\"},{\"key\":\"B\",\"text\":\"50°\"},{\"key\":\"C\",\"text\":\"90°\"},{\"key\":\"D\",\"text\":\"140°\"}],\"answer\":\"C\",\"explanation\":\"Supplement = 140°, complement = 50°, difference = 90°. The supplement of any angle is 90° larger than its complement.\"},{\"id\":\"q6\",\"no\":\"6\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The two shorter sides of a right-angled triangle are 6 cm and 8 cm. The hypotenuse is\",\"options\":[{\"key\":\"A\",\"text\":\"7 cm\"},{\"key\":\"B\",\"text\":\"10 cm\"},{\"key\":\"C\",\"text\":\"14 cm\"},{\"key\":\"D\",\"text\":\"48 cm\"}],\"answer\":\"B\",\"explanation\":\"By Pythagoras’ theorem, √(36 + 64) = √100 = 10. This is a 3-4-5 triangle scaled by 2.\"},{\"id\":\"q7\",\"no\":\"7\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"A rectangle measures 12 cm by 5 cm. The length of a diagonal is\",\"options\":[{\"key\":\"A\",\"text\":\"7 cm\"},{\"key\":\"B\",\"text\":\"13 cm\"},{\"key\":\"C\",\"text\":\"17 cm\"},{\"key\":\"D\",\"text\":\"60 cm\"}],\"answer\":\"B\",\"explanation\":\"√(144 + 25) = √169 = 13 (a 5-12-13 triangle).\"},{\"id\":\"q8\",\"no\":\"8\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"Which of the following numbers is the smallest?\",\"options\":[{\"key\":\"A\",\"text\":\"−0.5\"},{\"key\":\"B\",\"text\":\"−2\"},{\"key\":\"C\",\"text\":\"0\"},{\"key\":\"D\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e\"}],\"answer\":\"B\",\"explanation\":\"On the number line, further left is smaller: −2 \u003c −0.5 \u003c 0 \u003c 1/3.\"},{\"id\":\"q9\",\"no\":\"9\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Approximation\",\"stem\":\"3.14159 correct to 3 significant figures is\",\"options\":[{\"key\":\"A\",\"text\":\"3.14\"},{\"key\":\"B\",\"text\":\"3.141\"},{\"key\":\"C\",\"text\":\"3.142\"},{\"key\":\"D\",\"text\":\"3.15\"}],\"answer\":\"A\",\"explanation\":\"The first three significant figures are 3.14. The next digit is 1, so do not round up. 3.142 is 3 d.p., not 3 s.f.\"},{\"id\":\"q10\",\"no\":\"10\",\"type\":\"choice\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"A fair coin is tossed twice. The probability of getting two heads is\",\"options\":[{\"key\":\"A\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"B\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"C\",\"text\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e\"},{\"key\":\"D\",\"text\":\"1\"}],\"answer\":\"C\",\"explanation\":\"Four equally likely outcomes: HH, HT, TH, TT. So P(HH) = 1/4.\"}]},{\"id\":\"fill\",\"title\":\"Section B  Short Questions\",\"instruction\":\"2 marks each. Total 20 marks. Working is not required. For two blanks, 1 mark each.\",\"marks\":20,\"questions\":[{\"id\":\"q11\",\"no\":\"11\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Directed numbers\",\"stem\":\"|−12| + |5 − 17| =\",\"blanks\":[{\"id\":\"q11a\",\"answer\":\"24\",\"accepted\":[\"24\"]}],\"answer\":\"24\",\"explanation\":\"12 + 12 = 24. Do not drop the absolute value on 5 − 17 = −12.\"},{\"id\":\"q12\",\"no\":\"12\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Percentages\",\"stem\":\"0.125 = ________ % = ________ (in simplest form)\",\"blanks\":[{\"id\":\"q12a\",\"label\":\"percentage\",\"answer\":\"12.5\",\"accepted\":[\"12.5\",\"12.50\"]},{\"id\":\"q12b\",\"label\":\"fraction\",\"answer\":\"1/8\",\"accepted\":[\"1/8\",\"⅛\"]}],\"answer\":\"12.5%; 1/8\",\"explanation\":\"0.125 × 100 = 12.5; 0.125 = 1/8. 1 mark per blank.\",\"marking\":\"Both blanks 2 marks; one blank 1 mark.\"},{\"id\":\"q13\",\"no\":\"13\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Percentages\",\"stem\":\"Two numbers are in the ratio 2 : 5. Their sum is 49. The larger number is\",\"blanks\":[{\"id\":\"q13a\",\"answer\":\"35\",\"accepted\":[\"35\"]}],\"answer\":\"35\",\"explanation\":\"2 + 5 = 7 parts. Each part is 7. The larger share is 5 × 7 = 35.\"},{\"id\":\"q14\",\"no\":\"14\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"For the monomial −3x\u003csup\u003e2\u003c/sup\u003ey, the coefficient is ________ and the degree is ________.\",\"blanks\":[{\"id\":\"q14a\",\"label\":\"coefficient\",\"answer\":\"−3\",\"accepted\":[\"-3\",\"−3\"]},{\"id\":\"q14b\",\"label\":\"degree\",\"answer\":\"3\",\"accepted\":[\"3\"]}],\"answer\":\"coefficient −3; degree 3\",\"explanation\":\"Keep the sign in the coefficient. Degree = 2 + 1 = 3, not the index 2 alone.\",\"marking\":\"Both blanks 2 marks; one blank 1 mark.\"},{\"id\":\"q15\",\"no\":\"15\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Algebra\",\"stem\":\"If a = −2 and b = 3, then 2a\u003csup\u003e2\u003c/sup\u003e − ab =\",\"blanks\":[{\"id\":\"q15a\",\"answer\":\"14\",\"accepted\":[\"14\"]}],\"answer\":\"14\",\"explanation\":\"2 × 4 − (−2)(3) = 8 + 6 = 14. a² is 4, not −4.\"},{\"id\":\"q16\",\"no\":\"16\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"Two interior angles of a triangle are 50° and 70°. The third interior angle is ________ °.\",\"blanks\":[{\"id\":\"q16a\",\"answer\":\"60\",\"accepted\":[\"60\",\"60°\"]}],\"answer\":\"60\",\"explanation\":\"180 − 50 − 70 = 60.\"},{\"id\":\"q17\",\"no\":\"17\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Approximation\",\"stem\":\"Round 2.746 to 1 decimal place.\",\"blanks\":[{\"id\":\"q17a\",\"answer\":\"2.7\",\"accepted\":[\"2.7\",\"2.70\"]}],\"answer\":\"2.7\",\"explanation\":\"The tenths digit is 7; the next digit is 4, so do not round up.\"},{\"id\":\"q18\",\"no\":\"18\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Statistics\",\"stem\":\"For the data 6, 8, 8, 10, 13, the mean is ________ and the mode is ________.\",\"blanks\":[{\"id\":\"q18a\",\"label\":\"mean\",\"answer\":\"9\",\"accepted\":[\"9\"]},{\"id\":\"q18b\",\"label\":\"mode\",\"answer\":\"8\",\"accepted\":[\"8\"]}],\"answer\":\"mean 9; mode 8\",\"explanation\":\"Sum = 45, mean = 9. 8 appears twice, so it is the mode.\",\"marking\":\"Both blanks 2 marks; one blank 1 mark.\"},{\"id\":\"q19\",\"no\":\"19\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"In the rectangular coordinate plane, the point (3, −2) lies in quadrant ________.\",\"blanks\":[{\"id\":\"q19a\",\"answer\":\"IV\",\"accepted\":[\"4\",\"iv\",\"IV\",\"fourth\",\"4th\",\"quadrant iv\",\"quadrant 4\"]}],\"answer\":\"IV (4th)\",\"explanation\":\"x \u003e 0 and y \u003c 0, so quadrant IV.\"},{\"id\":\"q20\",\"no\":\"20\",\"type\":\"fill\",\"marks\":2,\"skill\":\"Geometry\",\"stem\":\"The radius of a circle is 7 cm. Its circumference is ________ cm. (Leave the answer in terms of π.)\",\"blanks\":[{\"id\":\"q20a\",\"answer\":\"14π\",\"accepted\":[\"14π\",\"14pi\",\"14*π\",\"14*pi\",\"14×π\"]}],\"answer\":\"14π\",\"explanation\":\"C = 2πr = 14π. Do not give the area 49π.\"}]},{\"id\":\"calc\",\"title\":\"Section C  Conventional Questions\",\"instruction\":\"6 marks each. Total 30 marks. Show your working.\",\"marks\":30,\"questions\":[{\"id\":\"q21\",\"no\":\"21\",\"type\":\"work\",\"marks\":6,\"skill\":\"Directed numbers\",\"lines\":6,\"stem\":\"Find the value of (−2)\u003csup\u003e3\u003c/sup\u003e − (−2)\u003csup\u003e2\u003c/sup\u003e × 3.\",\"answer\":\"−20\",\"explanation\":\"(−2)³ = −8, (−2)² = 4.\u003cbr/\u003eExpression = −8 − 4 × 3 = −8 − 12 = −20.\u003cbr/\u003eCommon errors: subtracting first to get −36, or taking (−2)³ as 8.\",\"marking\":\"Powers correct 2 marks; order of operations and −20 a further 4 marks. Answer only: at most 2 marks.\"},{\"id\":\"q22\",\"no\":\"22\",\"type\":\"work\",\"marks\":6,\"skill\":\"Directed numbers\",\"lines\":6,\"stem\":\"Find the value of (\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e) ÷ \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/span\u003e + 0.25.\",\"answer\":\"5/4 or 1.25\",\"explanation\":\"\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e2\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/span\u003e\u003cbr/\u003e(\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/span\u003e) ÷ (\u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e1\u003c/span\u003e\u003cspan\u003e6\u003c/span\u003e\u003c/span\u003e) = 1\u003cbr/\u003e1 + 0.25 = 1.25 = \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003e5\u003c/span\u003e\u003cspan\u003e4\u003c/span\u003e\u003c/span\u003e\",\"marking\":\"Subtraction in brackets 2 marks; division 2 marks; final value 2 marks. 1.25 and 5/4 both accepted.\"},{\"id\":\"q23\",\"no\":\"23\",\"type\":\"work\",\"marks\":6,\"skill\":\"Equations\",\"lines\":7,\"stem\":\"Solve \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003ex − 3\u003c/span\u003e\u003cspan\u003e2\u003c/span\u003e\u003c/span\u003e − \u003cspan class=\\\"frac\\\"\u003e\u003cspan\u003ex + 1\u003c/span\u003e\u003cspan\u003e3\u003c/span\u003e\u003c/span\u003e = 1.\",\"answer\":\"x = 17\",\"explanation\":\"Multiply both sides by 6: 3(x − 3) − 2(x + 1) = 6\u003cbr/\u003e3x − 9 − 2x − 2 = 6\u003cbr/\u003ex − 11 = 6\u003cbr/\u003ex = 17\",\"marking\":\"Clearing denominators 2 marks; expanding 2 marks; x = 17 a further 2 marks. Sign error when transposing: −2.\"},{\"id\":\"q24\",\"no\":\"24\",\"type\":\"work\",\"marks\":6,\"skill\":\"Equations\",\"lines\":6,\"stem\":\"Solve 2(3x − 1) = 5x + 8.\",\"answer\":\"x = 10\",\"explanation\":\"6x − 2 = 5x + 8\u003cbr/\u003e6x − 5x = 8 + 2\u003cbr/\u003ex = 10\",\"marking\":\"Expand 2 marks; collect terms 2 marks; x = 10 a further 2 marks.\"},{\"id\":\"q25\",\"no\":\"25\",\"type\":\"work\",\"marks\":6,\"skill\":\"Algebra\",\"lines\":6,\"stem\":\"Simplify 3a − 2(a − b) + 4b, then find its value when a = −1 and b = 2.\",\"answer\":\"11\",\"explanation\":\"3a − 2a + 2b + 4b = a + 6b\u003cbr/\u003eSubstitute: −1 + 12 = 11\",\"marking\":\"Expanding with the sign change 2 marks; simplified form a + 6b 2 marks; 11 a further 2 marks. Direct substitution that reaches 11 may receive full marks.\"}]},{\"id\":\"solve\",\"title\":\"Section D  Structured Questions\",\"instruction\":\"10 marks each. Total 30 marks. Set up equations or expressions. Include units.\",\"marks\":30,\"questions\":[{\"id\":\"q26\",\"no\":\"26\",\"type\":\"work\",\"marks\":10,\"skill\":\"Percentages\",\"lines\":8,\"stem\":\"A school bag is priced at $200. It is first sold at 20% off, then a further $20 is taken off.\u003cbr/\u003e(a) Find the selling price.\u003cbr/\u003e(b) The selling price is what percentage of the original price?\",\"answer\":\"(a) $140; (b) 70%\",\"explanation\":\"(a) 200 × 0.8 = 160, 160 − 20 = 140.\u003cbr/\u003e(b) 140 ÷ 200 = 0.7 = 70%.\u003cbr/\u003eCommon error: 200 × 0.8 × 0.2, or subtracting $20 before the 20% off.\",\"marking\":\"(a) 20% off 3 marks, then subtract 20 a further 3 marks; (b) 4 marks. ‘70% of the original’ or ‘30% off overall’ both accepted.\"},{\"id\":\"q27\",\"no\":\"27\",\"type\":\"work\",\"marks\":10,\"skill\":\"Equations\",\"lines\":8,\"stem\":\"Towns A and B are 240 km apart. Car A travels at 60 km/h and car B at 40 km/h. They set off at the same time towards each other.\u003cbr/\u003e(a) How long does it take them to meet?\u003cbr/\u003e(b) How far has car A travelled when they meet?\",\"answer\":\"(a) 2.4 h (2 h 24 min); (b) 144 km\",\"explanation\":\"(a) 240 ÷ (60 + 40) = 2.4 h = 2 hours 24 minutes.\u003cbr/\u003e(b) 60 × 2.4 = 144 km.\",\"marking\":\"(a) 6 marks; (b) 4 marks. 2.4 h and 2 h 24 min both accepted. 2 h 40 min treats 0.4 h as 40 minutes: deduct 3 marks.\"},{\"id\":\"q28\",\"no\":\"28\",\"type\":\"work\",\"marks\":10,\"skill\":\"Geometry\",\"lines\":8,\"diagram\":\"triangle\",\"stem\":\"In the figure, D lies on BC and AD bisects ∠BAC. ∠ABC = 50° and ∠ACB = 70°.\u003cbr/\u003e(a) Find ∠BAC.\u003cbr/\u003e(b) Find ∠BAD.\u003cbr/\u003e(c) Find ∠ADB.\",\"answer\":\"(a) 60°; (b) 30°; (c) 100°\",\"explanation\":\"(a) ∠BAC = 180° − 50° − 70° = 60°.\u003cbr/\u003e(b) AD bisects ∠BAC, so ∠BAD = 30°.\u003cbr/\u003e(c) In △ABD, ∠ADB = 180° − 50° − 30° = 100°.\u003cbr/\u003eAlternatively, ∠ADC = 80°, then adjacent angles on a straight line give 100°.\",\"marking\":\"3 marks for each part, plus 1 mark for clear working. Part (c) tests whether the student can split the figure.\"}]},{\"id\":\"extra\",\"title\":\"Section E  Extension\",\"instruction\":\"10 marks in total. Not included in the 100 marks. Use an equation where asked.\",\"marks\":10,\"extra\":true,\"questions\":[{\"id\":\"q29\",\"no\":\"29\",\"type\":\"work\",\"marks\":5,\"skill\":\"Percentages\",\"lines\":6,\"stem\":\"A jacket is priced at $480. During a sale it is 25% off. A further 10% discount is given if the customer pays in cash. How much does a customer pay in cash?\",\"answer\":\"$$324\",\"explanation\":\"480 × 0.75 = 360; 360 × 0.9 = 324. The second 10% is taken from $360, not from $480.\",\"marking\":\"Reading successive discounts 2 marks; $324 a further 3 marks. 480 × 0.65 = 312 means the two discounts were added.\"},{\"id\":\"q30\",\"no\":\"30\",\"type\":\"work\",\"marks\":5,\"skill\":\"Equations\",\"lines\":6,\"stem\":\"The sum of two consecutive odd numbers is 96. Find the two numbers. Set up an equation.\",\"answer\":\"47 and 49\",\"explanation\":\"Let the smaller be n. Then n + (n + 2) = 96, 2n = 94, n = 47. The numbers are 47 and 49.\",\"marking\":\"Equation 2 marks; both numbers 3 marks. 47 and 48 misses ‘consecutive odd’.\"}]}]}}]\na:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nf:I[27201,[\"/William-math/_next/static/chunks/3fntmmi971322.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"尹健熙 · Pui Kiu Mathematics\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"尹健熙 Pui Kiu Mathematics: S.1 to DSE papers, with online sitting, print, and mark scheme.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"icon\",\"href\":\"/William-math/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$Lf\",\"3\",{}]]\n"])</script></body></html>
